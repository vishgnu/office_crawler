<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<title>Office Crawler</title>
<style>:root { color-scheme: dark; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #07080c; color: #e8ecf6; font: 16px/1.4 system-ui, sans-serif; }
canvas { display: block; position: fixed; inset: 0; touch-action: none; user-select: none; }
#overlay { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
#overlay.loading { display: grid; place-items: center; font-size: 20px; color: #9aa6c0; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; pointer-events: auto; text-align: center; padding: 16px; box-sizing: border-box; animation: fade-in 0.45s ease-out both; }
.screen.title { background: radial-gradient(ellipse at center, rgba(7, 8, 12, 0.15), rgba(7, 8, 12, 0.55)); }
.title-art { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.title-art .art { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.92; }
.title-art .tall { display: none; }
@media (max-aspect-ratio: 1/1) { .title-art .wide { display: none; } .title-art .tall { display: block; } }
.screen.title:not(.confirm) .panel { position: relative; z-index: 1; }
.goal { margin: -6px 0 10px; max-width: 46ch; color: #ffe8a8; font-size: calc(16px * var(--ts, 1)); font-style: italic; line-height: 1.35; }
.screen.title .panel { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 28px 40px 22px; max-width: min(94vw, 860px); box-sizing: border-box; background: rgba(7, 8, 12, 0.72); border: 2px solid #2b3550; border-radius: 14px; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.55); }
.screen.pause { background: rgba(7, 8, 12, 0.72); }
/* By design the death screen is fully present (and swallows clicks) during its 0.5 s fade-in delay: the player sees the final frame, and stray clicks cannot hit Restart by accident. */
.screen.dead { background: radial-gradient(ellipse at center, rgba(60, 4, 10, 0.55), rgba(7, 8, 12, 0.9)); animation: none; }
.dead .btn { pointer-events: none; animation: unlock 0s 0.5s forwards; }
@keyframes unlock { to { pointer-events: auto; } }
.summary { display: flex; gap: 28px; margin: 4px 0 10px; padding: 10px 24px; background: rgba(7, 8, 12, 0.6); border: 2px solid #4a2a3a; border-radius: 10px; }
.summary div { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.summary dt { color: #d3a9b0; font-size: calc(14px * var(--ts, 1)); letter-spacing: 0.08em; text-transform: uppercase; }
.summary dd { margin: 0; color: #fff; font-size: calc(28px * var(--ts, 1)); font-weight: 700; font-variant-numeric: tabular-nums; }
.screen.error { background: rgba(7, 8, 12, 0.92); }
h1 { margin: 0; font-size: calc(clamp(32px, 6vw, 64px) * var(--ts, 1)); letter-spacing: 0.04em; text-transform: uppercase; color: #dfe5f5; text-shadow: 0 3px 0 #0a0c12, 0 0 24px rgba(120, 150, 220, 0.35); }
h2 { margin: 0 0 8px; font-size: calc(clamp(26px, 4.5vw, 44px) * var(--ts, 1)); color: #dfe5f5; text-shadow: 0 2px 0 #0a0c12; }
.dead h2 { color: #ff8b8b; }
.tagline { margin: 0 0 12px; color: #dbe3f6; font-size: calc(18px * var(--ts, 1)); }
.hint, .seed { margin: 0; color: #c3cde6; font-size: calc(16px * var(--ts, 1)); }
.btn { min-width: 220px; padding: 12px 28px; font: inherit; font-size: calc(20px * var(--ts, 1)); font-weight: 600; color: #e8ecf6; background: #2b3550; border: 3px solid #0a0c12; border-radius: 6px; box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.18), 0 3px 0 #0a0c12; cursor: pointer; }
.btn:hover, .btn:focus-visible { background: #3a4770; outline: 2px solid #9fb0d8; outline-offset: 2px; }
.btn:active { transform: translateY(2px); box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.12); }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@media (max-width: 480px) { .screen.title .panel { padding: 20px 18px 16px; } .summary { gap: 18px; padding: 8px 14px; } }
@media (prefers-reduced-motion: reduce) { .screen { animation: none; } }

/* ===================== S2 UI: drawers, HUD slot layer, tooltips (frozen C2 style, inventory decision C) ===================== */
:root{--ol:#0d0a1c;--panel:#241d4e;--panel2:#1e1845;--panel3:#17123a;--rim:#5d4fa8;--txt:#f3eefc;--mut:#b4abe0;--gold:#ffe27a;--wood:#b06f3c;--woodD:#8a5230;--paper:#ece4cf;--ink:#2a2547;--inkm:#5a4f82;--red:#8e1f2b;--ok:#4fd1a5;--bad:#ff8f80;--focus:#ffd43b;--btn:#3a2f78;--btn2:#4a3b94;--disabled-bg:#cfc6a8;--disabled-fg:#4a4432;
--c-normal:#e6e0ff;--c-magic:#7cc8f4;--c-rare:#f0e442;--c-unique:#ff9a5c;
--top:8px;--bottom:600px;--lw:340px;--rw:484px;--cw:44px;--hudtop:600px}
#ui{position:fixed;inset:0;pointer-events:none;z-index:5;font:15px/1.35 'Trebuchet MS','Segoe UI',system-ui,'Helvetica Neue','Liberation Sans',Arial,sans-serif;color:var(--txt)}
#ui[hidden]{display:none}
:where(#ui) button{font:inherit;color:inherit;cursor:pointer}
#ui :focus-visible{outline:3px solid var(--focus);outline-offset:2px;box-shadow:0 0 0 5px var(--ol)}
#ui .sheet :focus-visible{box-shadow:0 0 0 5px #fff}
#ui .sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
#ui .mk{display:inline-block;vertical-align:-2px;flex:none}
#ui kbd{font:800 14px/1 inherit;background:var(--ol);color:#fff;border:1px solid #cfc2ff;border-radius:5px;padding:2px 5px;margin-left:4px}
#ui .ic{width:100%;height:100%;display:block}

/* HUD slot layer, placed on the rects of hudLayout() */
.hudui{position:absolute;inset:0}
.hudui>*{pointer-events:none}
.hudui button,.hudui .dock,.hudui .xptip{pointer-events:auto}
.xptip{position:absolute;background:transparent}
.hgroup{display:contents}
.sk,.hb{position:absolute;margin:0;padding:0;background:transparent;border:0;border-radius:9px;touch-action:manipulation}
#ui .sk .ic,#ui .hb .ic{position:absolute;left:14%;right:14%;top:14%;bottom:14%;width:72%;height:72%}
.sk.on{box-shadow:0 0 0 3px var(--focus),0 0 0 5px var(--ol)}
.sk.on .sel{position:absolute;left:18%;right:18%;bottom:-6px;height:4px;border-radius:3px;background:var(--focus);border:1px solid var(--ol)}
.sk.dis,.hb.none{opacity:.6}
.sk.dis .ic{opacity:.45;filter:grayscale(.7)}
.sk.dis::after{content:"";position:absolute;inset:3px;border-radius:7px;background:repeating-linear-gradient(45deg,rgba(13,10,28,.55) 0 5px,transparent 5px 10px)}
.sk.none .ic{display:none}
.sk:hover,.hb:hover{background:rgba(255,255,255,.08)}
.kb{position:absolute;left:-3px;top:-6px;min-width:calc(var(--fs) * 1.7);height:calc(var(--fs) * 1.4);border-radius:calc(var(--fs) * .7);background:var(--ol);border:2px solid #cfc2ff;color:#fff;font:800 var(--fs)/calc(var(--fs) * 1.15) 'Trebuchet MS','Segoe UI',system-ui,sans-serif;text-align:center;padding:0 3px;z-index:3;box-sizing:border-box}
.sn{position:absolute;text-align:center;font:700 var(--fs)/1.1 'Trebuchet MS','Segoe UI',system-ui,sans-serif;color:#fff;margin-top:2px;white-space:normal;overflow:visible;text-shadow:0 0 3px #0d0a1c,0 1px 2px #0d0a1c,1px 0 2px #0d0a1c,-1px 0 2px #0d0a1c;pointer-events:none;overflow-wrap:normal;word-break:keep-all}
.dock{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:5px;align-items:stretch}
.hbtn{background:var(--btn);border:3px solid var(--ol);box-shadow:inset 0 0 0 2px var(--rim);border-radius:10px;padding:5px 10px;font-weight:800;font-size:14px;text-align:left;white-space:nowrap;display:flex;align-items:center;gap:2px;min-height:34px}
.hbtn span:first-child{margin-right:auto;padding-right:8px}
.hbtn:hover{background:var(--btn2)}
.hbtn[aria-pressed=true]{background:var(--rim)}
.bdg{margin-left:6px;background:var(--gold);color:var(--ol);border-radius:10px;padding:0 6px;font-size:14px;font-weight:800}
#ui.open-right:not(.phone) .dock{right:calc(var(--rw) + 8px)}
#ui.phone.open-left .dock,#ui.phone.open-right .dock{display:none}
#ui.phone .dock{flex-direction:row;top:6px;right:6px}
#ui.phone .hbtn kbd,#ui.phone .hbtn .bdg{margin-left:2px}
#ui.phone .hbtn{padding:3px 7px;font-size:14px}

/* drawers */
#stack{position:absolute;inset:0;pointer-events:none}
.drawer{position:absolute;top:var(--top);height:calc(var(--bottom) - var(--top));background:var(--panel);border:4px solid var(--ol);box-shadow:inset 0 0 0 2px var(--rim),0 12px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box;visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
.drawer.open,#pleft.open,#pright.open{visibility:visible;transform:none;transition-delay:0s;pointer-events:auto}
#pleft{left:0;width:var(--lw);border-left:none;border-radius:0 16px 16px 0;transform:translateX(-104%)}
#pright{right:0;width:var(--rw);border-right:none;border-radius:16px 0 0 16px;transform:translateX(104%)}
.ph{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 14px;border-bottom:3px solid var(--ol);background:var(--panel2);flex:none}
.ph h2{margin:0;font-size:19px;font-weight:800;letter-spacing:.02em;color:#fff;text-shadow:none}
.ph .phi{display:grid;place-items:center;width:32px;height:32px;flex:none;border:3px solid var(--ol);border-radius:7px;background:#3a3470;padding:2px;box-sizing:border-box}
.ph .phi svg{width:100%;height:100%;display:block}
#pright .ph{background:var(--woodD)}
#pleft .ph{background:#5a6482}
.xbtn{margin-left:auto;width:40px;height:40px;border-radius:8px;border:3px solid var(--ol);background:var(--btn);font:900 20px/1 inherit;color:#fff;padding:0}
.xbtn:hover{background:var(--btn2)}
.pb{overflow:auto;flex:1;min-height:0}

/* inventory */
.inv{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.dollrow{display:flex;gap:10px;align-items:flex-start}
.doll{display:grid;grid-template-columns:repeat(7,var(--cw));grid-template-rows:repeat(6,var(--cw));flex:none}
.slot,.bslot{position:relative;margin:2px;background:var(--panel2);border:2px solid var(--ol);border-radius:8px;box-shadow:inset 0 0 0 1px var(--rim);padding:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--mut);text-align:center;line-height:1.1;touch-action:none;min-width:0}
.slot .lb,.bslot .lb{pointer-events:none;padding:2px}
.slot.ok,.bslot.ok{outline:3px solid #fff;outline-offset:-1px}
.slot.bad,.bslot.bad{outline:3px dashed var(--bad);outline-offset:-1px;background:repeating-linear-gradient(45deg,rgba(255,143,128,.3) 0 6px,transparent 6px 12px),var(--panel2)}
.side{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.legend{list-style:none;margin:0;padding:6px 8px;background:var(--panel3);border:2px solid var(--ol);border-radius:8px;font-size:14px;display:grid;gap:4px}
.legend .lh,.beltbox h4{margin:0;font-size:14px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.legend li:not(.lh){display:flex;align-items:center;gap:6px}
.swatch{width:20px;height:14px;border-radius:4px;background:#322a6c;flex:none}
.swatch.r-normal{border:1px solid #8f88c0}.swatch.r-magic{border:2px solid #56b4e9}.swatch.r-rare{border:4px double #f0e442}.swatch.r-unique{border:2px dashed #e8590c}
.l-normal{color:var(--c-normal)}.l-magic{color:var(--c-magic)}.l-rare{color:var(--c-rare)}.l-unique{color:var(--c-unique)}
.beltbox{background:var(--panel3);border:2px solid var(--ol);border-radius:8px;padding:4px 6px 6px}
.bgrid{display:grid;grid-template-columns:repeat(2,var(--cw));grid-auto-rows:var(--cw);margin-left:-2px}
.gridwrap{border:3px solid var(--ol);border-radius:8px;background:var(--panel3);align-self:flex-start;padding:3px;box-shadow:inset 0 0 0 1px var(--rim)}
.gi{position:relative;width:calc(var(--cw) * 10);height:calc(var(--cw) * 4)}
.grid{display:grid;grid-template-columns:repeat(10,var(--cw));grid-template-rows:repeat(4,var(--cw))}
.cell{width:var(--cw);height:var(--cw);border:1px solid #3a3070;background:transparent;padding:0;border-radius:0;touch-action:none}
.cell:hover{background:rgba(255,255,255,.06)}
.items{position:absolute;inset:0;pointer-events:none}
.item{display:block;position:absolute;pointer-events:none;border-radius:6px;background:linear-gradient(160deg,#352d72,#241d4e);padding:3px;overflow:hidden;box-sizing:border-box;left:calc(var(--cw) * var(--x));top:calc(var(--cw) * var(--y));width:calc(var(--cw) * var(--w));height:calc(var(--cw) * var(--h))}
.item.fill{inset:2px;left:2px;top:2px;width:auto;height:auto}
.r-normal.item{border:1px solid #8f88c0}
.r-magic.item{border:2px solid #56b4e9;box-shadow:inset 0 0 8px rgba(86,180,233,.4)}
.r-rare.item{border:4px double #f0e442;padding:1px;box-shadow:inset 0 0 8px rgba(240,228,66,.3)}
.r-unique.item{border:2px dashed #e8590c;background:linear-gradient(160deg,#6b2a12,#2a1630);box-shadow:inset 0 0 10px rgba(255,122,46,.55)}
.item.dim{opacity:.35}
.item.origin{border-style:dotted}
.slot.ghosted .item{opacity:.35}
.item .rm{position:absolute;left:2px;top:2px;background:var(--ol);border-radius:4px;padding:1px;display:flex;line-height:0}
.r-normal .rm{color:#c9c2ee}.r-magic .rm{color:#56b4e9}.r-rare .rm{color:#f0e442}.r-unique .rm{color:#ff8a4a}
.item .warn{position:absolute;right:2px;bottom:2px;width:16px;height:16px;border-radius:50%;background:var(--bad);color:var(--ol);font:900 14px/16px inherit;text-align:center}
.pv{position:absolute;pointer-events:none;border:3px solid #fff;border-radius:6px;background:rgba(255,255,255,.2);z-index:3;box-sizing:border-box;left:calc(var(--cw) * var(--x));top:calc(var(--cw) * var(--y));width:calc(var(--cw) * var(--w));height:calc(var(--cw) * var(--h))}
.pv.bad{border-style:dashed;border-color:var(--bad);background:repeating-linear-gradient(45deg,rgba(255,143,128,.35) 0 6px,transparent 6px 12px)}
.footrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gold{display:inline-flex;align-items:center;gap:8px;font-size:17px;font-weight:800;color:var(--gold);background:var(--panel3);border:2px solid var(--ol);border-radius:8px;padding:3px 10px}
.notice{flex:1;min-width:140px;font-size:14px;color:var(--txt);min-height:20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hint{color:var(--mut)}
.keyhint{margin:0;font-size:14px;line-height:1.3;color:var(--mut)}
.reason{flex-basis:100%;color:var(--gold);font-weight:700;min-height:18px}
.heldline{display:inline-flex;gap:6px;align-items:center;font-weight:800}
.mini{background:var(--btn);border:2px solid var(--ol);box-shadow:inset 0 0 0 1px var(--rim);border-radius:7px;padding:3px 9px;font-size:14px;font-weight:700;min-height:30px;color:#fff}
.mini:hover{background:var(--btn2)}
.mini.key{min-width:34px;padding:3px 6px}
.mini.key.on{background:var(--gold);color:var(--ol);border-color:var(--ol)}
.ghost{position:fixed;pointer-events:none;z-index:100;opacity:.92;filter:drop-shadow(0 6px 6px rgba(0,0,0,.6))}
.ghost[hidden]{display:none}
.ghost .item{position:relative;left:0;top:0;width:100%;height:100%}

/* Employee File (paper sheet) */
.sheet{background:var(--paper) repeating-linear-gradient(transparent 0 27px,rgba(90,79,130,.13) 27px 28px);color:var(--ink);margin:8px;border:3px solid var(--ol);border-radius:10px;padding:8px 12px 10px;position:relative;box-shadow:inset 0 0 0 2px #cfc3a2;display:flex;flex-direction:column}
.fh{display:flex;gap:12px;align-items:center}
.photo{width:50px;height:60px;border:3px solid var(--ol);background:#9ad1e0;border-radius:6px;flex:none;overflow:hidden}
.fh h2{margin:0;font-size:19px;color:var(--ink)}
.fh p{margin:0;color:var(--inkm);font-size:14px}
.stamp{display:none}
.sheet h3{flex-wrap:wrap;gap:0 12px;margin:8px 0 3px;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--red);border-bottom:2px solid var(--red);display:flex;justify-content:space-between;align-items:baseline}
.sheet h3 em{font-style:normal;letter-spacing:0;text-transform:none;color:var(--ink);font-size:14px}
.xpl{display:flex;justify-content:space-between;flex-wrap:wrap;gap:0 12px;font-size:14px;margin-top:8px}
.xpb2{height:14px;border:3px solid var(--ol);border-radius:8px;background:#cfc3a2;overflow:hidden;margin-top:3px}
.xpb2 i{display:block;height:100%;background:repeating-linear-gradient(90deg,#d99a00 0 14px,#b57d00 14px 16px)}
.sc-attr{order:1}.sc-blk{order:2}.sc-der{order:3}
.attr{display:grid;grid-template-columns:1fr auto 40px;align-items:center;gap:8px;padding:2px 0;border-bottom:1px dashed #b9ad8c}
.attr .an b{font-size:16px}.attr .an small{display:block;color:var(--inkm);font-size:14px;line-height:1.1}
.attr .av{font-size:20px;font-weight:800;text-align:right}
.attr .av small{font-size:14px;color:var(--inkm);font-weight:600}
button.plus{width:38px;height:38px;border-radius:8px;border:3px solid var(--ol);background:var(--btn2);color:var(--gold);font:900 22px/1 inherit;padding:0}
button.plus:disabled{background:var(--disabled-bg);color:var(--disabled-fg);border-color:#7d755c;cursor:not-allowed}
.apv{font-size:14px;min-height:36px;margin:5px 0 0;padding:3px 8px;background:#e0d6b8;border-radius:6px;border:1px solid #b9ad8c}
.dstats{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.d{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-bottom:1px dotted #b9ad8c;font-size:14px}
.d b{font-weight:800}
.d b.flash{animation:flash .9s ease-out 1}
@keyframes flash{0%{background:#ffe27a;box-shadow:0 0 0 3px #ffe27a}100%{background:transparent;box-shadow:0 0 0 3px transparent}}
.blocked{margin:0;padding:0;list-style:none;font-size:14px}
.blocked li{padding:2px 0;line-height:1.25}
.sheet .l-normal{color:#2a2547}.sheet .l-magic{color:#0a5c8f}.sheet .l-rare{color:#6b5d00}.sheet .l-unique{color:#983300}
.sheet .mk{color:inherit}

/* skills */
.skills{padding:10px 12px}
.skills h3,.npc h3{margin:10px 0 4px;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);border-bottom:2px solid var(--rim)}
.sp{margin:0 0 2px;font-size:16px;color:var(--gold)}
.sk-note{margin:2px 0 4px;font-size:14px;color:var(--mut)}
.slist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.srow{display:grid;grid-template-columns:40px 1fr auto;gap:2px 8px;align-items:start;background:var(--panel3);border:2px solid var(--ol);border-radius:8px;padding:6px 8px}
.sic{width:40px;height:40px;flex:none;background:var(--panel2);border:2px solid var(--ol);border-radius:8px;padding:3px}
.sbody{min-width:0}
.sname{font-size:15px}.slv,.smana{color:var(--mut);font-size:14px}.sname .meta{display:block;line-height:1.2}
.stext{font-size:14px;color:var(--txt);margin:1px 0 3px}
.sassign{grid-column:2/4;display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--mut)}
.learn{align-self:start;min-width:78px;min-height:40px;background:var(--btn2);border:3px solid var(--ol);border-radius:8px;font-weight:800;color:var(--gold)}
.learn:disabled{background:var(--panel2);color:#9b93c9;cursor:not-allowed}

/* NPC windows */
.npc{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.say{margin:0;font-style:italic;font-family:Georgia,'Times New Roman',serif;color:var(--txt);font-size:15px}
.vtabs{display:flex;gap:6px}
.vtabs button{flex:1;min-height:40px;border:3px solid var(--ol);border-radius:8px;background:var(--panel2);font-weight:800}
.vtabs button.on{background:var(--rim);color:#fff}
.rows{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.row{display:flex;align-items:center;gap:8px;background:var(--panel3);border:2px solid var(--ol);border-radius:8px;padding:4px 6px}
.row.empty,.empty{color:var(--mut);padding:6px}
.ricon{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--panel2);border-radius:6px}
.ricon .ic{max-width:100%;max-height:100%}
.rname{flex:1;min-width:0;font-size:14px;display:flex;flex-direction:column}

/* tabs (phone) */

/* tooltip, toast */

.tip.r-magic{box-shadow:inset 0 0 0 2px #56b4e9,0 10px 30px rgba(0,0,0,.6)}

.tip .tf{font-style:italic;color:var(--mut);margin-top:4px;font-family:Georgia,'Times New Roman',serif}
.tip .tv{color:var(--gold);margin-top:3px;font-size:14px}
.tip .cmp{margin-top:4px;padding-top:4px;border-top:2px dashed var(--rim)}
.tip .cmp h4{margin:0 0 2px;font-size:14px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.tip .cn{display:flex;gap:6px;align-items:center;margin-bottom:1px;font-size:14px}
.tip .dl{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.tip .df{display:flex;gap:5px;align-items:center;margin:0;font-size:14px}
.tip .df.up{color:var(--ok)}.tip .df.dn{color:var(--bad)}
.tip .vd{margin-top:2px;font-weight:800;font-size:14px}
.tip .vd.up{color:var(--ok)}.tip .vd.down,.tip .vd.dn{color:var(--bad)}
.ar{width:12px;height:12px;flex:none;fill:currentColor}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--hudtop) - 56px);max-width:min(92vw,560px);background:var(--panel3);color:#fff;border:3px solid var(--ol);box-shadow:inset 0 0 0 2px var(--rim),0 6px 20px rgba(0,0,0,.5);border-radius:10px;padding:7px 14px;font-weight:700;font-size:15px;text-align:center;z-index:210;pointer-events:none}

/* phone: one panel at a time */

#ui.phone .xbtn{width:44px;height:44px}
#ui.phone .plus{width:44px;height:44px}
.noanim .drawer,.noanim .drawer.open{transition:none!important}
@media (prefers-reduced-motion:reduce){.drawer{transition:none!important}.d b.flash{animation:none}}

/* S2 fix: touch targets of at least 44 px on the phone (the inventory grid itself is the one exception: 10 columns at 390 px), no map button (M / Tab still work) */
#ui.phone .hbtn[data-open=map]{display:none}
#ui.phone .mini,#ui.phone .rbtn,#ui.phone .learn,#ui.phone .heal,#ui.phone .tab,#ui.phone .vtabs button{min-height:44px;min-width:44px}
#ui.phone .hbtn{min-height:44px}
#ui.phone .dock{gap:4px}
.rbtn.arm{background:var(--gold);color:var(--ol)}
#ui.phone .footrow{position:sticky;bottom:-6px;background:var(--panel);padding:6px 0 2px;z-index:5;border-top:2px solid var(--rim)}


/* ===================== S3 UI: title save buttons, confirm, options, victory, boss bar text size, high contrast ===================== */
.screen.title .panel .notice-line { margin: 0; padding: 8px 14px; max-width: 520px; color: #fff; background: rgba(120, 40, 50, 0.55); border: 2px solid #b4606c; border-radius: 8px; font-size: calc(16px * var(--ts, 1)); }
.btn[disabled] { opacity: 0.55; cursor: not-allowed; }
.btn[disabled]:hover { background: #2b3550; outline: none; }
.btn.small { min-width: 0; padding: 8px 14px; font-size: calc(15px * var(--ts, 1)); }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 560px; }
.screen.confirm .panel { max-width: min(92vw, 520px); }
.screen.import textarea { width: min(80vw, 520px); background: #0d0a1c; color: #f3eefc; border: 2px solid #5d4fa8; border-radius: 6px; padding: 8px; font: 14px/1.3 ui-monospace, Menlo, Consolas, monospace; }
.screen.import input[type=file] { color: #e8ecf6; max-width: 90vw; }

.screen.options .opt-panel { width: min(100%, 680px); max-height: none; margin: auto; padding: 18px 24px 22px; box-sizing: border-box; background: #17123a; border: 3px solid #5d4fa8; border-radius: 14px; text-align: left; display: flex; flex-direction: column; gap: 12px; color: #f3eefc; font-size: calc(16px * var(--ts, 1)); }
.screen.options h2 { text-align: center; margin: 0; }
.opt-group { border: 2px solid #3a3070; border-radius: 10px; padding: 8px 14px 12px; margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.opt-group legend { padding: 0 8px; color: #ffe27a; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; font-size: calc(14px * var(--ts, 1)); }
.opt-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.opt-row label { flex: 1 1 200px; }
.opt-row input[type=range] { flex: 1 1 160px; min-width: 120px; accent-color: #ffd43b; height: 28px; }
.opt-row input[type=checkbox] { width: 24px; height: 24px; accent-color: #ffd43b; }
.opt-row select { font: inherit; padding: 6px 8px; background: #241d4e; color: #fff; border: 2px solid #5d4fa8; border-radius: 6px; min-height: 40px; }

.screen.options .mini { background: #3a2f78; color: #fff; border: 2px solid #0d0a1c; box-shadow: inset 0 0 0 1px #5d4fa8; border-radius: 7px; padding: 6px 12px; font: inherit; font-weight: 700; min-height: 40px; cursor: pointer; }
.screen.options .mini:hover { background: #4a3b94; }
.screen.options .mini.on { background: #ffd43b; color: #0d0a1c; }
.screen.options :focus-visible { outline: 3px solid #ffd43b; outline-offset: 2px; }
.opt-keys { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 6px 14px; align-items: center; }
.opt-kbtn { min-width: 84px; }
.opt-msg { margin: 0; min-height: 1.4em; color: #ffe27a; font-weight: 700; }
.opt-mouse h4 { margin: 6px 0 2px; color: #b4abe0; font-size: calc(14px * var(--ts, 1)); letter-spacing: 0.06em; text-transform: uppercase; }
.opt-mouse p { margin: 0; }
.opt-fixed { margin: 0; }
.opt-rarity { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
.opt-sw { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; }
.screen.options .hint { color: #b4abe0; }
@media (max-width: 560px) { .opt-keys { grid-template-columns: 1fr auto; } }
.screen.victory, .screen.story-screen { background: radial-gradient(ellipse at center, rgba(40, 34, 90, 0.5), rgba(7, 8, 12, 0.92)); }
.screen.victory .vic, .screen.story-screen .vic { display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: min(94vw, 720px); padding: 24px 34px 22px; box-sizing: border-box; background: rgba(7, 8, 12, 0.78); border: 2px solid #ffd43b; border-radius: 14px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6); }
.screen.victory .kicker, .screen.story-screen .kicker { margin: 0; color: #ffe27a; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 800; font-size: calc(14px * var(--ts, 1)); }
.screen.victory h2, .screen.story-screen h2 { color: #ffe27a; margin: 0; }
.screen.victory h3 { margin: 4px 0 0; color: #b4abe0; font-size: calc(14px * var(--ts, 1)); letter-spacing: 0.1em; text-transform: uppercase; }
.screen.victory .story, .screen.story-screen .story { margin: 0; max-width: 560px; color: #e8ecf6; font-size: calc(17px * var(--ts, 1)); font-style: italic; }
.screen.victory .summary { flex-wrap: wrap; justify-content: center; border-color: #5d4fa8; }
.screen.victory .summary dt { color: #b4abe0; }
@media (max-width: 480px) { .screen.victory .vic { padding: 16px 14px; } .screen.victory .summary dd { font-size: calc(22px * var(--ts, 1)); } }
/* text size: the drawers, tooltips and toast follow the setting through zoom (their grids keep their pixel sizes) */
#ui .toast, #ui .tip, #ui .sheet, #ui .skills, #ui .npc, #ui .dock { zoom: var(--ts, 1); }
/* high contrast: black panels, white text and rims (colour tokens are set with a space so test/ui-contrast.test.js keeps reading the normal ones) */
html.hc { --panel: #000000; --panel2: #000000; --panel3: #000000; --rim: #ffffff; --txt: #ffffff; --mut: #ffffff; --ol: #000000; --btn: #000000; --btn2: #1c1c1c; --focus: #ffff00; }
html.hc #ui .sheet { background: #ffffff; --ink: #000000; --inkm: #000000; color: #000000; }

html.hc .hbtn[aria-pressed=true] .bdg { background: #000; color: #ffff00; }
html.hc .btn { background: #000; border-color: #fff; box-shadow: none; }
html.hc .btn:hover, html.hc .btn:focus-visible { background: #1c1c1c; outline-color: #ffff00; }
html.hc .screen.title .panel, html.hc .screen.victory .vic, html.hc .screen.story-screen .vic, html.hc .screen.options .opt-panel { background: #000; border-color: #fff; }
html.hc .opt-group { border-color: #fff; }
html.hc .opt-val, html.hc .screen.options .hint, html.hc .hint, html.hc .seed, html.hc .tagline { color: #fff; }
.noanim .screen { animation: none; }

/* ===== R5: title buttons, class selection (variant A, Lobby lineup), save slots, skill tree, elevator ===== */
.btn.pri { background: #ffd43b; color: #1b1038; border-color: #0d0a1c; box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.45), 0 3px 0 #0d0a1c; }
.btn.pri:hover, .btn.pri:focus-visible { background: #ffe27a; outline: 3px solid #33e0ff; outline-offset: 2px; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.two { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.btn-sub { font-size: calc(14px * var(--ts, 1)); font-weight: 600; color: #dbe3f6; }
.screen.title .panel .btn { min-width: min(260px, 100%); }

.screen.create { padding: 0; gap: 0; align-items: stretch; justify-content: stretch; text-align: left; background: #14141f; animation: none; font-family: 'Trebuchet MS','Segoe UI',system-ui,'Helvetica Neue','Liberation Sans',Arial,sans-serif; color: #f4ecd8; }
.cs-app { display: grid; grid-template-columns: minmax(0, 1fr) 410px; grid-template-rows: minmax(0, 1fr); width: 100%; height: 100%; min-height: 0; }
.cs-stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #14102c; }
.cs-bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cs-ttl { position: absolute; left: 22px; top: 16px; z-index: 3; pointer-events: none; }
.cs-ttl h1 { margin: 0; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; color: #ffe9b0; text-shadow: 0 2px 0 #0d0a1c, 0 0 8px #0d0a1c; }
.cs-ttl p { margin: 2px 0 0; font-size: 14px; color: #d6d0ee; text-shadow: 0 1px 0 #0d0a1c; }
.cs-keys { position: absolute; right: 16px; top: 16px; z-index: 3; font-size: 14px; color: #d6d0ee; pointer-events: none; text-shadow: 0 1px 0 #0d0a1c; }
.cs-keys kbd, .create kbd { font: inherit; font-weight: 800; border: 1.5px solid #8d80d0; border-radius: 5px; padding: 0 5px; background: #120e29; color: #f4ecd8; }
.cs-conf { position: absolute; left: 22px; top: 62px; z-index: 3; font-size: 14px; letter-spacing: 3px; color: #b4abe0; opacity: .8; pointer-events: none; }
.cs-lineup { position: absolute; inset: 0; z-index: 2; --chip: 46px; }
.cs-cls { position: absolute; top: 12%; bottom: 9%; width: 27%; left: calc(var(--x) * 1% - 13.5%); background: none; border: 0; padding: 0; border-radius: 12px; color: inherit; font: inherit; cursor: pointer; --chip: 0px; display: block; }
@keyframes cs-slam { 0% { transform: translateY(2%) scale(1.14) rotate(0); } 28% { transform: translateY(-1.5%) scale(1.14) rotate(-3.5deg); } 40% { transform: translateY(5%) scale(1.14) rotate(2.5deg); } 70% { transform: translateY(2%) scale(1.14) rotate(-.6deg); } 100% { transform: translateY(2%) scale(1.14) rotate(0); } }
.cs-cls.on .cs-fig.slam { animation: cs-slam .9s ease-out 1; }
.noanim .cs-fig.slam { animation: none; }
.cs-fig { pointer-events: none; position: absolute; inset: auto auto 0 50%; display: block; filter: brightness(.8) saturate(.92) drop-shadow(0 0 1px rgba(255, 236, 190, .6)); transition: transform .3s ease, filter .3s ease; transform-origin: 50% 100%; }
.cs-cls:hover .cs-fig { transform: translateY(-2.5%); filter: brightness(.9) saturate(1) drop-shadow(0 0 1px rgba(255, 236, 190, .8)); }
.cs-cls.on .cs-fig { transform: translateY(2%) scale(1.14); filter: none; }
.cs-cls .lbl { position: absolute; left: 50%; bottom: -46px; transform: translateX(-50%); white-space: nowrap; font-weight: 800; font-size: 15px; letter-spacing: .5px; padding: 8px 16px; min-height: 40px; box-sizing: border-box; display: inline-flex; align-items: center; border-radius: 99px; background: rgba(13, 10, 28, .88); border: 2px solid #5b4f98; color: #e0daf6; text-transform: uppercase; transition: .25s; }
.cs-cls.on .lbl { color: #14102c; background: var(--c); border-color: #0d0a1c; }
.cs-cls:hover .lbl { border-color: var(--c); color: #fff; }
.cs-cls.on:hover .lbl { color: #14102c; }
.cs-cls:focus-visible { outline: none; } .cs-cls:focus-visible .lbl { outline: 3px solid #33e0ff; outline-offset: 2px; }
.cs-stamp { position: absolute; z-index: 4; left: 50%; top: 40%; transform: translate(-50%, -50%) rotate(-8deg) scale(1.6); padding: 6px 22px; border: 6px solid #ffd43b; color: #ffd43b; font: 900 clamp(28px, 5vw, 54px)/1 'Trebuchet MS', system-ui, sans-serif; letter-spacing: 6px; opacity: 0; pointer-events: none; background: rgba(13, 10, 28, .5); text-shadow: 0 2px 0 #0d0a1c; }
.cs-stamp.show { opacity: .95; transform: translate(-50%, -50%) rotate(-8deg) scale(1); transition: transform .28s cubic-bezier(.3, 1.6, .5, 1), opacity .15s; }
.cs-side { display: flex; flex-direction: column; min-height: 0; background: #241d4e; border-left: 3px solid #0d0a1c; box-shadow: -2px 0 0 #3d3068; }
.cs-info { flex: 1; min-height: 0; overflow: auto; padding: 22px 22px 10px; }
.cs-info.fade > * { animation: cs-fade .35s ease both; }
@keyframes cs-fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.cs-head { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "em name" "em role"; column-gap: 12px; row-gap: 2px; align-items: center; }
.cs-head .cs-emblem { grid-area: em; } .cs-head h2 { grid-area: name; } .cs-head .cs-role { grid-area: role; justify-self: start; }
.cs-head h2 { margin: 0; font-size: 26px; line-height: 1.1; color: #f4ecd8; text-shadow: none; min-width: 0; }
.cs-emblem { width: 52px; height: 52px; border-radius: 12px; background: var(--cl); border: 3px solid #0d0a1c; display: grid; place-items: center; padding: 5px; box-sizing: border-box; flex: none; }
.cs-emblem svg { width: 100%; height: 100%; }
.cs-role { font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; padding: 1px 9px; border: 2px solid var(--cl); border-radius: 99px; color: #f4ecd8; }
.cs-quote { margin: 10px 0 8px; font-size: 15px; font-style: italic; color: #f4ecd8; border-left: 4px solid var(--cl); padding-left: 10px; }
.cs-tags { list-style: none; margin: 0 0 12px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.cs-tags li { font-size: 14px; font-weight: 800; padding: 3px 9px; border-radius: 99px; border: 2px solid #5b4f98; background: rgba(0, 0, 0, .2); }
.cs-stats { margin: 0 0 10px; display: grid; gap: 5px; }
.cs-stat { display: grid; grid-template-columns: 84px 1fr; align-items: center; gap: 8px; }
.cs-stat dt { font-size: 14px; font-weight: 800; color: #c9c2e8; text-transform: uppercase; letter-spacing: .4px; }
.cs-stat dd { margin: 0; display: flex; align-items: center; gap: 8px; }
.cs-stat .pips { display: flex; gap: 3px; flex: 1; }
.cs-stat .pips span { flex: 1; height: 12px; border-radius: 3px; background: #3a3366; border: 1.5px solid #0d0a1c; }
.cs-stat .pips span.on { background: var(--cl); }
.cs-stat b { font-size: 14px; min-width: 30px; text-align: right; }
.cs-sec { margin: 0 0 6px; font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: .8px; color: #c9c2e8; border: 0; }
.cs-branches { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.cs-branches li { display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; gap: 4px; align-content: start; }
.cs-branches .ico { width: 38px; height: 38px; border-radius: 9px; display: grid; place-items: center; background: var(--cl); border: 2px solid #0d0a1c; padding: 3px; box-sizing: border-box; }
.cs-branches .ico svg { width: 100%; height: 100%; }
.cs-branches b { display: block; font-size: 14px; }
.cs-branches small { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden; color: #c9c2e8; font-size: 14px; line-height: 1.25; }
.cs-foot { padding: 14px 22px 18px; background: #120e29; border-top: 3px solid #0d0a1c; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.cs-label { display: flex; justify-content: space-between; font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; color: #c9c2e8; margin-bottom: 4px; }
.cs-label .hint { font-weight: 600; text-transform: none; letter-spacing: 0; color: #c9c2e8; font-size: 14px; }
.cs-namerow { display: flex; gap: 8px; }
.cs-name { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 9px; border: 2px solid #0d0a1c; background: #1c1640; color: #f4ecd8; font: inherit; font-size: 17px; box-shadow: inset 0 0 0 1px #5d4fa8; }
.cs-name::placeholder { color: #b4abe0; opacity: .85; }
.cs-name:focus-visible { outline: 3px solid #33e0ff; outline-offset: 1px; }
.cs-cnt { font-size: 14px; color: #c9c2e8; min-height: 16px; display: flex; justify-content: space-between; gap: 8px; }
.cs-cnt .err { color: #ffb0a4; font-weight: 800; text-align: right; }
.cs-foot .btn { min-width: 0; font-size: 16px; padding: 10px 14px; min-height: 44px; }
.cs-actions { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; }
.cs-actions .cs-go { grid-column: 1 / -1; font-size: 20px; padding: 13px 14px; }
.cs-actions .btn[hidden], .cs-confirm[hidden] { display: none; }
.cs-go.off { background: linear-gradient(#332c6a, #272255); color: #efe9ff; box-shadow: inset 0 -4px 0 color-mix(in srgb, var(--cl) 60%, transparent); border-color: color-mix(in srgb, var(--cl) 75%, #0d0a1c); } /* R6 G2 #17: a neutral indigo fill with the class accent as rim and underline (orange no longer mixes to brown) */
.cs-go.off:hover { background: linear-gradient(#3b3480, #2e2862); }
.cs-gohint.invis { visibility: hidden; }
.cs-gohint { font-size: 14px; font-weight: 800; color: #ffe27a; text-align: center; }

.tree { --gx: 6px; --gy: 18px; }

.tree .tn-main { grid-template-columns: 30px minmax(0, 1fr); grid-template-areas: "ic name" "lv lv" "st st" "lock lock" "req req"; gap: 1px 5px; min-height: 0; }

/* connectors: .lk sits on top of a node (elbow to the prerequisite's column), .kd under a node that has dependants */
.tree .lk { position: absolute; left: 0; right: 0; top: -2px; height: 0; pointer-events: none; --lc: #6b5fb0; }
.tree .lk.ok, .tree .kd.ok { --lc: #6dd6a8; }
.tree .lk::before { content: ""; position: absolute; left: calc(50% - 1.5px); width: 3px; top: calc(-0.5 * var(--gy)); height: calc(0.5 * var(--gy)); background: var(--lc); }
.tree .lk.l::after, .tree .lk.r::after { content: ""; position: absolute; height: 3px; top: calc(-0.5 * var(--gy) - 1.5px); background: var(--lc); width: calc(var(--span) * (100% + var(--gx) + 4px) + 1.5px); } /* 100% is the padding box: add the two 2px borders back so each column step is card width + gap (ADV-R6-03) */

.tree .lk.r::after { left: calc(50% - 1.5px); }

#ui.phone .tree .tnode { grid-column: 1; grid-row: auto; }
#ui.phone .tree .lk, #ui.phone .tree .kd { display: none; }
#ui.phone .tree .tn-req { display: block; grid-area: req; font-size: 14px; color: #b4abe0; }
#ui.phone .tree .tn-lock { grid-area: lock; }
#ui.phone .tree .tn-main { grid-template-areas: "ic name" "lv lv" "st st" "lock lock" "req req"; }
.tree .basic-h { margin-top: 4px; }
.tree .sk-note { margin: 1px 0; }
.tree .tr-head { margin-bottom: 2px; }
@media (max-height: 800px) { .tree .basic-h { display: none; } .tree .srow { margin-top: 4px; } }
/* phone: compact cards, level and state share a line, Learn and F1-F4 share a row (44 px touch targets kept) */
#ui.phone .tree .tn-main { grid-template-columns: 30px auto minmax(0, 1fr); grid-template-areas: "ic name name" "ic lv st" "lock lock lock" "req req req"; align-items: center; }
#ui.phone .tree .tn-st { padding-left: 4px; }
#ui.phone .tree .tnode { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 6px; align-items: center; }
#ui.phone .tree .tnode > .tn-main { grid-column: 1 / -1; }
#ui.phone .tree .tnode > .learn { grid-column: 1; }
#ui.phone .tree .tnode:not(:has(.sassign, .aura)) > .learn { grid-column: 1 / -1; }
#ui.phone .tree .tnode > .sassign, #ui.phone .tree .tnode > .aura { grid-column: 2; }
#ui.phone .tree .tnode .sassign { gap: 2px; }
#ui.phone .tree .tnode .sassign .mini { min-width: 40px; flex: none; }

/* ---- R7: quest journal (left drawer), tracker line, dock badge ---- */
.tracker{position:absolute;display:flex;pointer-events:none;z-index:4;min-width:0}
.tracker[hidden]{display:none}
.tr-in{display:block;max-width:100%;min-width:0;box-sizing:border-box;background:rgba(20,16,44,.86);color:#fff;border:3px solid var(--ol);box-shadow:inset 0 0 0 2px var(--rim);border-radius:10px;padding:3px 10px;font-size:14px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;zoom:var(--ts,1)}
.tr-l{color:var(--gold);margin-right:8px}
.tr-l::after{content:":"}
#ui.phone .tracker{top:54px}
.journal{padding:10px 12px;display:flex;flex-direction:column;gap:12px;overflow-wrap:anywhere}
.jsec h3{margin:0 0 6px;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:#d8d2ff}
.jlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.jq{background:var(--panel2);border:3px solid var(--ol);box-shadow:inset 0 0 0 2px var(--rim);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.jq:focus-visible,.jpouch li:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.jq.pinned{border-color:var(--gold)}
.jq.s-completed{opacity:.9}
.jq.s-unavailable{border-style:dashed;background:transparent}
.jq.s-unavailable .jt{color:#cfc9ee}
.jb{margin:0;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:14px;overflow-wrap:anywhere}
.jlock{font-weight:700}
.jh{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.jt{font-size:16px;color:#fff}
.jk{font-size:14px;color:#b4abe0;white-space:nowrap}
.jm{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:14px;font-weight:700}
.js{background:#2a2456;border:2px solid var(--rim);border-radius:8px;padding:0 8px}
.s-ready .js{background:var(--gold);color:var(--ol)}
.jpm{color:var(--gold);display:inline-flex;align-items:center;gap:4px}
.jg,.jn{margin:0;font-size:14px}
.jl{font-weight:800;color:#d8d2ff}
.jpin,.jverdict{align-self:flex-start;margin-top:2px;min-height:34px}
.jpouch li{background:var(--panel2);border:2px solid var(--rim);border-radius:8px;padding:4px 10px;font-size:14px}
#ui.phone .jpin,#ui.phone .jverdict{min-height:44px;min-width:44px}
#ui.phone .journal{padding:8px 8px 16px}
html.hc .tr-in{background:#000;border-color:#fff;color:#fff}
#ui.phone .dock .hbtn{padding:3px 6px}
#ui.phone .dock .hbtn kbd{display:none}
#ui.phone .dock .hbtn .bdg{margin-left:4px}

/* ---- R7: quest section of the NPC window, slot card quest line, reduced motion ---- */
.nqs{margin:0}
.nql{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.nq{background:var(--panel2);border:3px solid var(--ol);box-shadow:inset 0 0 0 2px var(--rim);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:5px;overflow-wrap:anywhere}
.nq.s-ready{border-color:var(--gold)}
.nq-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.nq-t{font-size:16px;color:#fff}
.nq-s{font-size:14px;font-weight:700;background:#2a2456;border:2px solid var(--rim);border-radius:8px;padding:0 8px;white-space:nowrap}
.nq.s-ready .nq-s{background:var(--gold);color:var(--ol)}
.nq p{margin:0;font-size:14px}
.nq-x{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:15px!important}
.nq-warn{background:#4a1620;color:#fff;border:2px solid #ff8a8a;border-radius:8px;padding:4px 8px;font-weight:700}
.nq-acts{display:flex;gap:8px;flex-wrap:wrap}
.nq-acts .rbtn{min-height:38px;min-width:84px}
.nq-acts .rbtn.pri{background:var(--gold);color:var(--ol)}
.nq button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#ui.phone .nq-acts .rbtn{min-height:44px;min-width:96px}
.sl-card .sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.sl-quest{color:var(--gold)}
@media (prefers-reduced-motion:reduce){.toast,.bdg,.tracker,.nq{animation:none!important;transition:none!important}}
.noanim .toast,.noanim .bdg,.noanim .tracker,.noanim .nq{animation:none!important;transition:none!important}
