<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Character Select A: Lobby Lineup</title>
<style>
:root{--bg:#14141f;--panel:#241d4e;--panel2:#120e29;--ink:#0d0a1c;--txt:#f4ecd8;--muted:#b8b2d6;--accent:#ffb81f;--cl:#ff8a1f;--line:#3d3068;--fld:#120e29;--btn:#33295f;--btnTxt:#f4ecd8;--pri:#ffb81f;--priTxt:#1b1038;--pip:var(--cl);--pipOff:#3a3366;--focus:#33e0ff;--sans:'Trebuchet MS','Segoe UI',system-ui,'Helvetica Neue','Liberation Sans',Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.35}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cl-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cl-head h2{margin:0;font-size:26px;line-height:1.1;letter-spacing:.2px}
.diff{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border:2px solid var(--line);border-radius:99px;color:var(--muted)}
.diff i{display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor}
.diff i.on{background:currentColor}
.pitch{margin:8px 0 8px;font-size:15px}
.tags{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.tags li{font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;border:2px solid var(--cl);color:var(--txt);background:rgba(0,0,0,.2)}
.stats{margin:0 0 12px;display:grid;grid-template-columns:minmax(0,1fr);gap:7px}
.stat{display:grid;grid-template-columns:84px 1fr 22px;align-items:center;gap:8px}
.stat dt{font-size:12.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.stat dd{margin:0;display:contents}
.pips{display:flex;gap:3px}
.pips span{flex:1;height:12px;border-radius:3px;background:var(--pipOff);border:1.5px solid var(--ink);transition:background .35s}
.pips span.on{background:var(--pip)}
.stat b{font-size:13px;text-align:right}
.sec{margin:0 0 6px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.branches{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:7px}
.branches li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center}
.ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--cl);color:var(--ink);border:2px solid var(--ink)}
.ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.branches b{display:block;font-size:14px}
.branches small{display:block;color:var(--muted);font-size:12px;line-height:1.25}
.fade{animation:fadein .35s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.start{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.namebox label{display:flex;justify-content:space-between;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:4px}
.namebox label .hint{font-weight:600;text-transform:none;letter-spacing:0}
.namerow{display:flex;gap:8px}
.namerow input{flex:1;min-width:0;padding:9px 12px;border-radius:9px;border:2px solid var(--ink);background:var(--fld);color:var(--txt);font-size:16px}
.namerow input::placeholder{color:var(--muted);opacity:.7}
.btn{padding:9px 14px;border-radius:9px;border:2px solid var(--ink);background:var(--btn);color:var(--btnTxt);font-weight:800;min-height:42px}
.btn:hover{filter:brightness(1.12)}
.btn.pri{background:var(--pri);color:var(--priTxt);box-shadow:0 3px 0 var(--ink)}
.btn.pri[aria-disabled=true]{opacity:.45;box-shadow:none;cursor:not-allowed}
.actions{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
.cnt{font-size:12px;color:var(--muted);min-height:16px;display:flex;justify-content:space-between;gap:8px}
.cnt .err{color:#ff9a8a;font-weight:800}
.slotnote{margin:0;font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,30px);background:#0d0a1c;color:#f4ecd8;border:2px solid #ffb81f;border-radius:10px;padding:10px 16px;font-weight:800;max-width:min(92vw,520px);opacity:0;pointer-events:none;transition:.3s;z-index:60;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.dlg{position:fixed;inset:0;background:rgba(8,6,20,.72);display:grid;place-items:center;z-index:50;padding:12px}
.dlg[hidden]{display:none}
.dlg-card{width:min(640px,100%);max-height:100%;overflow:auto;background:#241d4e;color:#f4ecd8;border:3px solid #0d0a1c;border-radius:14px;padding:16px;box-shadow:0 0 0 2px #3d3068,0 20px 60px #000}
.dlg-card h2{margin:0 0 2px;font-size:22px}.dlg-card p{margin:0 0 12px;color:#b8b2d6;font-size:13px}
.slots{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px}
.slot{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:8px;border-radius:10px;background:#120e29;border:2px solid #3d3068}
.slot canvas{width:56px;height:56px;border-radius:8px;border:2px solid #0d0a1c;display:block}
.slot .em{width:56px;height:56px;border-radius:8px;border:2px dashed #5b4f98;display:grid;place-items:center;color:#8f86c4;font-weight:800}
.slot strong{display:block;font-size:15px}.slot span.m{display:block;font-size:12.5px;color:#b8b2d6}
.slot .btn{background:#33295f;color:#f4ecd8}
.slot.empty strong{color:#b8b2d6}
@media (max-width:520px){.slot{grid-template-columns:48px 1fr;}.slot canvas,.slot .em{width:48px;height:48px}.slot .btn{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:520px){.branches{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.branches li{grid-template-columns:1fr;justify-items:center;text-align:center;gap:4px}.branches small{display:none}.branches b{font-size:12.5px;line-height:1.15}}

body{overflow:hidden}
.app{display:grid;grid-template-columns:minmax(0,1fr) 410px;height:100vh;height:100dvh}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:#14102c}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.ttl{position:absolute;left:22px;top:16px;z-index:2;pointer-events:none}
.ttl h1{margin:0;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#ffe9b0;text-shadow:0 2px 0 #0d0a1c,0 0 8px #0d0a1c}
.ttl p{margin:2px 0 0;font-size:12px;color:#b8b2d6;text-shadow:0 1px 0 #0d0a1c}
.lineup{position:absolute;inset:0}
.cls-btn{position:absolute;top:16%;bottom:0;width:27%;left:calc(var(--x)*1% - 13.5%);background:none;border:0;padding:0;border-radius:12px}
.cls-btn .lbl{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);white-space:nowrap;font-weight:800;font-size:13px;letter-spacing:.5px;padding:5px 12px;border-radius:99px;background:rgba(13,10,28,.82);border:2px solid #3d3068;color:#b8b2d6;text-transform:uppercase;transition:.25s}
.cls-btn.on .lbl{color:#14102c;background:var(--c);border-color:#0d0a1c}
.cls-btn:hover .lbl{border-color:var(--c);color:#f4ecd8}.cls-btn.on:hover .lbl{color:#14102c}
.keys{position:absolute;right:16px;top:16px;z-index:2;font-size:12px;color:#b8b2d6;pointer-events:none;text-shadow:0 1px 0 #0d0a1c}
kbd{font:inherit;font-weight:800;border:1.5px solid #5b4f98;border-radius:5px;padding:0 5px;background:#120e29;color:#f4ecd8}
.side{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-left:3px solid var(--ink);box-shadow:-2px 0 0 var(--line)}
#info{flex:1;min-height:0;overflow:auto;padding:22px 22px 10px}
#foot{padding:14px 22px 18px;background:var(--panel2);border-top:3px solid var(--ink)}
@media (max-width:760px){
 .app{grid-template-columns:1fr;grid-template-rows:minmax(0,38dvh) minmax(0,1fr)}
 .side{border-left:0;border-top:3px solid var(--ink)}
 #info{padding:12px 16px 8px}.cl-head h2{font-size:22px}
 #foot{padding:10px 16px 12px}.keys{display:none}.ttl{left:14px;top:10px}
 .cls-btn .lbl{font-size:10px;padding:3px 8px;bottom:6px;white-space:normal;text-align:center;width:88%;line-height:1.1}
 .cls-btn{top:12%}
 .pitch{margin:4px 0 6px;font-size:14px}.tags{margin-bottom:8px}.stat{grid-template-columns:84px 1fr 14px;gap:6px}.stat dt{font-size:11px;letter-spacing:0}
 .slotnote{display:none}.btn{min-height:40px}
}
</style></head><body>
<main class="app">
 <section class="stage" aria-label="Choose your class">
  <canvas id="cv" aria-hidden="true"></canvas>
  <div class="ttl"><h1>Lobby, 08:57</h1><p>Pick who walks through the elevator doors</p></div>
  <div class="keys"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> choose &middot; <kbd>L</kbd> load game</div>
  <div class="lineup" role="radiogroup" aria-label="Class">
   <button type="button" class="cls-btn" role="radio" aria-checked="false" style="--x:20;--c:#ff8a1f"><span class="lbl">Facilities Manager</span></button>
   <button type="button" class="cls-btn" role="radio" aria-checked="false" style="--x:50;--c:#ff6fa3"><span class="lbl">Sales Rep</span></button>
   <button type="button" class="cls-btn" role="radio" aria-checked="false" style="--x:80;--c:#33e0ff"><span class="lbl">IT Wizard</span></button>
  </div>
 </section>
 <aside class="side" aria-label="Class details"><div id="info" aria-live="polite"></div><div id="foot"></div></aside>
</main>
<script>
'use strict';
/* ==================== FIGURES (exported, port to src/render/styles) ====================

const FIG_OUTL='#0d0a1c';

 skin:'#f6c49c',ink:'#2a2547',white:'#ffffff',paper:'#ece4cf',steel:'#d3dcea',gold:'#ffb81f',
 fmSkin:'#c98a5e',fmBeard:'#2b1d17',fmPants:'#34456e',fmShirt:'#46618c',fmBoot:'#5a3a28',vest:'#ff8a1f',refl:'#e8eef5',hat:'#ffd23a',belt:'#6b4528',grip:'#d83a2c',steelD:'#8793ae',

 itHood:'#6a4cd0',itJeans:'#2c3a6a',itSkin:'#e8b48a',itHair:'#2a1a40',sneak:'#f4ecd8',sole:'#33e0ff',lapBody:'#8793ae',screenC:'#33e0ff',lens:'#c4ecff',cord2:'#ffe9b0',keyc:'#4c5280',cyan:'#33e0ff'};

 fShadow(24);
 fL(-7,-30,-8,-4,10,'fmPants',1);fE(-9,-2.5,8,4,'fmBoot',1);fL(7,-30,8,-4,10,'fmPants',0);fE(9.5,-2.5,8.5,4,'fmBoot',0);
 fc.save();fc.translate(lean,0);
 fP([-14,-64+bob,14,-64+bob,12.5,-28,-12.5,-28],'fmShirt',1);
 fP([-14,-64+bob,-4.5,-64+bob,-4,-28,-12.5,-28],'vest',0);fP([4.5,-64+bob,14,-64+bob,12.5,-28,4,-28],'vest',0);
 fP([-13.6,-53+bob*.5,-4.4,-53+bob*.5,-4.3,-48.5,-13.4,-48.5],'refl',0);fP([4.3,-53+bob*.5,13.6,-53+bob*.5,13.4,-48.5,4.2,-48.5],'refl',0);
 fP([-13.1,-43,-4.2,-43,-4.1,-38.8,-13,-38.8],'refl',0);fP([4.1,-43,13.1,-43,13,-38.8,4.1,-38.8],'refl',0);
 fP([-14,-64+bob,-9,-64+bob,-10,-55,-14,-56],'refl',0);fP([9,-64+bob,14,-64+bob,14,-56,10,-55],'refl',0);
 fP([-13,-33,13,-33,13,-27.5,-13,-27.5],'belt',0);fP([-2.6,-32.4,2.6,-32.4,2.6,-28.2,-2.6,-28.2],'gold',0);
 fP([-12.5,-27.5,-6,-27.5,-6.4,-18.5,-12,-18.5],'belt',1);fL(-9,-27,-9.4,-17.5,2.4,'steelD',1);
 fL(8.6,-27.5,9.4,-17,2.8,'steelD',1);fL(11.4,-27.5,12.6,-19,2.2,'grip',1);fE(12.8,-22.6,2.7,2.7,'gold',1);
 fL(1,-67+bob,1,-60+bob,8.5,'fmSkin',1);
 fL(-14,-61+bob,-19,-40+bob*.5,8.6,'fmShirt',1);fE(-19.5,-36.5,4.4,4.4,'fmSkin',1);
 const hy0=-77+bob*.8;
 fE(1,hy0+6,10.6,9.6,'fmBeard',0);fE(1,hy0-.6,10.6,10.4,'fmSkin',0);
 fE(1,hy0+4.2,5.6,2,'fmBeard',0);fL(-1.2,hy0+7.4,3.6,hy0+7.4,1.3,'ink',0);
 fE(-10,hy0+.5,2.3,3,'fmSkin',1);fE(12,hy0+.5,2.3,3,'fmSkin',1);
 fE(-3.5,hy0-1.5,1.5,1.9,'ink',0);fE(5.5,hy0-1.5,1.5,1.9,'ink',0);fL(-6.4,hy0-5.3,-1.4,hy0-4.4,1.5,'fmBeard',0);fL(3.4,hy0-4.4,8.4,hy0-5.3,1.5,'fmBeard',0);
 fE(1,hy0-7.6,12,8.2,'hat',0);fP([-12.8,hy0-6.6,14.8,hy0-6.6,15.4,hy0-3.8,-13.4,hy0-3.8],'hat',1);fE(1,hy0-14.4,2.6,1.7,'hat',2);
 fc.restore();
 fL(14+lean,-61+bob,hx,hy,8.6,'fmShirt',0);fE(hx,hy,4.7,4.7,'fmSkin',0);
 const cs=Math.cos(th),sn=Math.sin(th),pt=(d,w)=>[hx+cs*d-sn*w,hy+sn*d+cs*w];
 const q=(d0,d1,w,m,sh)=>{const a=pt(d0,-w),b=pt(d1,-w),c=pt(d1,w),e=pt(d0,w);fP([a[0],a[1],b[0],b[1],c[0],c[1],e[0],e[1]],m,sh);};
 q(-9,36,2.4,'steel',0);q(-9,9,3.1,'grip',0);
 const hd=pt(41,0);fE(hd[0],hd[1],7.4,7.4,'steel',0);const n1=pt(40,-2.8),n2=pt(52,-2.8),n3=pt(52,2.8),n4=pt(40,2.8);fP([n1[0],n1[1],n2[0],n2[1],n3[0],n3[1],n4[0],n4[1]],'ink',0);

 if(focus){const b=$$('.cls-btn')[ST.sel];b&&b.focus();}
 draw();
}
function draw(){V.render();}
function step(dt){ST.T+=dt;ST.selT+=dt;V.update&&V.update(dt);}
function boot(variant){
 V=variant;
 document.body.insertAdjacentHTML('beforeend',dlgHTML());
 $('#foot').innerHTML=footHTML();
 const nm=$('#nm');if(QS.get('name'))nm.value=QS.get('name').slice(0,16);
 slotNote();renderInfo();syncName();
 $$('.cls-btn').forEach((b,i)=>{b.addEventListener('click',()=>select(i,false));});
 nm.addEventListener('input',syncName);
 $('#suggest').addEventListener('click',()=>{ST.nameIdx=(ST.nameIdx+1+(FRAME===null?Math.floor(Math.random()*5):0))%NAMES.length;nm.value=NAMES[ST.nameIdx];syncName();nm.focus();});
 $('#loadBtn').addEventListener('click',openLoad);$('#dlgClose').addEventListener('click',closeLoad);
 $('#dlg').addEventListener('click',e=>{if(e.target.id==='dlg')closeLoad();
  const l=e.target.closest('[data-load]'),n=e.target.closest('[data-new]');
  if(l){const s=SLOTS[+l.dataset.load];closeLoad();toast('Loading slot '+(+l.dataset.load+1)+': '+CLASSES[s.c].name+', level '+s.lv+'. (Prototype: nothing is loaded.)');}
  if(n){ST.slot=+n.dataset.new;slotNote();closeLoad();toast('New game will use slot '+(ST.slot+1)+'.');}});
 $('#startForm').addEventListener('submit',e=>{e.preventDefault();
  if(!validName()){$('#err').textContent='Enter a name, 1 to 16 characters.';nm.focus();return;}
  ST.selT=0;toast('Clocking in: '+nm.value.trim()+', '+CLASSES[ST.sel].name+', slot '+(ST.slot+1)+'. (Prototype: nothing is saved.)');});
 document.addEventListener('keydown',e=>{
  if(!$('#dlg').hidden){if(e.key==='Escape'){e.preventDefault();closeLoad();}
   else if(e.key==='Tab'){const f=$$('#dlg button');const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}return;}
  const tg=e.target,typing=tg.tagName==='INPUT';
  if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
  const onCls=tg.classList&&tg.classList.contains('cls-btn');
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){e.preventDefault();select((ST.sel+2)%3,onCls);}
  else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){e.preventDefault();select((ST.sel+1)%3,onCls);}
  else if(e.key==='1'||e.key==='2'||e.key==='3'){select(+e.key-1,onCls);}
  else if((e.key==='Enter'||e.key===' ')&&onCls){e.preventDefault();select(ST.sel,true);}
  else if(e.key==='l'||e.key==='L'){e.preventDefault();openLoad();}
  else if(e.key==='/'||e.key==='n'||e.key==='N'){e.preventDefault();nm.focus();}
 });
 V.init();
 addEventListener('resize',()=>{V.resize&&V.resize();draw();});
 if(QS.get('load')==='1')openLoad();
 if(FRAME!==null){for(let i=0;i<FRAME;i++)step(1/60);draw();document.body.dataset.ready='1';window.__ready=true;}
 else{let last=performance.now();const loop=n=>{const dt=Math.min(.05,(n-last)/1000);last=n;step(dt);draw();requestAnimationFrame(loop);};
  draw();window.__ready=true;document.body.dataset.ready='1';requestAnimationFrame(loop);}
}
/* ==================== END CORE ==================== */

/* ==================== Variant A: Lobby lineup ==================== */
(function(){
 const cv=document.getElementById('cv'),cx=cv.getContext('2d');
 let W=0,H=0,DPR=1,bg=null;const SX=[.2,.5,.8];
 const A={u:[0,0,0],sp:.5};
 const TAU=Math.PI*2,ss=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
 function paintBG(){
  bg=document.createElement('canvas');bg.width=W*DPR;bg.height=H*DPR;const g=bg.getContext('2d');g.scale(DPR,DPR);
  const hz=H*.5,vx=W/2,vy=H*.34;
  /* wall */
  let gr=g.createLinearGradient(0,0,0,hz);gr.addColorStop(0,'#1c1740');gr.addColorStop(1,'#2d2760');g.fillStyle=gr;g.fillRect(0,0,W,hz);
  const pw=W/9;for(let i=0;i<10;i++){g.fillStyle=i&1?'rgba(255,255,255,.03)':'rgba(0,0,0,.12)';g.fillRect(i*pw,0,pw,hz);}
  g.fillStyle='#237681';g.fillRect(0,hz*.66,W,hz*.34);g.fillStyle='#2d8a92';g.fillRect(0,hz*.66,W,hz*.05);
  g.fillStyle='#b89040';g.fillRect(0,hz*.66-3,W,3);g.fillStyle=OUT;g.fillRect(0,hz-2,W,2);
  /* pictures: night-skyline windows */
  const wy=hz*.16,wh=hz*.4;[[.1],[.34],[.66],[.9]].forEach(([fx])=>{const ww=Math.min(W*.1,90*1.3),x=W*fx-ww/2;g.fillStyle='#0d0a1c';g.fillRect(x-4,wy-4,ww+8,wh+8);
   const sg=g.createLinearGradient(0,wy,0,wy+wh);sg.addColorStop(0,'#2a2a6a');sg.addColorStop(1,'#6d4a9a');g.fillStyle=sg;g.fillRect(x,wy,ww,wh);
   g.fillStyle='#161236';for(let k=0;k<4;k++){const bh=wh*(.35+((k*37)%5)*.1),bw=ww/4;g.fillRect(x+k*bw,wy+wh-bh,bw-2,bh);g.fillStyle='#ffd05c';for(let r=0;r<Math.floor(bh/10);r++)if((r+k)%2)g.fillRect(x+k*bw+3,wy+wh-bh+4+r*10,3,3);g.fillStyle='#161236';}});
  /* elevator at far right-back and reception desk */
  const ex=W*.5-W*.045,ey=hz*.24,ew=W*.09,eh=hz*.76;g.fillStyle='#0d0a1c';g.fillRect(ex-5,ey-5,ew+10,eh+5);g.fillStyle='#46467a';g.fillRect(ex,ey,ew,eh);g.fillStyle='#8793ae';g.fillRect(ex,ey,ew/2-1,eh);g.fillRect(ex+ew/2+1,ey,ew/2-1,eh);
  g.fillStyle='#5ee07a';g.beginPath();g.moveTo(ex+ew/2-9,ey-18);g.lineTo(ex+ew/2+9,ey-18);g.lineTo(ex+ew/2,ey-8);g.fill();
  const dy=hz*.62,dh=hz*.38;g.fillStyle='#8a5230';g.fillRect(W*.02,dy,W*.2,dh);g.fillStyle='#b06f3c';g.fillRect(W*.02-4,dy-6,W*.2+8,8);g.fillStyle='#0d0a1c';g.fillRect(W*.02,dy+dh-2,W*.2,2);
  g.fillStyle='#8ff3ff';g.fillRect(W*.05,dy-20,W*.04,14);g.fillRect(W*.12,dy-20,W*.04,14);
  /* floor */
  const rows=9,cols=14;g.save();g.beginPath();g.rect(0,hz,W,H-hz);g.clip();
  const yr=k=>hz+(H-hz)*Math.pow(k/rows,1.7),xb=i=>vx+(i-cols/2)*(W*1.9/cols),xa=(i,y)=>vx+(xb(i)-vx)*((y-vy)/(H-vy));
  for(let k=0;k<rows;k++){const y0=yr(k),y1=yr(k+1);for(let i=0;i<cols;i++){g.fillStyle=(i+k)&1?MATS.carpetA:MATS.carpetB;g.beginPath();g.moveTo(xa(i,y0),y0);g.lineTo(xa(i+1,y0),y0);g.lineTo(xa(i+1,y1),y1);g.lineTo(xa(i,y1),y1);g.closePath();g.fill();}}
  g.strokeStyle='rgba(13,10,28,.55)';g.lineWidth=1.5;for(let k=0;k<=rows;k++){const y=yr(k);g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();}
  for(let i=0;i<=cols;i++){g.beginPath();g.moveTo(xa(i,hz),hz);g.lineTo(xb(i),H);g.stroke();}
  /* stains */
  g.fillStyle='rgba(28,24,56,.6)';[[.12,.78,40,8],[.62,.62,34,7],[.88,.9,50,10],[.4,.95,36,8]].forEach(([a,b,rx,ry])=>{g.beginPath();g.ellipse(W*a,H*b,rx*W/1280*1.3,ry*W/1280*1.3,0,0,TAU);g.fill();});
  g.restore();g.fillStyle=OUT;g.fillRect(0,hz,W,2);
  /* plants */
  [[.04,.58],[.96,.58]].forEach(([fx,fy])=>{const x=W*fx,y=H*fy,s=H/800;g.fillStyle='#a2562e';g.beginPath();g.moveTo(x-22*s,y);g.lineTo(x+22*s,y);g.lineTo(x+16*s,y+36*s);g.lineTo(x-16*s,y+36*s);g.closePath();g.fill();g.strokeStyle=OUT;g.lineWidth=2;g.stroke();
   g.fillStyle='#3da66a';for(let k=0;k<5;k++){const a=-1.9+k*.45;g.beginPath();g.ellipse(x+Math.cos(a)*22*s,y-8*s+Math.sin(a)*34*s,9*s,30*s,a+Math.PI/2,0,TAU);g.fill();g.stroke();}});
 }
 const OUT='#0d0a1c';
 const MATS={carpetA:'#2f3766',carpetB:'#272d57'};
 function layout(){
  const r=cv.parentElement.getBoundingClientRect();W=Math.round(r.width);H=Math.round(r.height);DPR=Math.min(window.devicePixelRatio||1,2);
  cv.width=W*DPR;cv.height=H*DPR;paintBG();
 }
 const hash=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n);};
 function render(){
  if(!bg)return;const t=idleT(),f=flourishF();
  cx.setTransform(DPR,0,0,DPR,0,0);cx.globalCompositeOperation='source-over';cx.globalAlpha=1;
  cx.drawImage(bg,0,0,W,H);
  cx.fillStyle='rgba(10,8,26,.55)';cx.fillRect(0,0,W,H);
  /* ceiling lamps: unselected flicker faintly, selected one is a stable warm cone */
  const lx=A.sp*W,poolY=H*.8,pr=Math.min(W*.2,H*.5);
  const pop=f>=0?1+.5*(1-ss(0,.35,f)):1;
  cx.save();cx.globalCompositeOperation='lighter';
  const cg=cx.createLinearGradient(0,0,0,poolY);cg.addColorStop(0,'rgba(255,233,176,.30)');cg.addColorStop(1,'rgba(255,233,176,.07)');
  cx.fillStyle=cg;cx.beginPath();cx.moveTo(lx-W*.035,0);cx.lineTo(lx+W*.035,0);cx.lineTo(lx+pr*1.05,poolY);cx.lineTo(lx-pr*1.05,poolY);cx.closePath();cx.fill();
  for(let k=0;k<3;k++){cx.fillStyle='rgba(255,226,160,'+(.13*pop)+')';cx.beginPath();cx.ellipse(lx,poolY,pr*(1.05-k*.26),pr*(1.05-k*.26)*.3,0,0,TAU);cx.fill();}
  /* idle lamps */
  for(let i=0;i<3;i++){const fl=.5+.5*(hash(Math.floor(t*14)+i*7)>.93?.3:1);const x=SX[i]*W;cx.fillStyle='rgba(255,233,176,'+(.1*fl*(1-A.u[i]))+')';cx.fillRect(x-W*.04,0,W*.08,5);}
  cx.restore();
  /* figures */
  const order=[0,1,2].sort((a,b)=>A.u[a]-A.u[b]);
  for(const i of order){
   const u=A.u[i],fh=H*(.33+.12*u),sc=fh/97,fy=H*(.66+.15*u);
   cx.save();cx.translate(SX[i]*W,fy);
   /* ring on the floor under selected */
   if(u>.02){cx.save();cx.globalAlpha=u;cx.lineWidth=Math.max(3,sc*2.6);cx.strokeStyle=OUT;cx.beginPath();cx.ellipse(0,0,34*sc,10*sc,0,0,TAU);cx.stroke();cx.lineWidth=Math.max(1.5,sc*1.2);cx.strokeStyle='#fff';cx.stroke();cx.restore();}
   cx.scale(sc,sc);
   drawClassFigure(i,cx,t+i*.9,i===ST.sel?f:-1,(1-u)*.62);
   cx.restore();
  }
  /* dust motes in the cone */
  cx.save();cx.globalCompositeOperation='lighter';for(let k=0;k<22;k++){const p=(hash(k)*7+t*(.02+hash(k+9)*.03))%1,x=lx+(hash(k+3)-.5)*pr*1.6*(.2+p*.8)+Math.sin(t*.7+k)*6,y=p*poolY;cx.fillStyle='rgba(255,240,200,'+(.25*Math.sin(p*Math.PI))+')';cx.fillRect(x,y,1.8,1.8);}cx.restore();
  /* vignette */
  const vg=cx.createRadialGradient(W/2,H*.55,Math.min(W,H)*.35,W/2,H*.55,Math.max(W,H)*.75);vg.addColorStop(0,'rgba(8,6,20,0)');vg.addColorStop(1,'rgba(8,6,20,.6)');cx.fillStyle=vg;cx.fillRect(0,0,W,H);
 }
 function update(dt){
  for(let i=0;i<3;i++){const tg=i===ST.sel?1:0;A.u[i]+=(tg-A.u[i])*Math.min(1,dt*7);if(Math.abs(tg-A.u[i])<.002)A.u[i]=tg;}
  A.sp+=(SX[ST.sel]-A.sp)*Math.min(1,dt*7);
 }
 boot({init(){layout();A.u=[0,1,2].map(i=>i===ST.sel?1:0);A.sp=SX[ST.sel];},resize:layout,update,render});
})();
