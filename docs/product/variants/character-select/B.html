<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Character Select B: Personnel Files</title>
<style>
:root{--bg:#14141f;--panel:#241d4e;--panel2:#120e29;--ink:#0d0a1c;--txt:#f4ecd8;--muted:#b8b2d6;--accent:#ffb81f;--cl:#ff8a1f;--line:#3d3068;--fld:#120e29;--btn:#33295f;--btnTxt:#f4ecd8;--pri:#ffb81f;--priTxt:#1b1038;--pip:var(--cl);--pipOff:#3a3366;--focus:#33e0ff;--sans:'Trebuchet MS','Segoe UI',system-ui,'Helvetica Neue','Liberation Sans',Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.35}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cl-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cl-head h2{margin:0;font-size:26px;line-height:1.1;letter-spacing:.2px}
.diff{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border:2px solid var(--line);border-radius:99px;color:var(--muted)}
.diff i{display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor}
.diff i.on{background:currentColor}
.pitch{margin:8px 0 8px;font-size:15px}
.tags{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.tags li{font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;border:2px solid var(--cl);color:var(--txt);background:rgba(0,0,0,.2)}
.stats{margin:0 0 12px;display:grid;grid-template-columns:minmax(0,1fr);gap:7px}
.stat{display:grid;grid-template-columns:84px 1fr 22px;align-items:center;gap:8px}
.stat dt{font-size:12.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.stat dd{margin:0;display:contents}
.pips{display:flex;gap:3px}
.pips span{flex:1;height:12px;border-radius:3px;background:var(--pipOff);border:1.5px solid var(--ink);transition:background .35s}
.pips span.on{background:var(--pip)}
.stat b{font-size:13px;text-align:right}
.sec{margin:0 0 6px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.branches{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:7px}
.branches li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center}
.ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--cl);color:var(--ink);border:2px solid var(--ink)}
.ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.branches b{display:block;font-size:14px}
.branches small{display:block;color:var(--muted);font-size:12px;line-height:1.25}
.fade{animation:fadein .35s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.start{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.namebox label{display:flex;justify-content:space-between;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:4px}
.namebox label .hint{font-weight:600;text-transform:none;letter-spacing:0}
.namerow{display:flex;gap:8px}
.namerow input{flex:1;min-width:0;padding:9px 12px;border-radius:9px;border:2px solid var(--ink);background:var(--fld);color:var(--txt);font-size:16px}
.namerow input::placeholder{color:var(--muted);opacity:.7}
.btn{padding:9px 14px;border-radius:9px;border:2px solid var(--ink);background:var(--btn);color:var(--btnTxt);font-weight:800;min-height:42px}
.btn:hover{filter:brightness(1.12)}
.btn.pri{background:var(--pri);color:var(--priTxt);box-shadow:0 3px 0 var(--ink)}
.btn.pri[aria-disabled=true]{opacity:.45;box-shadow:none;cursor:not-allowed}
.actions{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
.cnt{font-size:12px;color:var(--muted);min-height:16px;display:flex;justify-content:space-between;gap:8px}
.cnt .err{color:#ff9a8a;font-weight:800}
.slotnote{margin:0;font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,30px);background:#0d0a1c;color:#f4ecd8;border:2px solid #ffb81f;border-radius:10px;padding:10px 16px;font-weight:800;max-width:min(92vw,520px);opacity:0;pointer-events:none;transition:.3s;z-index:60;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.dlg{position:fixed;inset:0;background:rgba(8,6,20,.72);display:grid;place-items:center;z-index:50;padding:12px}
.dlg[hidden]{display:none}
.dlg-card{width:min(640px,100%);max-height:100%;overflow:auto;background:#241d4e;color:#f4ecd8;border:3px solid #0d0a1c;border-radius:14px;padding:16px;box-shadow:0 0 0 2px #3d3068,0 20px 60px #000}
.dlg-card h2{margin:0 0 2px;font-size:22px}.dlg-card p{margin:0 0 12px;color:#b8b2d6;font-size:13px}
.slots{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px}
.slot{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:8px;border-radius:10px;background:#120e29;border:2px solid #3d3068}
.slot canvas{width:56px;height:56px;border-radius:8px;border:2px solid #0d0a1c;display:block}
.slot .em{width:56px;height:56px;border-radius:8px;border:2px dashed #5b4f98;display:grid;place-items:center;color:#8f86c4;font-weight:800}
.slot strong{display:block;font-size:15px}.slot span.m{display:block;font-size:12.5px;color:#b8b2d6}
.slot .btn{background:#33295f;color:#f4ecd8}
.slot.empty strong{color:#b8b2d6}
@media (max-width:520px){.slot{grid-template-columns:48px 1fr;}.slot canvas,.slot .em{width:48px;height:48px}.slot .btn{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:520px){.branches{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.branches li{grid-template-columns:1fr;justify-items:center;text-align:center;gap:4px}.branches small{display:none}.branches b{font-size:12.5px;line-height:1.15}}

:root{--paper:#f2ebd8;--pink:#2a2547}
body{overflow:hidden;background:#4a2a18}
#desk{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.app{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,500px) minmax(0,1fr);height:100vh;height:100dvh;gap:0;padding:0 28px 0 0}
.deskside{position:relative;min-width:0}
.deskside h1{position:absolute;left:28px;top:22px;margin:0;font:800 13px/1.2 var(--sans);letter-spacing:2px;text-transform:uppercase;color:#ffe9b0;text-shadow:0 2px 0 #0d0a1c,0 0 10px #0d0a1c}
.deskside p.sub{position:absolute;left:28px;top:42px;margin:0;font-size:12px;color:#e8d8b8;text-shadow:0 1px 0 #0d0a1c;max-width:300px}
.keys{position:absolute;left:28px;bottom:18px;font-size:12px;color:#e8d8b8;text-shadow:0 1px 0 #0d0a1c}
kbd{font:inherit;font-weight:800;border:1.5px solid #8a5a38;border-radius:5px;padding:0 5px;background:#2a1a10;color:#f4ecd8}
.fan{position:absolute;left:0;right:0;top:50%;height:22em;font-size:16.5px;transform:translateY(-56%);margin-left:26px}
.folder{position:absolute;bottom:0;width:14em;height:18em;left:calc(var(--i)*7.2em);padding:0;border:0;background:none;transform-origin:50% 100%;transform:rotate(var(--r)) translateY(0);transition:transform .35s cubic-bezier(.2,.9,.3,1.2),filter .3s;filter:brightness(.72);z-index:var(--z);text-align:left}
.folder.on{transform:rotate(0deg) translateY(-2.2em);filter:none;z-index:5}
.folder:hover{filter:brightness(.92)}.folder.on:hover{filter:none}
.fbody{position:absolute;inset:1.6em 0 0 0;background:linear-gradient(170deg,#ecc984,#d9a95b);border:2px solid #0d0a1c;border-radius:.5em;box-shadow:0 .7em 1.4em rgba(0,0,0,.55),inset 0 0 0 .3em rgba(255,255,255,.12)}
.ftab{position:absolute;top:0;left:calc(.8em + var(--i)*1.5em);width:6.4em;height:2em;background:#d9a95b;border:2px solid #0d0a1c;border-bottom:0;border-radius:.5em .5em 0 0;font:700 .72em/2.6em 'Courier New',monospace;text-align:center;color:#2a2547;letter-spacing:.06em;text-transform:uppercase}
.folder.on .ftab,.folder.on .fbody{border-color:#0d0a1c}
.badge{position:absolute;left:50%;top:2.7em;width:8.8em;transform:translateX(-50%);background:#fdf6e4;border:2px solid #0d0a1c;border-radius:.6em;padding:.5em .5em .5em;text-align:center;box-shadow:0 .2em 0 rgba(0,0,0,.25)}
.badge:before{content:"";position:absolute;left:50%;top:.35em;width:2.2em;height:.5em;margin-left:-1.1em;border-radius:.3em;background:#8a7a60;border:2px solid #0d0a1c}
.badge canvas{display:block;width:100%;aspect-ratio:5/6;margin-top:.9em;border:2px solid #0d0a1c;border-radius:.3em;background:#222}
.badge b{display:block;margin-top:.45em;font:800 .78em/1.15 var(--sans);color:#2a2547;text-transform:uppercase;letter-spacing:.03em}
.badge i{display:block;font:normal 700 .62em/1.4 'Courier New',monospace;color:#5a527a}
.fnum{position:absolute;left:.9em;bottom:.7em;font:700 .66em 'Courier New',monospace;color:#6b4a22}
.fan.rm .folder{transition:none}
.file{position:relative;min-width:0;min-height:0;display:flex;padding:26px 0 26px}
.paper{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--paper);color:var(--pink);border:3px solid #0d0a1c;border-radius:6px;box-shadow:0 14px 40px rgba(0,0,0,.6),0 0 0 6px rgba(255,255,255,.04);transform:rotate(.35deg);--txt:#2a2547;--muted:#5a527a;--line:#cdbf9e;--fld:#fffaf0;--btn:#e7dcc0;--btnTxt:#2a2547;--pipOff:#d9cfb4;--ink:#0d0a1c;--panel:#f2ebd8}
.phead{display:flex;justify-content:space-between;align-items:center;padding:9px 18px;border-bottom:2px dashed #b9aa88;font:700 11px 'Courier New',monospace;letter-spacing:.14em;color:#5a527a;text-transform:uppercase}
.sheet{flex:1;min-height:0;overflow:auto;padding:16px 18px 10px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-content:start}
.photo{position:relative;margin:0;align-self:start;transform:rotate(-1.5deg)}
.photo canvas{display:block;width:100%;aspect-ratio:200/262;background:#fff;border:2px solid #0d0a1c;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.polar{background:#fffdf6;padding:9px 9px 28px;border:2px solid #0d0a1c;box-shadow:0 6px 12px rgba(0,0,0,.25)}
.polar canvas{border:2px solid #0d0a1c;box-shadow:none}
.polar figcaption{position:absolute;left:0;right:0;bottom:6px;text-align:center;font:700 12px 'Courier New',monospace;color:#2a2547}
.stamp{position:absolute;right:-14px;bottom:30px;transform:rotate(-14deg);border:3px double #c8302b;color:#c8302b;font:900 15px/1 var(--sans);letter-spacing:.12em;padding:5px 9px;border-radius:5px;background:rgba(255,253,246,.82);text-transform:uppercase;pointer-events:none}
.stamp.slam{animation:slam .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes slam{0%{transform:rotate(-14deg) scale(2.4);opacity:0}60%{opacity:1}100%{transform:rotate(-14deg) scale(1);opacity:1}}
#info{min-width:0}
#info .cl-head h2{color:#2a2547;font-family:Georgia,'Times New Roman',serif}
.diff{border-color:#2a2547;color:#2a2547}
.tags li{background:#fffaf0;border-color:#2a2547;color:#2a2547}
.pips span{border-color:#2a2547}.pips span.on{background:#2a2547}
.stat b{color:#2a2547}
.ico{background:#2a2547;color:#ffe9b0;border-color:#0d0a1c}
.branches li{padding:2px 0}
#foot{padding:12px 18px 16px;border-top:2px dashed #b9aa88;background:rgba(0,0,0,.04)}
.namebox label{font-family:'Courier New',monospace}
.namerow input{background:#fffaf0;border:0;border-bottom:3px solid #2a2547;border-radius:4px 4px 0 0;font-family:'Courier New',monospace;font-weight:700;color:#2a2547}
.btn{border-color:#0d0a1c}.btn.pri{background:#c8302b;color:#fff8e8}
.btn.pri[aria-disabled=true]{background:#9a7e78}
.cnt .err{color:#b3261e}
@media (max-width:760px){
 .app{grid-template-columns:minmax(0,1fr);grid-template-rows:226px minmax(0,1fr);padding:0}
 .deskside h1{left:16px;top:12px}.deskside p.sub,.keys{display:none}
 .fan{font-size:8.6px;top:auto;bottom:6px;height:22em;transform:none;margin-left:max(14px,calc(50% - 14.2em))}
 .file{padding:0 8px 8px}
 .sheet{grid-template-columns:minmax(0,1fr);gap:8px;padding:10px 12px 6px}
 .photo{transform:none}.polar{padding:0;border:0;background:none;box-shadow:none}.polar figcaption{display:none}
 .photo canvas{aspect-ratio:358/112}.stamp{right:6px;bottom:6px;font-size:12px}
 .phead{padding:6px 12px}#foot{padding:8px 12px 10px}.cl-head h2{font-size:22px}
 .pitch{margin:4px 0 6px}.tags{margin-bottom:8px}.stat{grid-template-columns:84px 1fr 14px;gap:6px}.stat dt{font-size:11px;letter-spacing:0}
 .slotnote{display:none}.paper{transform:none}
}

<main class="app">
 <section class="deskside" aria-label="Choose your class">
  <h1>Personnel files</h1><p class="sub">Three applicants. One desk. Open a file to read it.</p>
  <div class="fan" id="fan" role="radiogroup" aria-label="Class">
   <button type="button" class="folder cls-btn" role="radio" aria-checked="false" style="--i:0;--r:-9deg;--z:1"><span class="ftab">Facilities</span><span class="fbody"></span><span class="badge"><canvas width="220" height="264" aria-hidden="true"></canvas><b>Facilities Manager</b><i>ID 0417 &middot; Heavy</i></span><span class="fnum">FILE 1 / 3</span></button>
   <button type="button" class="folder cls-btn" role="radio" aria-checked="false" style="--i:1;--r:0deg;--z:2"><span class="ftab">Sales</span><span class="fbody"></span><span class="badge"><canvas width="220" height="264" aria-hidden="true"></canvas><b>Sales Rep</b><i>ID 0532 &middot; Agile</i></span><span class="fnum">FILE 2 / 3</span></button>
   <button type="button" class="folder cls-btn" role="radio" aria-checked="false" style="--i:2;--r:9deg;--z:3"><span class="ftab">I.T.</span><span class="fbody"></span><span class="badge"><canvas width="220" height="264" aria-hidden="true"></canvas><b>IT Wizard</b><i>ID 0688 &middot; Caster</i></span><span class="fnum">FILE 3 / 3</span></button>
  </div>
  <div class="keys"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> pick a file &middot; <kbd>L</kbd> load game</div>
 </section>
 <section class="file" aria-label="Class details">
  <div class="paper">
   <div class="phead"><span>Personnel file</span><span>Confidential, Floor 0</span></div>
   <div class="sheet">
    <figure class="photo polar"><canvas id="ph" width="400" height="524" aria-hidden="true"></canvas><figcaption id="cap"></figcaption><span class="stamp" id="stamp">Selected</span></figure>
    <div id="info" aria-live="polite"></div>
   </div>
   <div id="foot"></div>
  </div>
 </section>
</main>
<script>
'use strict';
/* ==================== FIGURES (exported, port to src/render/styles) ====================
   drawFacilitiesManager / drawSalesRep / drawITWizard (ctx, t, f, dim)
   ctx   : 2D context already translated to the FEET CENTRE and scaled (figure is ~97 units tall, y up = negative)
   t     : idle time in seconds (breathing, tricks)      f : "selected" flourish progress 0..1, or -1 for none
   dim   : 0 = full colour, 1 = near-silhouette (used for unselected / hidden classes)
   Style: C2 frozen look = flat fill + one shade, bold dark outline, 1 rim-light arc, oversized head. Palette in FIG_MATS.
   drawClassFigure(i,...) dispatches by class index 0 FM, 1 SR, 2 IT. No other globals are needed except the small helpers below. */
const FIG_OUTL='#0d0a1c';
const FIG_MATS={
 skin:'#f6c49c',ink:'#2a2547',white:'#ffffff',paper:'#ece4cf',steel:'#d3dcea',gold:'#ffb81f',
 fmSkin:'#c98a5e',fmBeard:'#2b1d17',fmPants:'#34456e',fmShirt:'#46618c',fmBoot:'#5a3a28',vest:'#ff8a1f',refl:'#e8eef5',hat:'#ffd23a',belt:'#6b4528',grip:'#d83a2c',steelD:'#8793ae',
 srSuit:'#e0457b',srTie:'#ffd23a',srHair:'#f2c14e',srShoe:'#f4ecd8',shirtW:'#fdf6e4',headset:'#232a58',mic:'#ff8a1f',stapler:'#d83a2c',card:'#fdf6e4',
 itHood:'#6a4cd0',itJeans:'#2c3a6a',itSkin:'#e8b48a',itHair:'#2a1a40',sneak:'#f4ecd8',sole:'#33e0ff',lapBody:'#8793ae',screenC:'#33e0ff',lens:'#c4ecff',cord2:'#ffe9b0',keyc:'#4c5280',cyan:'#33e0ff'};
const FIG_EMIS={screenC:1,cyan:1,sole:1};
function fmix(a,b,t){const h=s=>{s=s.replace('#','');const n=parseInt(s,16);return[(n>>16)&255,(n>>8)&255,n&255];},x=h(a),y=h(b);return'#'+((1<<24)+(Math.round(x[0]+(y[0]-x[0])*t)<<16)+(Math.round(x[1]+(y[1]-x[1])*t)<<8)+Math.round(x[2]+(y[2]-x[2])*t)).toString(16).slice(1);}
const FIG_C={};for(const k in FIG_MATS){const b=FIG_MATS[k];FIG_C[k]=[b,fmix(b,'#1b1038',.24),fmix(b,'#1b1038',.42),fmix(b,'#ffffff',.5)];}
let fc=null,fdim=0;const FOW=1.5,FTAU=Math.PI*2;
function fss(a,b,x){const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);}
function flr(a,b,t){return a+(b-a)*t;}
function fcol(m,sh){let v=FIG_C[m][sh|0];if(fdim>0&&!FIG_EMIS[m])v=fmix(v,'#171232',fdim*.88);else if(fdim>0)v=fmix(v,'#171232',fdim*.7);return v;}
function fE(x,y,rx,ry,m,sh,rot){fc.beginPath();fc.ellipse(x,y,Math.max(rx,.2),Math.max(ry,.2),rot||0,0,FTAU);fc.fillStyle=fcol(m,sh);fc.fill();fc.lineWidth=FOW;fc.lineJoin='round';fc.strokeStyle=FIG_OUTL;fc.stroke();
 if(!sh&&rx>3&&fdim<.3&&!FIG_EMIS[m]){fc.beginPath();fc.ellipse(x,y,rx*.8,ry*.8,rot||0,3.3,4.8);fc.strokeStyle=FIG_C[m][3];fc.lineWidth=.8;fc.lineCap='round';fc.stroke();fc.lineCap='butt';}}
function fP(a,m,sh){fc.beginPath();fc.moveTo(a[0],a[1]);for(let i=2;i<a.length;i+=2)fc.lineTo(a[i],a[i+1]);fc.closePath();fc.fillStyle=fcol(m,sh);fc.fill();fc.lineWidth=FOW;fc.lineJoin='round';fc.strokeStyle=FIG_OUTL;fc.stroke();}
function fL(x1,y1,x2,y2,w,m,sh){fc.lineCap='round';fc.beginPath();fc.moveTo(x1,y1);fc.lineTo(x2,y2);fc.strokeStyle=FIG_OUTL;fc.lineWidth=w+FOW*1.6;fc.stroke();fc.strokeStyle=fcol(m,sh);fc.lineWidth=w;fc.stroke();
 if(!sh&&w>4&&fdim<.3&&!FIG_EMIS[m]){fc.strokeStyle=FIG_C[m][3];fc.lineWidth=Math.max(.7,w*.16);fc.beginPath();fc.moveTo(x1-w*.25,y1-w*.25);fc.lineTo(x2-w*.25,y2-w*.25);fc.stroke();}fc.lineCap='butt';}
function fGlow(x,y,r,col,a){if(fdim>.5||a<=0)return;const g=fc.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');fc.save();fc.globalCompositeOperation='lighter';fc.globalAlpha=Math.min(1,a);fc.fillStyle=g;fc.fillRect(x-r,y-r,r*2,r*2);fc.restore();}
function fText(s,x,y,sz,col){fc.font='800 '+sz+'px "Trebuchet MS","Segoe UI",system-ui,sans-serif';fc.textAlign='center';fc.textBaseline='middle';fc.lineJoin='round';fc.lineWidth=sz*.3;fc.strokeStyle=FIG_OUTL;fc.strokeText(s,x,y);fc.fillStyle=col;fc.fillText(s,x,y);}

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];

let V=null,toastT=0;
function flourishF(){if(RM)return -1;return ST.selT<FL_DUR?ST.selT/FL_DUR:-1;}
function idleT(){return RM?0:ST.T;}
function infoHTML(c){
 const d=c.diff;
 return '<div class="cl-head"><h2 id="clName">'+esc(c.name)+'</h2><span class="diff" aria-label="Difficulty: '+DIFF[d]+'">Difficulty '+DIFF[d]+' <span aria-hidden="true">'+[1,2,3].map(k=>'<i class="'+(k<=d?'on':'')+'"></i>').join('')+'</span></span></div>'

 +'<div class="bwrap"><h3 class="sec">Skill branches</h3><ul class="branches">'+c.branches.map(b=>'<li><span class="ico">'+svg(b.i)+'</span><span><b>'+esc(b.n)+'</b><small>'+esc(b.s)+'</small></span></li>').join('')+'</ul></div>';
}
function footHTML(){
 return '<form class="start" id="startForm" novalidate><div class="namebox"><label for="nm"><span>Character name</span><span class="hint">1 to 16 characters</span></label>'
 +'<div class="namerow"><input id="nm" maxlength="16" autocomplete="off" spellcheck="false" placeholder="Type a name" aria-describedby="cnt"><button type="button" class="btn" id="suggest">Suggest</button></div>'
 +'<div class="cnt" id="cnt" aria-live="polite"><span id="cntN">0 / 16</span><span class="err" id="err"></span></div></div>'
 +'<div class="actions"><button type="submit" class="btn pri" id="go" aria-disabled="true">Start</button><button type="button" class="btn" id="loadBtn" aria-haspopup="dialog">Load game</button></div>'
 +'<p class="slotnote" id="slotnote"></p></form>';
}
function dlgHTML(){
 return '<div class="dlg" id="dlg" hidden><div class="dlg-card" role="dialog" aria-modal="true" aria-labelledby="dlgT"><h2 id="dlgT">Load game</h2><p>5 save slots. Pick one to continue, or an empty slot to start fresh there.</p><ul class="slots" id="slots"></ul><button type="button" class="btn" id="dlgClose">Close</button></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div>';
}
function bustCanvas(cv,ci){
 const dpr=2,s=cv.clientWidth||56;cv.width=cv.height=s*dpr;const x=cv.getContext('2d');x.scale(dpr,dpr);
 x.fillStyle=fmix(CLASSES[ci].cl,'#120e29',.72);x.fillRect(0,0,s,s);x.save();const k=s/46;x.translate(s/2,s*.5+77*k);x.scale(k,k);drawClassFigure(ci,x,0,-1,0);x.restore();
}
function renderSlots(){
 $('#slots').innerHTML=SLOTS.map((s,i)=>s?'<li class="slot"><canvas data-c="'+s.c+'" aria-hidden="true"></canvas><div><strong>Slot '+(i+1)+': '+CLASSES[s.c].name+'</strong><span class="m">Level '+s.lv+' &middot; Depth '+s.depth+' &middot; Played '+s.play+'</span><span class="m">Last played: '+s.last+'</span></div><button class="btn" data-load="'+i+'">Load</button></li>'
  :'<li class="slot empty"><div class="em" aria-hidden="true">+</div><div><strong>Slot '+(i+1)+': Empty</strong><span class="m">No character saved here yet</span></div><button class="btn" data-new="'+i+'">New game here</button></li>').join('');
 $$('#slots canvas').forEach(c=>bustCanvas(c,+c.dataset.c));
}
let lastFocus=null;
function openLoad(){lastFocus=document.activeElement;$('#dlg').hidden=false;renderSlots();const b=$('#slots .btn');b&&b.focus();}
function closeLoad(){$('#dlg').hidden=true;lastFocus&&lastFocus.focus&&lastFocus.focus();}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3600);}
function validName(){const v=$('#nm').value.trim();return v.length>=1&&v.length<=16;}
function syncName(){const v=$('#nm').value;$('#cntN').textContent=v.length+' / 16';$('#go').setAttribute('aria-disabled',validName()?'false':'true');if(validName())$('#err').textContent='';}
function slotNote(){$('#slotnote').textContent='New game saves to slot '+(ST.slot+1)+'. '+SLOTS.filter(Boolean).length+' of 5 slots used.';}
function renderInfo(){
 const c=CLASSES[ST.sel];document.documentElement.style.setProperty('--cl',c.cl);
 const el=$('#info');el.innerHTML=infoHTML(c);el.classList.remove('fade');void el.offsetWidth;if(FRAME===null)el.classList.add('fade');
 $$('.cls-btn').forEach((b,i)=>{b.setAttribute('aria-checked',i===ST.sel?'true':'false');b.tabIndex=i===ST.sel?0:-1;b.classList.toggle('on',i===ST.sel);});
}
function select(i,focus){
 ST.sel=clamp(i,0,2);ST.selT=0;renderInfo();V.onSelect&&V.onSelect(ST.sel);
 if(focus){const b=$$('.cls-btn')[ST.sel];b&&b.focus();}
 draw();
}
function draw(){V.render();}
function step(dt){ST.T+=dt;ST.selT+=dt;V.update&&V.update(dt);}
function boot(variant){
 V=variant;
 document.body.insertAdjacentHTML('beforeend',dlgHTML());
 $('#foot').innerHTML=footHTML();
 const nm=$('#nm');if(QS.get('name'))nm.value=QS.get('name').slice(0,16);
 slotNote();renderInfo();syncName();
 $$('.cls-btn').forEach((b,i)=>{b.addEventListener('click',()=>select(i,false));});
 nm.addEventListener('input',syncName);
 $('#suggest').addEventListener('click',()=>{ST.nameIdx=(ST.nameIdx+1+(FRAME===null?Math.floor(Math.random()*5):0))%NAMES.length;nm.value=NAMES[ST.nameIdx];syncName();nm.focus();});
 $('#loadBtn').addEventListener('click',openLoad);$('#dlgClose').addEventListener('click',closeLoad);
 $('#dlg').addEventListener('click',e=>{if(e.target.id==='dlg')closeLoad();
  const l=e.target.closest('[data-load]'),n=e.target.closest('[data-new]');
  if(l){const s=SLOTS[+l.dataset.load];closeLoad();toast('Loading slot '+(+l.dataset.load+1)+': '+CLASSES[s.c].name+', level '+s.lv+'. (Prototype: nothing is loaded.)');}
  if(n){ST.slot=+n.dataset.new;slotNote();closeLoad();toast('New game will use slot '+(ST.slot+1)+'.');}});
 $('#startForm').addEventListener('submit',e=>{e.preventDefault();
  if(!validName()){$('#err').textContent='Enter a name, 1 to 16 characters.';nm.focus();return;}
  ST.selT=0;toast('Clocking in: '+nm.value.trim()+', '+CLASSES[ST.sel].name+', slot '+(ST.slot+1)+'. (Prototype: nothing is saved.)');});
 document.addEventListener('keydown',e=>{
  if(!$('#dlg').hidden){if(e.key==='Escape'){e.preventDefault();closeLoad();}
   else if(e.key==='Tab'){const f=$$('#dlg button');const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}return;}
  const tg=e.target,typing=tg.tagName==='INPUT';
  if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
  const onCls=tg.classList&&tg.classList.contains('cls-btn');
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){e.preventDefault();select((ST.sel+2)%3,onCls);}
  else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){e.preventDefault();select((ST.sel+1)%3,onCls);}
  else if(e.key==='1'||e.key==='2'||e.key==='3'){select(+e.key-1,onCls);}
  else if((e.key==='Enter'||e.key===' ')&&onCls){e.preventDefault();select(ST.sel,true);}
  else if(e.key==='l'||e.key==='L'){e.preventDefault();openLoad();}
  else if(e.key==='/'||e.key==='n'||e.key==='N'){e.preventDefault();nm.focus();}
 });
 V.init();
 addEventListener('resize',()=>{V.resize&&V.resize();draw();});
 if(QS.get('load')==='1')openLoad();
 if(FRAME!==null){for(let i=0;i<FRAME;i++)step(1/60);draw();document.body.dataset.ready='1';window.__ready=true;}
 else{let last=performance.now();const loop=n=>{const dt=Math.min(.05,(n-last)/1000);last=n;step(dt);draw();requestAnimationFrame(loop);};
  draw();window.__ready=true;document.body.dataset.ready='1';requestAnimationFrame(loop);}
}

(function(){
 const dk=document.getElementById('desk'),dx=dk.getContext('2d'),ph=document.getElementById('ph'),px=ph.getContext('2d'),TAU=Math.PI*2;
 const bad=[...document.querySelectorAll('.badge canvas')],bx=bad.map(c=>c.getContext('2d'));
 let W=0,H=0,DPR=1,dbg=null;
 const hash=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n);};
 function paintDesk(){
  dbg=document.createElement('canvas');dbg.width=W*DPR;dbg.height=H*DPR;const g=dbg.getContext('2d');g.scale(DPR,DPR);
  const gr=g.createLinearGradient(0,0,W,H);gr.addColorStop(0,'#7a4528');gr.addColorStop(1,'#5a3220');g.fillStyle=gr;g.fillRect(0,0,W,H);
  const ph_=Math.max(70,H/9);for(let y=0;y<H;y+=ph_){g.fillStyle='rgba(13,10,28,.45)';g.fillRect(0,y,W,2.5);}
  for(let i=0;i<260;i++){const y=hash(i)*H,x=hash(i+5)*W,l=40+hash(i+9)*160;g.strokeStyle='rgba(30,16,8,'+(.08+hash(i+2)*.12)+')';g.lineWidth=1;g.beginPath();g.moveTo(x,y);g.bezierCurveTo(x+l*.3,y+2,x+l*.7,y-2,x+l,y+1);g.stroke();}
  const s=Math.min(W,H*1.6)/1280;
  /* mug (top-down), ring stain, stapler, pencil cup, notepad */
  g.save();g.translate(W*.035+20,H*.2);g.scale(s,s);g.fillStyle='rgba(20,10,5,.35)';g.beginPath();g.arc(70,12,26,0,TAU);g.fill();
  g.fillStyle='#fff3d8';g.strokeStyle='#0d0a1c';g.lineWidth=3;g.beginPath();g.arc(0,0,26,0,TAU);g.fill();g.stroke();g.beginPath();g.arc(30,0,10,-1.3,1.3);g.stroke();g.fillStyle='#35252e';g.beginPath();g.arc(0,0,20,0,TAU);g.fill();g.fillStyle='rgba(255,255,255,.18)';g.beginPath();g.ellipse(-6,-7,8,4,-.6,0,TAU);g.fill();g.restore();
  g.save();g.translate(W*.03+10,H*.8);g.rotate(-.25);g.scale(s,s);g.fillStyle='#d83a2c';g.strokeStyle='#0d0a1c';g.lineWidth=3;g.beginPath();g.roundRect(-8,-14,86,28,8);g.fill();g.stroke();g.fillStyle='#8793ae';g.beginPath();g.roundRect(52,-10,28,20,5);g.fill();g.stroke();g.restore();
  g.save();g.translate(W*.4,H*.93);g.rotate(.12);g.scale(s,s);g.fillStyle='#e2d9c0';g.strokeStyle='#0d0a1c';g.lineWidth=3;g.fillRect(-40,-22,80,44);g.strokeRect(-40,-22,80,44);g.strokeStyle='#8793ae';g.lineWidth=2;for(let k=0;k<4;k++){g.beginPath();g.moveTo(-32,-12+k*9);g.lineTo(32,-12+k*9);g.stroke();}g.restore();
  g.save();g.translate(W*.02+30,H*.55);g.scale(s,s);g.fillStyle='#363a5e';g.strokeStyle='#0d0a1c';g.lineWidth=3;g.beginPath();g.arc(0,0,28,0,TAU);g.fill();g.stroke();[['#ffd05c',-8,-6],['#56b4e9',6,-10],['#e8590c',2,6]].forEach(([c,x,y],k)=>{g.strokeStyle='#0d0a1c';g.lineWidth=7;g.beginPath();g.moveTo(x,y);g.lineTo(x+(k-1)*6,y-18);g.stroke();g.strokeStyle=c;g.lineWidth=4;g.stroke();});g.restore();
  /* lamp pool and vignette */
  const lg=g.createRadialGradient(W*.55,H*.45,40,W*.55,H*.45,Math.max(W,H)*.7);lg.addColorStop(0,'rgba(255,214,140,.30)');lg.addColorStop(1,'rgba(10,6,20,.62)');g.fillStyle=lg;g.fillRect(0,0,W,H);
 }
 function layout(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);dk.width=W*DPR;dk.height=H*DPR;paintDesk();}
 function drawBust(ctx,w,h,ci,t,f,dim){
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,w,h);
  const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,fmix(CLASSES[ci].cl,'#120e29',.62));g.addColorStop(1,fmix(CLASSES[ci].cl,'#120e29',.85));ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  const k=w/52;ctx.save();ctx.translate(w/2-2*k,6*k+97*k*.98);ctx.scale(k,k);drawClassFigure(ci,ctx,t,f,dim);ctx.restore();
 }
 function drawPhoto(t,f){
  const c=ph,w=c.clientWidth||200,h=c.clientHeight||262,dp=2;if(c.width!==Math.round(w*dp)||c.height!==Math.round(h*dp)){c.width=Math.round(w*dp);c.height=Math.round(h*dp);}
  px.setTransform(dp,0,0,dp,0,0);const ci=ST.sel,col=CLASSES[ci].cl;
  const g=px.createLinearGradient(0,0,0,h);g.addColorStop(0,fmix(col,'#ffffff',.55));g.addColorStop(1,fmix(col,'#241d4e',.45));px.fillStyle=g;px.fillRect(0,0,w,h);
  px.fillStyle='rgba(13,10,28,.18)';px.fillRect(0,h*.82,w,h*.18);
  const wide=w>h*1.5,k=(h*.84)/97;px.save();px.translate(w*(wide?.5:.44),h*.9);px.scale(k,k);drawClassFigure(ci,px,t,f,0);px.restore();
 }
 function render(){
  if(!dbg)return;const t=idleT(),f=flourishF();
  dx.setTransform(DPR,0,0,DPR,0,0);dx.drawImage(dbg,0,0,W,H);
  bx.forEach((x,i)=>{const w=bad[i].width,h=bad[i].height;drawBust(x,w,h,i,t+i,i===ST.sel?f:-1,i===ST.sel?0:.35);});
  drawPhoto(t,f);
  document.getElementById('cap').textContent=CLASSES[ST.sel].name;
 }
 function stamp(){const s=document.getElementById('stamp');s.classList.remove('slam');void s.offsetWidth;if(FRAME===null&&!RM)s.classList.add('slam');}
 boot({init(){layout();document.getElementById('fan').classList.toggle('rm',RM);},resize:layout,render,onSelect:stamp});
})();
