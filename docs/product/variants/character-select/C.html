<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Character Select C: Elevator Doors</title>
<style>
:root{--bg:#14141f;--panel:#241d4e;--panel2:#120e29;--ink:#0d0a1c;--txt:#f4ecd8;--muted:#b8b2d6;--accent:#ffb81f;--cl:#ff8a1f;--line:#3d3068;--fld:#120e29;--btn:#33295f;--btnTxt:#f4ecd8;--pri:#ffb81f;--priTxt:#1b1038;--pip:var(--cl);--pipOff:#3a3366;--focus:#33e0ff;--sans:'Trebuchet MS','Segoe UI',system-ui,'Helvetica Neue','Liberation Sans',Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.35}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cl-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cl-head h2{margin:0;font-size:26px;line-height:1.1;letter-spacing:.2px}
.diff{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border:2px solid var(--line);border-radius:99px;color:var(--muted)}
.diff i{display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor}
.diff i.on{background:currentColor}
.pitch{margin:8px 0 8px;font-size:15px}
.tags{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.tags li{font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;border:2px solid var(--cl);color:var(--txt);background:rgba(0,0,0,.2)}
.stats{margin:0 0 12px;display:grid;grid-template-columns:minmax(0,1fr);gap:7px}
.stat{display:grid;grid-template-columns:84px 1fr 22px;align-items:center;gap:8px}
.stat dt{font-size:12.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.stat dd{margin:0;display:contents}
.pips{display:flex;gap:3px}
.pips span{flex:1;height:12px;border-radius:3px;background:var(--pipOff);border:1.5px solid var(--ink);transition:background .35s}
.pips span.on{background:var(--pip)}
.stat b{font-size:13px;text-align:right}
.sec{margin:0 0 6px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.branches{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:7px}
.branches li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center}
.ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--cl);color:var(--ink);border:2px solid var(--ink)}
.ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.branches b{display:block;font-size:14px}
.branches small{display:block;color:var(--muted);font-size:12px;line-height:1.25}
.fade{animation:fadein .35s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.start{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.namebox label{display:flex;justify-content:space-between;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:4px}
.namebox label .hint{font-weight:600;text-transform:none;letter-spacing:0}
.namerow{display:flex;gap:8px}
.namerow input{flex:1;min-width:0;padding:9px 12px;border-radius:9px;border:2px solid var(--ink);background:var(--fld);color:var(--txt);font-size:16px}
.namerow input::placeholder{color:var(--muted);opacity:.7}
.btn{padding:9px 14px;border-radius:9px;border:2px solid var(--ink);background:var(--btn);color:var(--btnTxt);font-weight:800;min-height:42px}
.btn:hover{filter:brightness(1.12)}
.btn.pri{background:var(--pri);color:var(--priTxt);box-shadow:0 3px 0 var(--ink)}
.btn.pri[aria-disabled=true]{opacity:.45;box-shadow:none;cursor:not-allowed}
.actions{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
.cnt{font-size:12px;color:var(--muted);min-height:16px;display:flex;justify-content:space-between;gap:8px}
.cnt .err{color:#ff9a8a;font-weight:800}
.slotnote{margin:0;font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,30px);background:#0d0a1c;color:#f4ecd8;border:2px solid #ffb81f;border-radius:10px;padding:10px 16px;font-weight:800;max-width:min(92vw,520px);opacity:0;pointer-events:none;transition:.3s;z-index:60;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.dlg{position:fixed;inset:0;background:rgba(8,6,20,.72);display:grid;place-items:center;z-index:50;padding:12px}
.dlg[hidden]{display:none}
.dlg-card{width:min(640px,100%);max-height:100%;overflow:auto;background:#241d4e;color:#f4ecd8;border:3px solid #0d0a1c;border-radius:14px;padding:16px;box-shadow:0 0 0 2px #3d3068,0 20px 60px #000}
.dlg-card h2{margin:0 0 2px;font-size:22px}.dlg-card p{margin:0 0 12px;color:#b8b2d6;font-size:13px}
.slots{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px}
.slot{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:8px;border-radius:10px;background:#120e29;border:2px solid #3d3068}
.slot canvas{width:56px;height:56px;border-radius:8px;border:2px solid #0d0a1c;display:block}
.slot .em{width:56px;height:56px;border-radius:8px;border:2px dashed #5b4f98;display:grid;place-items:center;color:#8f86c4;font-weight:800}
.slot strong{display:block;font-size:15px}.slot span.m{display:block;font-size:12.5px;color:#b8b2d6}
.slot .btn{background:#33295f;color:#f4ecd8}
.slot.empty strong{color:#b8b2d6}
@media (max-width:520px){.slot{grid-template-columns:48px 1fr;}.slot canvas,.slot .em{width:48px;height:48px}.slot .btn{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:520px){.branches{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.branches li{grid-template-columns:1fr;justify-items:center;text-align:center;gap:4px}.branches small{display:none}.branches b{font-size:12.5px;line-height:1.15}}

body{overflow:hidden}
.app{display:grid;grid-template-rows:minmax(0,57fr) minmax(0,43fr);height:100vh;height:100dvh}
.hall{position:relative;min-height:0;overflow:hidden;background:#161236}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.ttl{position:absolute;left:20px;top:12px;z-index:2;pointer-events:none}
.ttl h1{margin:0;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#ffe9b0;text-shadow:0 2px 0 #0d0a1c,0 0 8px #0d0a1c}
.keys{position:absolute;right:18px;top:12px;z-index:2;font-size:12px;color:#b8b2d6;pointer-events:none;text-shadow:0 1px 0 #0d0a1c}
kbd{font:inherit;font-weight:800;border:1.5px solid #5b4f98;border-radius:5px;padding:0 5px;background:#120e29;color:#f4ecd8}
.cars{position:absolute;inset:0}
.cls-btn{position:absolute;top:2%;bottom:0;width:var(--cw);left:calc(var(--x)*1% - var(--cw)/2);background:none;border:0;padding:0;border-radius:10px}
.cls-btn .lbl{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);white-space:nowrap;font-weight:800;font-size:13px;letter-spacing:.5px;padding:5px 12px;border-radius:99px;background:rgba(13,10,28,.86);border:2px solid #3d3068;color:#b8b2d6;text-transform:uppercase;transition:.25s}
.cls-btn.on .lbl{color:#14102c;background:var(--c);border-color:#0d0a1c}
.cls-btn:hover .lbl{border-color:var(--c);color:#f4ecd8}.cls-btn.on:hover .lbl{color:#14102c}
.deck{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-top:3px solid var(--ink);box-shadow:0 -2px 0 var(--line)}
#info{flex:1;min-height:0;overflow:auto;padding:14px 28px 6px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,1.15fr);column-gap:30px;align-content:start;align-items:start}
#info .cl-head,#info .pitch,#info .tags{grid-column:1}
#info .stats{grid-column:2;grid-row:1/span 3;margin-top:4px}
#info .bwrap{grid-column:3;grid-row:1/span 3}
#info .tags{margin-bottom:0}
#foot{padding:10px 28px 12px;background:var(--panel2);border-top:3px solid var(--ink)}
#foot .start{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:end;column-gap:24px;row-gap:4px}
#foot .slotnote{grid-column:1/-1}
@media (max-height:760px){#foot .slotnote{display:none}}
@media (max-width:900px){
 .app{grid-template-rows:minmax(0,35dvh) minmax(0,1fr)}
 #info{display:block;padding:10px 16px 6px}#info .stats{margin-top:0}
 #foot{padding:8px 16px 10px}#foot .start{grid-template-columns:minmax(0,1fr);gap:8px}#foot .slotnote{display:none}
 .keys{display:none}.ttl{display:none}.cl-head h2{font-size:22px}.pitch{margin:4px 0 6px}.tags{margin-bottom:8px!important}
 .stat{grid-template-columns:84px 1fr 14px;gap:6px}.stat dt{font-size:11px;letter-spacing:0}
 .cls-btn .lbl{font-size:10px;padding:3px 8px;bottom:5px;white-space:normal;text-align:center;width:92%;line-height:1.1}
}

<main class="app">
 <section class="hall" aria-label="Choose your class">
  <canvas id="cv" aria-hidden="true"></canvas>

   <button type="button" class="cls-btn" role="radio" aria-checked="false" style="--x:20;--cw:27%;--c:#ff8a1f"><span class="lbl">Facilities Manager</span></button>
   <button type="button" class="cls-btn" role="radio" aria-checked="false" style="--x:50;--cw:27%;--c:#ff6fa3"><span class="lbl">Sales Rep</span></button>
   <button type="button" class="cls-btn" role="radio" aria-checked="false" style="--x:80;--cw:27%;--c:#33e0ff"><span class="lbl">IT Wizard</span></button>
  </div>
 </section>
 <section class="deck" aria-label="Class details"><div id="info" aria-live="polite"></div><div id="foot"></div></section>
</main>

 fP([-13.1,-43,-4.2,-43,-4.1,-38.8,-13,-38.8],'refl',0);fP([4.1,-43,13.1,-43,13,-38.8,4.1,-38.8],'refl',0);
 fP([-14,-64+bob,-9,-64+bob,-10,-55,-14,-56],'refl',0);fP([9,-64+bob,14,-64+bob,14,-56,10,-55],'refl',0);
 fP([-13,-33,13,-33,13,-27.5,-13,-27.5],'belt',0);fP([-2.6,-32.4,2.6,-32.4,2.6,-28.2,-2.6,-28.2],'gold',0);
 fP([-12.5,-27.5,-6,-27.5,-6.4,-18.5,-12,-18.5],'belt',1);fL(-9,-27,-9.4,-17.5,2.4,'steelD',1);
 fL(8.6,-27.5,9.4,-17,2.8,'steelD',1);fL(11.4,-27.5,12.6,-19,2.2,'grip',1);fE(12.8,-22.6,2.7,2.7,'gold',1);

 fL(14+lean,-61+bob,hx,hy,8.6,'fmShirt',0);fE(hx,hy,4.7,4.7,'fmSkin',0);

 const el=$('#info');el.innerHTML=infoHTML(c);el.classList.remove('fade');void el.offsetWidth;if(FRAME===null)el.classList.add('fade');
 $$('.cls-btn').forEach((b,i)=>{b.setAttribute('aria-checked',i===ST.sel?'true':'false');b.tabIndex=i===ST.sel?0:-1;b.classList.toggle('on',i===ST.sel);});
}
function select(i,focus){
 ST.sel=clamp(i,0,2);ST.selT=0;renderInfo();V.onSelect&&V.onSelect(ST.sel);
 if(focus){const b=$$('.cls-btn')[ST.sel];b&&b.focus();}

}
function draw(){V.render();}
function step(dt){ST.T+=dt;ST.selT+=dt;V.update&&V.update(dt);}
function boot(variant){
 V=variant;
 document.body.insertAdjacentHTML('beforeend',dlgHTML());
 $('#foot').innerHTML=footHTML();
 const nm=$('#nm');if(QS.get('name'))nm.value=QS.get('name').slice(0,16);
 slotNote();renderInfo();syncName();
 $$('.cls-btn').forEach((b,i)=>{b.addEventListener('click',()=>select(i,false));});
 nm.addEventListener('input',syncName);
 $('#suggest').addEventListener('click',()=>{ST.nameIdx=(ST.nameIdx+1+(FRAME===null?Math.floor(Math.random()*5):0))%NAMES.length;nm.value=NAMES[ST.nameIdx];syncName();nm.focus();});
 $('#loadBtn').addEventListener('click',openLoad);$('#dlgClose').addEventListener('click',closeLoad);
 $('#dlg').addEventListener('click',e=>{if(e.target.id==='dlg')closeLoad();
  const l=e.target.closest('[data-load]'),n=e.target.closest('[data-new]');
  if(l){const s=SLOTS[+l.dataset.load];closeLoad();toast('Loading slot '+(+l.dataset.load+1)+': '+CLASSES[s.c].name+', level '+s.lv+'. (Prototype: nothing is loaded.)');}
  if(n){ST.slot=+n.dataset.new;slotNote();closeLoad();toast('New game will use slot '+(ST.slot+1)+'.');}});
 $('#startForm').addEventListener('submit',e=>{e.preventDefault();
  if(!validName()){$('#err').textContent='Enter a name, 1 to 16 characters.';nm.focus();return;}
  ST.selT=0;toast('Clocking in: '+nm.value.trim()+', '+CLASSES[ST.sel].name+', slot '+(ST.slot+1)+'. (Prototype: nothing is saved.)');});
 document.addEventListener('keydown',e=>{
  if(!$('#dlg').hidden){if(e.key==='Escape'){e.preventDefault();closeLoad();}
   else if(e.key==='Tab'){const f=$$('#dlg button');const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}return;}
  const tg=e.target,typing=tg.tagName==='INPUT';
  if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
  const onCls=tg.classList&&tg.classList.contains('cls-btn');
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){e.preventDefault();select((ST.sel+2)%3,onCls);}
  else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){e.preventDefault();select((ST.sel+1)%3,onCls);}
  else if(e.key==='1'||e.key==='2'||e.key==='3'){select(+e.key-1,onCls);}
  else if((e.key==='Enter'||e.key===' ')&&onCls){e.preventDefault();select(ST.sel,true);}
  else if(e.key==='l'||e.key==='L'){e.preventDefault();openLoad();}
  else if(e.key==='/'||e.key==='n'||e.key==='N'){e.preventDefault();nm.focus();}
 });
 V.init();
 addEventListener('resize',()=>{V.resize&&V.resize();draw();});
 if(QS.get('load')==='1')openLoad();
 if(FRAME!==null){for(let i=0;i<FRAME;i++)step(1/60);draw();document.body.dataset.ready='1';window.__ready=true;}
 else{let last=performance.now();const loop=n=>{const dt=Math.min(.05,(n-last)/1000);last=n;step(dt);draw();requestAnimationFrame(loop);};
  draw();window.__ready=true;document.body.dataset.ready='1';requestAnimationFrame(loop);}
}
/* ==================== END CORE ==================== */

/* ==================== Variant C: Elevator doors ==================== */
(function(){
 const cv=document.getElementById('cv'),cx=cv.getContext('2d'),TAU=Math.PI*2,OUT='#0d0a1c';
 let W=0,H=0,DPR=1,bg=null;const SX=[.2,.5,.8],O=[0,0,0];
 const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
 const hash=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n);};
 const G={};
 function geom(){const narrow=W<700;G.cw=W*(narrow?.3:.255);G.dw=G.cw*.8;G.top=H*.255;G.bot=H*(narrow?.8:.805);G.hy=H*.05;G.hh=H*.15;}
 function paintBG(){
  bg=document.createElement('canvas');bg.width=W*DPR;bg.height=H*DPR;const g=bg.getContext('2d');g.scale(DPR,DPR);
  const fy=G.bot;
  let gr=g.createLinearGradient(0,0,0,fy);gr.addColorStop(0,'#1a1a3c');gr.addColorStop(1,'#272a58');g.fillStyle=gr;g.fillRect(0,0,W,fy);
  const pw=W/12;for(let i=0;i<13;i++){g.fillStyle=i&1?'rgba(255,255,255,.035)':'rgba(0,0,0,.14)';g.fillRect(i*pw,0,pw,fy);}
  g.fillStyle='#b89040';g.fillRect(0,G.top-H*.075,W,3);g.fillRect(0,fy-H*.07,W,3);
  g.fillStyle='rgba(0,0,0,.25)';g.fillRect(0,fy-H*.07+3,W,H*.07);
  /* floor: polished checker in perspective */
  const fh=H-fy;gr=g.createLinearGradient(0,fy,0,H);gr.addColorStop(0,'#2a2d5c');gr.addColorStop(1,'#14112e');g.fillStyle=gr;g.fillRect(0,fy,W,fh);
  const rows=5,vx=W/2,vy=fy-fh*1.6;
  for(let k=0;k<rows;k++){const y0=fy+fh*Math.pow(k/rows,1.5),y1=fy+fh*Math.pow((k+1)/rows,1.5);for(let i=-9;i<10;i++){if((i+k)&1)continue;const xa=(y,j)=>vx+j*(W*.12)*((y-vy)/(H-vy));g.fillStyle='rgba(255,255,255,.045)';g.beginPath();g.moveTo(xa(y0,i),y0);g.lineTo(xa(y0,i+1),y0);g.lineTo(xa(y1,i+1),y1);g.lineTo(xa(y1,i),y1);g.fill();}}
  g.fillStyle=OUT;g.fillRect(0,fy,W,2);
  /* wall sconces */
  [.05,.95].forEach(fx=>{g.fillStyle='#ffe9b0';g.beginPath();g.ellipse(W*fx,H*.34,5,14,0,0,TAU);g.fill();g.strokeStyle=OUT;g.lineWidth=2;g.stroke();});
 }
 function layout(){const r=cv.parentElement.getBoundingClientRect();W=Math.round(r.width);H=Math.round(r.height);DPR=Math.min(window.devicePixelRatio||1,2);cv.width=W*DPR;cv.height=H*DPR;geom();paintBG();}
 function door(i,o,t,f){
  const cxp=SX[i]*W,dx0=cxp-G.dw/2,dy0=G.top,dh=G.bot-G.top,col=CLASSES[i].cl;
  const e=ss(0,1,o);
  /* spill on the floor + warm bloom */
  if(e>.02){cx.save();cx.globalCompositeOperation='lighter';
   const sg=cx.createLinearGradient(0,G.bot,0,H);sg.addColorStop(0,'rgba(255,226,160,'+(.72*e)+')');sg.addColorStop(1,'rgba(255,226,160,0)');cx.fillStyle=sg;
   cx.beginPath();cx.moveTo(dx0,G.bot);cx.lineTo(dx0+G.dw,G.bot);cx.lineTo(dx0+G.dw+G.dw*.55,H);cx.lineTo(dx0-G.dw*.55,H);cx.closePath();cx.fill();
   const bl=cx.createRadialGradient(cxp,G.bot-dh*.4,10,cxp,G.bot-dh*.4,G.dw*1.15);bl.addColorStop(0,'rgba(255,233,176,'+(.38*e)+')');bl.addColorStop(1,'rgba(255,233,176,0)');cx.fillStyle=bl;cx.fillRect(cxp-G.dw*1.2,dy0-dh*.4,G.dw*2.4,dh*1.7);
   for(let k=-2;k<=2;k++){const rg=cx.createLinearGradient(0,G.bot,0,H);rg.addColorStop(0,'rgba(255,240,200,'+(.2*e)+')');rg.addColorStop(1,'rgba(255,240,200,0)');cx.fillStyle=rg;cx.beginPath();cx.moveTo(cxp+k*G.dw*.14-6,G.bot);cx.lineTo(cxp+k*G.dw*.14+6,G.bot);cx.lineTo(cxp+k*G.dw*.5+14,H);cx.lineTo(cxp+k*G.dw*.5-14,H);cx.fill();}
   cx.restore();}
  /* frame */
  cx.fillStyle=OUT;cx.fillRect(dx0-12,dy0-12,G.dw+24,dh+12);cx.fillStyle='#46467a';cx.fillRect(dx0-8,dy0-8,G.dw+16,dh+8);cx.fillStyle='#b89040';cx.fillRect(dx0-8,dy0-8,G.dw+16,3);
  /* header indicator */
  const hw=G.dw*.8,hx=cxp-hw/2,hy=G.hy,hh=G.hh;cx.fillStyle=OUT;cx.beginPath();cx.roundRect(hx-4,hy-4,hw+8,hh+8,8);cx.fill();cx.fillStyle='#120e29';cx.beginPath();cx.roundRect(hx,hy,hw,hh,6);cx.fill();
  const lit=o>.05,fl=f>=0&&f<.3?1-f/.3:0,pul=lit?.75+.25*Math.sin(t*5):.25;
  cx.fillStyle=lit?'rgba(255,184,31,'+(pul+fl)+')':'rgba(255,184,31,.22)';cx.font='800 '+Math.round(hh*.62)+'px "Trebuchet MS",system-ui,sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(String(i+1),cxp,hy+hh*.54);
  cx.beginPath();cx.moveTo(hx+hw*.12,hy+hh*.7);cx.lineTo(hx+hw*.22,hy+hh*.3);cx.lineTo(hx+hw*.32,hy+hh*.7);cx.closePath();cx.fillStyle=lit?'#5ee07a':'rgba(94,224,122,.2)';cx.fill();
  cx.beginPath();cx.moveTo(hx+hw*.68,hy+hh*.3);cx.lineTo(hx+hw*.78,hy+hh*.7);cx.lineTo(hx+hw*.88,hy+hh*.3);cx.closePath();cx.fillStyle='rgba(255,106,90,.22)';cx.fill();
  /* opening */
  cx.save();cx.beginPath();cx.rect(dx0,dy0,G.dw,dh);cx.clip();
  const ig=cx.createRadialGradient(cxp,dy0+dh*.5,4,cxp,dy0+dh*.5,G.dw*.95);ig.addColorStop(0,'#fff0c4');ig.addColorStop(.4,fmix(col,'#e6b86a',.78));ig.addColorStop(1,fmix(col,'#3a2a4a',.4));cx.fillStyle=ig;cx.fillRect(dx0,dy0,G.dw,dh);
  cx.fillStyle='rgba(255,255,255,.08)';for(let k=1;k<4;k++)cx.fillRect(dx0+G.dw*k/4-1,dy0,2,dh);
  cx.fillStyle='#ffe9b0';cx.fillRect(dx0,dy0,G.dw,6);
  cx.fillStyle='#b89040';cx.fillRect(dx0,dy0+dh*.55,G.dw,5);cx.fillStyle=OUT;cx.fillRect(dx0,dy0+dh*.55+5,G.dw,2);
  cx.fillStyle='#3a2f5a';cx.fillRect(dx0,G.bot-dh*.07,G.dw,dh*.07);
  const sc=dh*.8/97;
  cx.save();cx.translate(cxp,G.bot-dh*.05);
  cx.fillStyle='rgba(8,6,20,.3)';cx.fillRect(-G.dw/2,-dh*.01,G.dw,dh*.06);
  cx.scale(sc,sc);drawClassFigure(i,cx,t+i*.7,f,0);cx.restore();
  if(f>=0&&f<.2){cx.fillStyle='rgba(255,255,255,'+(.5*(1-f/.2))+')';cx.fillRect(dx0,dy0,G.dw,dh);}
  /* doors */
  const pw=G.dw/2,off=e*pw*.98;
  for(let s=0;s<2;s++){
   const x=s===0?dx0-off:dx0+pw+off;
   const dg=cx.createLinearGradient(x,0,x+pw,0);dg.addColorStop(0,'#7c88a6');dg.addColorStop(.5,'#a8b3cb');dg.addColorStop(1,'#78839f');cx.fillStyle=dg;cx.fillRect(x,dy0,pw,dh);
   cx.fillStyle='rgba(255,255,255,.07)';for(let k=0;k<pw;k+=5)cx.fillRect(x+k,dy0,1.5,dh);
   cx.fillStyle='rgba(255,255,255,.12)';cx.beginPath();cx.moveTo(x+pw*.2,dy0);cx.lineTo(x+pw*.5,dy0);cx.lineTo(x+pw*.1,G.bot);cx.lineTo(x-pw*.2,G.bot);cx.closePath();cx.fill();
   cx.fillStyle='rgba(30,36,70,.5)';cx.fillRect(x,G.bot-dh*.09,pw,dh*.09);
   cx.strokeStyle=OUT;cx.lineWidth=2.5;cx.strokeRect(x,dy0,pw,dh);}
  cx.restore();
  /* leak of light at the seam while closed */
  if(e<.05){cx.save();cx.globalCompositeOperation='lighter';const a=.16+.05*Math.sin(t*3+i*2)+(hash(Math.floor(t*10)+i)>.9?.1:0);cx.fillStyle='rgba(255,226,160,'+a+')';cx.fillRect(cxp-1.5,dy0,3,dh);cx.restore();}
 }
 function render(){
  if(!bg)return;const t=idleT();
  cx.setTransform(DPR,0,0,DPR,0,0);cx.globalAlpha=1;cx.globalCompositeOperation='source-over';
  cx.drawImage(bg,0,0,W,H);
  const ff=RM?-1:(ST.selT>.45&&ST.selT<.45+FL_DUR?(ST.selT-.45)/FL_DUR:-1);
  for(let i=0;i<3;i++)door(i,O[i],t,i===ST.sel?ff:-1);
  const vg=cx.createRadialGradient(W/2,H*.5,Math.min(W,H)*.4,W/2,H*.5,Math.max(W,H)*.75);vg.addColorStop(0,'rgba(8,6,20,0)');vg.addColorStop(1,'rgba(8,6,20,.55)');cx.fillStyle=vg;cx.fillRect(0,0,W,H);
 }
 function update(dt){for(let i=0;i<3;i++){const tg=i===ST.sel?1:0,r=tg?2.6:4.2;O[i]+=(tg-O[i])*Math.min(1,dt*r);if(Math.abs(tg-O[i])<.003)O[i]=tg;}}
 boot({init(){layout();if(RM)for(let i=0;i<3;i++)O[i]=i===ST.sel?1:0;},resize:layout,update,render});
})();
