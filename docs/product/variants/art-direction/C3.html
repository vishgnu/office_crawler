<style>html,body{margin:0;height:100%;background:#14141f;overflow:hidden}canvas{display:block;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%)}

</head><body>
<canvas id="c" role="img" aria-label="Style tile of an isometric dungeon office level with a hero, three monsters, loot and the bottom HUD"></canvas>
<noscript>This style tile needs JavaScript and canvas.</noscript>
<script>
'use strict';
/* ===== shared scene: same content in every variant; each variant supplies STYLE, MATS and G (the renderer) ===== */
const QS=new URLSearchParams(location.search);
/* C3 switches: ?scene=office|basement|boardroom  ?frame=N  ?compare=1 (C2 | C3 wipe)  ?legacy=1 (every round-3 addition off = the frozen C2 look; used by compare) */
const CMP=QS.has('compare'),V3=!QS.has('legacy');
const SCENE=QS.get('scene')==='basement'||QS.get('scene')==='boardroom'?QS.get('scene'):'office';
const FRAME=QS.has('frame')?Math.max(0,parseInt(QS.get('frame'),10)||0):null;
const T0=performance.now();
const TAU=Math.PI*2;
function getT(){return FRAME!==null?FRAME/60:(performance.now()-T0)/1000;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,t){return a+(b-a)*t;}
function sstep(a,b,x){const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);}
function hash(n){n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n);}
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255];}
function rgb2hex(r,g,b){return'#'+((1<<24)+(clamp(Math.round(r),0,255)<<16)+(clamp(Math.round(g),0,255)<<8)+clamp(Math.round(b),0,255)).toString(16).slice(1);}
function mixc(a,b,t){const x=hex2rgb(a),y=hex2rgb(b);return rgb2hex(lerp(x[0],y[0],t),lerp(x[1],y[1],t),lerp(x[2],y[2],t));}

/* ---------- projection (2:1 diamond; design tile = 64x32) ---------- */
let Z=1,OX=0,OY=0,PX=0,PY=0;
function P(x,y,z){PX=OX+(x-y)*32*Z;PY=OY+(x+y)*16*Z-(z||0)*Z;}
const N=12;
const HERO={x:5.8,y:5.9},ZOM={x:7.2,y:6.2},DEM={x:2.4,y:6.4},MGR={x:9.4,y:3.2};
const LOOT=[
 {x:6.0,y:9.6,ri:0,name:'Sturdy Lanyard of Focus',lh:56},
 {x:10.4,y:7.0,ri:1,name:'Ergonomic Chair of Haste',lh:66},
 {x:2.1,y:1.7,ri:2,name:'The Corner Office Keycard',lh:56}];
const FIX={x:6.6,y:2.2,z:118},FIX2={x:1.2,y:5.2,z:118};
const MONL={x:0.62,y:1.9,z:38},MONR={x:8.4,y:0.57,z:38},COOL={x:10.7,y:1.0,z:34};

/* ---------- animation state: a pure function of t ---------- */
const ST={t:0,c:0,a:0,hit:-1,flk:1,flk2:1,flkB:1,th:0};
function computeState(t){
  ST.t=t;const c=t%2;ST.c=c;let a=0;
  if(c>=1.0&&c<1.3)a=-0.6*sstep(1.0,1.3,c);
  else if(c>=1.3&&c<1.42){const k=(c-1.3)/0.12;a=lerp(-0.6,1,k*k);}
  else if(c>=1.42&&c<1.55)a=1;
  else if(c>=1.55&&c<1.95)a=1-sstep(1.55,1.95,c);
  ST.a=a;
  const u=(c-1.42+2)%2;ST.hit=u<1.0?u:-1;
  /* fluorescent flicker: buzz bursts every ~4.3 s plus random dips */
  const k=Math.floor(t*26),b=(t%4.3)/4.3;let v=1;
  if(hash(k*3.7)>0.955)v=0.3+hash(k)*0.4;
  if(b>0.86&&b<0.95&&hash(k*1.9+4)>0.35)v=0.15+hash(k*2.3)*0.5;
  ST.flk=clamp(v+Math.sin(t*50)*0.025,0,1);
  {const k2=Math.floor(t*22+7);let v2=1;if(hash(k2*2.9)>0.965)v2=0.35+hash(k2)*0.4;ST.flkB=clamp(v2+Math.sin(t*47)*0.02,0,1);}
  ST.flk2=0.9+Math.sin(t*9.3)*0.04+Math.sin(t*23.1)*0.04+(hash(Math.floor(t*14))-0.5)*0.12; /* candle/monitor shimmer */
}
let FLASH=0;

/* ===== ROUND 3 additions. Everything below is gated by V3 (off with ?legacy=1 = the frozen C2 look). ===== */
/* ---------- baked material textures: 64x64 alpha overlays made once, skewed onto iso faces with pattern transforms ---------- */
function rng(seed){let s=(seed>>>0)||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
function speck(c,r,n,a){for(let i=0;i<n;i++){c.fillStyle=r()<0.5?'rgba(0,0,0,'+(0.07+r()*0.1)*(a||1)+')':'rgba(255,255,255,'+(0.04+r()*0.07)*(a||1)+')';c.fillRect(r()*64|0,r()*64|0,1+(r()*2|0),1);}}
const TEXG={
 weaveA(c,r){for(let y=0;y<64;y+=2){c.fillStyle='rgba(0,0,0,0.1)';c.fillRect(0,y,64,1);}for(let x=0;x<64;x+=2){c.fillStyle='rgba(255,255,255,0.05)';c.fillRect(x,0,1,64);}speck(c,r,240);},
 weaveB(c,r){c.lineWidth=1;for(let k=-64;k<64;k+=3){c.strokeStyle='rgba(0,0,0,0.11)';c.beginPath();c.moveTo(k,0);c.lineTo(k+64,64);c.stroke();}for(let k=-64;k<64;k+=6){c.strokeStyle='rgba(255,255,255,0.06)';c.beginPath();c.moveTo(k+1,0);c.lineTo(k+65,64);c.stroke();}speck(c,r,200);},
 weaveC(c,r){for(let by=0;by<8;by++)for(let bx=0;bx<8;bx++){c.fillStyle='rgba(0,0,0,0.1)';if((bx+by)&1){for(let x=0;x<8;x+=2)c.fillRect(bx*8+x,by*8,1,8);}else{for(let y=0;y<8;y+=2)c.fillRect(bx*8,by*8+y,8,1);}}speck(c,r,160);},
 wood(c,r){for(let i=0;i<22;i++){const y=r()*64,a=r()*0.12+0.06,dk=r()<0.7,ph=r()*6,am=r()*1.6+0.4;c.strokeStyle=dk?'rgba(30,12,4,'+a*1.7+')':'rgba(255,220,170,'+a+')';c.lineWidth=0.6+r()*1.2;c.beginPath();
   for(let x=0;x<=64;x+=4){const yy=y+Math.sin(x*TAU/64*2+ph)*am;if(x)c.lineTo(x,yy);else c.moveTo(x,yy);}c.stroke();}
  const kx=r()*44+10,ky=r()*44+10;c.strokeStyle='rgba(30,12,4,0.28)';c.lineWidth=0.8;for(let k=1;k<4;k++){c.beginPath();c.ellipse(kx,ky,k*2.8,k*1.3,0,0,TAU);c.stroke();}},
 metal(c,r){for(let i=0;i<300;i++){const y=r()*64,x=r()*64,l=8+r()*40;c.fillStyle=r()<0.5?'rgba(255,255,255,'+(0.04+r()*0.09)+')':'rgba(0,0,0,'+(0.05+r()*0.09)+')';c.fillRect(x,y,l,1);if(x+l>64)c.fillRect(x-64,y,l,1);}},
 concrete(c,r){for(let i=0;i<34;i++){c.fillStyle=r()<0.5?'rgba(0,0,0,'+(0.03+r()*0.05)+')':'rgba(255,255,255,'+(0.02+r()*0.035)+')';c.beginPath();c.ellipse(r()*64,r()*64,4+r()*9,3+r()*6,r()*3,0,TAU);c.fill();}speck(c,r,360,1.2);
  c.strokeStyle='rgba(0,0,0,0.18)';c.lineWidth=0.8;c.beginPath();let x=r()*20,y=r()*64;c.moveTo(x,y);for(let k=0;k<5;k++){x+=6+r()*8;y+=(r()-0.5)*10;c.lineTo(x,y);}c.stroke();},
 plaster(c,r){speck(c,r,120,0.7);for(let i=0;i<8;i++){c.fillStyle='rgba(0,0,0,0.025)';c.fillRect(r()*64,0,2+r()*6,64);}},
 paper(c,r){for(let i=0;i<70;i++){c.strokeStyle=r()<0.5?'rgba(120,100,70,0.16)':'rgba(255,255,255,0.28)';c.lineWidth=0.6;const x=r()*64,y=r()*64,a=r()*TAU,l=1.5+r()*3;c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);c.stroke();}},
 cardboard(c,r){for(let x=0;x<64;x+=3){c.fillStyle='rgba(60,30,8,0.16)';c.fillRect(x,0,1,64);c.fillStyle='rgba(255,230,180,0.08)';c.fillRect(x+1,0,1,64);}speck(c,r,160);},
 panel(c,r){for(let x=0;x<64;x+=16){c.fillStyle='rgba(0,0,0,0.22)';c.fillRect(x,0,1.4,64);c.fillStyle='rgba(255,230,190,0.08)';c.fillRect(x+1.4,0,1,64);}
  for(let i=0;i<14;i++){c.strokeStyle='rgba(20,6,10,'+(0.06+r()*0.08)+')';c.lineWidth=0.6;const x=r()*64;c.beginPath();c.moveTo(x,0);for(let y=0;y<=64;y+=8)c.lineTo(x+Math.sin(y*0.2+i)*1.2,y);c.stroke();}}
};
const TEXC={},PATC={},PRC={};
function tex(k){let t=TEXC[k];if(t)return t;t=document.createElement('canvas');t.width=t.height=64;TEXG[k](t.getContext('2d'),rng(k.length*977+k.charCodeAt(0)*31+k.charCodeAt(2)*7));return TEXC[k]=t;}
function pat(k,kind){const key=k+kind;let p=PATC[key];if(p)return p;p=cx.createPattern(tex(k),'repeat');
  const m=kind==='T'?[.5,.25,-.5,.25]:kind==='L'?[.5,.25,0,1]:kind==='R'?[-.5,.25,0,1]:[1,0,0,1];
  p.setTransform(new DOMMatrix([m[0]*Z,m[1]*Z,m[2]*Z,m[3]*Z,0,0]));return PATC[key]=p;}
function pr(k){return PRC[k]||(PRC[k]=cx.createPattern(tex(k),'repeat'));} /* untransformed: used inside the decal spaces below */
let TEXM={}; /* material -> [texture, alpha]; set per scene */
let STAT=false;
function shade2(p,m,sh){
  const t=TEXM[m];
  if(t){cx.fillStyle=pat(t[0],sh===0?'T':sh===1?'L':'R');cx.globalAlpha=t[1];cx.fill();cx.globalAlpha=1;}
  if(sh>0&&!EMIS[m]){let y0=1e9,y1=-1e9;for(let i=1;i<p.length;i+=2){if(p[i]<y0)y0=p[i];if(p[i]>y1)y1=p[i];}
    if(y1-y0>6){const g=cx.createLinearGradient(0,y0,0,y1);g.addColorStop(0,'rgba(10,6,30,0)');g.addColorStop(0.55,'rgba(10,6,30,0.07)');g.addColorStop(1,'rgba(10,6,30,0.36)');cx.fillStyle=g;cx.fill();}}
}

/* ---------- decal spaces: floor (u along x, v along y, 64 units per tile) and wall faces (1 unit = 1 design px; v runs down from z) ---------- */
function sp(a,b,c,d,x,y){cx.setTransform(DPR*a*Z,DPR*b*Z,DPR*c*Z,DPR*d*Z,DPR*x,DPR*y);}
function spFloor(x,y){P(x||0,y||0,0);sp(.5,.25,-.5,.25,PX,PY);}
function spWY(x,y,z){P(x,y,z);sp(.5,.25,0,1,PX,PY);}   /* wall along x (back wall): u runs right-down */
function spWX(x,y,z){P(x,y,z);sp(.5,-.25,0,1,PX,PY);}  /* wall along y (left wall): origin at its larger y, u runs right-up */
function spEnd(){cx.setTransform(DPR,0,0,DPR,0,0);}
function ow(){return Math.max(0.7,lw()/Z*0.7);}
function rO(x,y,w,h,fill,sw){cx.fillStyle=fill;cx.fillRect(x,y,w,h);cx.lineWidth=sw||ow();cx.strokeStyle=OUTL;cx.strokeRect(x,y,w,h);}
function tx(s,x,y,fs,col,al,wt){cx.font=(wt||800)+' '+fs+'px '+SANS;cx.fillStyle=col;cx.textAlign=al||'left';cx.textBaseline='middle';cx.fillText(s,x,y);}
function ln(x1,y1,x2,y2,col,w){cx.strokeStyle=col;cx.lineWidth=w||ow()*0.8;cx.beginPath();cx.moveTo(x1,y1);cx.lineTo(x2,y2);cx.stroke();}
function dsh(x,y,w,h,a){cx.fillStyle='rgba(5,3,16,'+(a||0.4)+')';cx.fillRect(x+1.8,y+2,w,h);}
function paperQ(x,y,w,h,fill,rot){cx.save();cx.translate(x+w/2,y+h/2);cx.rotate(rot||0);dsh(-w/2,-h/2,w,h,0.3);rO(-w/2,-h/2,w,h,fill);cx.fillStyle=pr('paper');cx.fillRect(-w/2,-h/2,w,h);cx.restore();}
function tape(x,y,rot){cx.save();cx.translate(x,y);cx.rotate(rot||0);cx.fillStyle='rgba(235,225,170,0.78)';cx.fillRect(-3,-1.3,6,2.6);cx.restore();}
/* wall items (call inside spWY/spWX, origin = item top-left) */
function wFrame(x,y,w,h,inner,fr){dsh(x,y,w,h,0.4);rO(x,y,w,h,fr||'#b89040',ow()*1.2);cx.fillStyle='rgba(255,255,255,0.35)';cx.fillRect(x+0.6,y+0.6,w-1.2,0.8);rO(x+2,y+2,w-4,h-4,inner,ow()*0.8);}
function wChart(x,y){wFrame(x,y,30,22,'#f3eddc');const b=[11,9.5,8.5,6,3.5];for(let i=0;i<5;i++){cx.fillStyle=i===4?'#d0402c':'#4a78c8';cx.fillRect(x+5+i*4.4,y+18-b[i],3,b[i]);}
  ln(x+5,y+18.5,x+27,y+18.5,'#2a2547');cx.strokeStyle='#d0402c';cx.lineWidth=ow()*0.9;cx.beginPath();cx.moveTo(x+5,y+6);cx.lineTo(x+14,y+7);cx.lineTo(x+24,y+11);cx.lineTo(x+26,y+14);cx.stroke();tx('Q3',x+15,y+4.4,3.2,'#7a1a1a','center');}
function wPoster(x0,y0,k){
  cx.save();cx.translate(x0,y0);cx.scale(0.76,0.76);const x=0,y=0,W=26,H=34;dsh(x,y,W,H,0.4);
  if(k===0){rO(x,y,W,H,'#13213f');const g=cx.createLinearGradient(0,y,0,y+24);g.addColorStop(0,'#2a3f82');g.addColorStop(1,'#e08a52');cx.fillStyle=g;cx.fillRect(x+2,y+2,W-4,22);
    cx.fillStyle='#1b1636';cx.beginPath();cx.moveTo(x+2,y+24);cx.lineTo(x+9,y+11);cx.lineTo(x+14,y+18);cx.lineTo(x+19,y+8);cx.lineTo(x+24,y+24);cx.fill();
    tx('SYNERGY',x+W/2,y+27.2,3.6,'#ffd45c','center',900);tx('(team was taken)',x+W/2,y+31.2,2.4,'#cfd6f5','center',700);}
  else if(k===1){rO(x,y,W,H,'#efe6cf');cx.fillStyle=pr('paper');cx.fillRect(x,y,W,H);cx.strokeStyle=OUTL;cx.lineWidth=ow();cx.lineCap='round';
    ln(x+4,y+4,x+W-4,y+4,'#6b5a42',ow()*1.4);cx.strokeStyle='#2a2547';cx.beginPath();cx.arc(x+W/2,y+9.5,2.2,0,TAU);cx.moveTo(x+W/2,y+11.7);cx.lineTo(x+W/2,y+18);cx.moveTo(x+W/2-5,y+4);cx.lineTo(x+W/2-1.6,y+14);cx.moveTo(x+W/2+5,y+4);cx.lineTo(x+W/2+1.6,y+14);cx.moveTo(x+W/2,y+18);cx.lineTo(x+W/2-3,y+23);cx.moveTo(x+W/2,y+18);cx.lineTo(x+W/2+3,y+23);cx.stroke();cx.lineCap='butt';
    tx('HANG IN THERE',x+W/2,y+27,3.2,'#2a2547','center',900);tx('Friday is a myth',x+W/2,y+31,2.4,'#5a4a6a','center',700);}
  else{rO(x,y,W,H,'#d9423a');cx.fillStyle='#fff4d8';cx.fillRect(x+2.5,y+2.5,W-5,H-5);tx('PER MY',x+W/2,y+10,4.6,'#d9423a','center',900);tx('LAST',x+W/2,y+16,4.6,'#d9423a','center',900);tx('EMAIL',x+W/2,y+22,4.6,'#d9423a','center',900);ln(x+4,y+27,x+W-4,y+27,'#2a2547');tx('reply-all anyway',x+W/2,y+31,2.4,'#5a4a6a','center',700);}
  cx.restore();
}
function wClock(x,y){const r=7;cx.fillStyle='rgba(5,3,16,0.4)';cx.beginPath();cx.arc(x+r+1.5,y+r+1.8,r,0,TAU);cx.fill();cx.fillStyle='#f4f0e2';cx.beginPath();cx.arc(x+r,y+r,r,0,TAU);cx.fill();cx.lineWidth=ow()*1.4;cx.strokeStyle=OUTL;cx.stroke();
  cx.strokeStyle='#2a2547';cx.lineWidth=ow()*0.7;for(let i=0;i<12;i++){const a=i*TAU/12;cx.beginPath();cx.moveTo(x+r+Math.cos(a)*(r-1.5),y+r+Math.sin(a)*(r-1.5));cx.lineTo(x+r+Math.cos(a)*(r-0.5),y+r+Math.sin(a)*(r-0.5));cx.stroke();}
  ln(x+r,y+r,x+r+Math.cos(-1.05+Math.PI*0.0)*0,y+r-4,'#2a2547',ow()*1.2);ln(x+r,y+r,x+r+Math.cos(-1.4)*5,y+r+Math.sin(-1.4)*5,'#d0402c',ow()*0.9);cx.fillStyle='#2a2547';cx.beginPath();cx.arc(x+r,y+r,1,0,TAU);cx.fill();}
function wBoard(x,y,w,h){dsh(x,y,w,h,0.4);rO(x,y,w,h,'#b8854e',ow()*1.2);cx.fillStyle='#d0a46c';cx.fillRect(x+1.6,y+1.6,w-3.2,h-3.2);cx.fillStyle=pr('concrete');cx.fillRect(x+1.6,y+1.6,w-3.2,h-3.2);
  paperQ(x+4,y+4,12,15,'#f6f1e0',-0.05);tx('NO FISH',x+10,y+8.6,2.6,'#d0402c','center',900);tx('IN THE',x+10,y+11.4,2.2,'#2a2547','center',800);tx('MICROWAVE',x+10,y+14.2,2.2,'#2a2547','center',800);tape(x+10,y+4.2,0.1);
  paperQ(x+19,y+5,10,8,'#ffe66a',0.07);ln(x+21,y+8,x+27,y+8,'#8a6a1a',0.5);ln(x+21,y+10.2,x+25,y+10.2,'#8a6a1a',0.5);
  paperQ(x+19,y+15,9,8,'#ff9ec0',-0.06);ln(x+21,y+18,x+26,y+18,'#8a2a4a',0.5);paperQ(x+5,y+22,10,8,'#8ee0f0',0.05);ln(x+7,y+25,x+13,y+25,'#1a5a6a',0.5);
  cx.fillStyle='#d0402c';cx.beginPath();cx.arc(x+10,y+4,1,0,TAU);cx.arc(x+24,y+5,0.9,0,TAU);cx.fill();}
function wVent(x,y,w,h){dsh(x,y,w,h,0.35);rO(x,y,w,h,'#5a6384',ow()*1.1);for(let i=1;i<6;i++){cx.fillStyle='rgba(0,0,0,0.5)';cx.fillRect(x+1.5,y+i*h/6-0.6,w-3,1.1);cx.fillStyle='rgba(255,255,255,0.18)';cx.fillRect(x+1.5,y+i*h/6+0.5,w-3,0.5);}cx.fillStyle=pr('metal');cx.fillRect(x,y,w,h);}
function wSocket(x,y){dsh(x,y,6,8,0.3);rO(x,y,6,8,'#e4dcc8',ow());cx.fillStyle='#2a2547';cx.fillRect(x+1.3,y+1.6,1,1.6);cx.fillRect(x+3.7,y+1.6,1,1.6);cx.fillRect(x+1.3,y+5,1,1.6);cx.fillRect(x+3.7,y+5,1,1.6);cx.fillStyle=pr('plaster');cx.fillRect(x,y,6,8);}

function vesselFx(v){ /* glaze / ribbed plastic shading drawn inside the glass outline */

function rivets(v){const r=v.r,gx=v.gx,gy=v.gy;cx.fillStyle='#e6ecfa';cx.strokeStyle=OUTL;cx.lineWidth=1.2;

function vesselPath(k,gx,gy,r){

function heart(x,y,s){cx.beginPath();cx.moveTo(x,y+s*0.9);cx.bezierCurveTo(x-s*1.5,y-s*0.1,x-s*0.9,y-s*1.1,x,y-s*0.4);cx.bezierCurveTo(x+s*0.9,y-s*1.1,x+s*1.5,y-s*0.1,x,y+s*0.9);cx.closePath();}

function vesselFront(v){

function hudDyn(t){
