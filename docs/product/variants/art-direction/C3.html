</head><body>
<canvas id="c" role="img" aria-label="Style tile of an isometric dungeon office level with a hero, three monsters, loot and the bottom HUD"></canvas>
<noscript>This style tile needs JavaScript and canvas.</noscript>
<script>
'use strict';
/* ===== shared scene: same content in every variant; each variant supplies STYLE, MATS and G (the renderer) ===== */
const QS=new URLSearchParams(location.search);
/* C3 switches: ?scene=office|basement|boardroom  ?frame=N  ?compare=1 (C2 | C3 wipe)  ?legacy=1 (every round-3 addition off = the frozen C2 look; used by compare) */
const CMP=QS.has('compare'),V3=!QS.has('legacy');
const SCENE=QS.get('scene')==='basement'||QS.get('scene')==='boardroom'?QS.get('scene'):'office';
const FRAME=QS.has('frame')?Math.max(0,parseInt(QS.get('frame'),10)||0):null;
const T0=performance.now();
const TAU=Math.PI*2;
function getT(){return FRAME!==null?FRAME/60:(performance.now()-T0)/1000;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,t){return a+(b-a)*t;}
function sstep(a,b,x){const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);}
function hash(n){n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n);}
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255];}
function rgb2hex(r,g,b){return'#'+((1<<24)+(clamp(Math.round(r),0,255)<<16)+(clamp(Math.round(g),0,255)<<8)+clamp(Math.round(b),0,255)).toString(16).slice(1);}
function mixc(a,b,t){const x=hex2rgb(a),y=hex2rgb(b);return rgb2hex(lerp(x[0],y[0],t),lerp(x[1],y[1],t),lerp(x[2],y[2],t));}

/* ---------- projection (2:1 diamond; design tile = 64x32) ---------- */
let Z=1,OX=0,OY=0,PX=0,PY=0;
function P(x,y,z){PX=OX+(x-y)*32*Z;PY=OY+(x+y)*16*Z-(z||0)*Z;}
const N=12;
const HERO={x:5.8,y:5.9},ZOM={x:7.2,y:6.2},DEM={x:2.4,y:6.4},MGR={x:9.4,y:3.2};
const LOOT=[
 {x:6.0,y:9.6,ri:0,name:'Sturdy Lanyard of Focus',lh:56},
 {x:10.4,y:7.0,ri:1,name:'Ergonomic Chair of Haste',lh:66},
 {x:2.1,y:1.7,ri:2,name:'The Corner Office Keycard',lh:56}];
const FIX={x:6.6,y:2.2,z:118};
const MONL={x:0.62,y:1.9,z:38},MONR={x:8.4,y:0.57,z:38},COOL={x:10.7,y:1.0,z:34};

/* ---------- animation state: a pure function of t ---------- */
const ST={t:0,c:0,a:0,hit:-1,flk:1,flk2:1,th:0};
function computeState(t){
  ST.t=t;const c=t%2;ST.c=c;let a=0;
  if(c>=1.0&&c<1.3)a=-0.6*sstep(1.0,1.3,c);
  else if(c>=1.3&&c<1.42){const k=(c-1.3)/0.12;a=lerp(-0.6,1,k*k);}
  else if(c>=1.42&&c<1.55)a=1;
  else if(c>=1.55&&c<1.95)a=1-sstep(1.55,1.95,c);
  ST.a=a;
  const u=(c-1.42+2)%2;ST.hit=u<1.0?u:-1;
  /* fluorescent flicker: buzz bursts every ~4.3 s plus random dips */
  const k=Math.floor(t*26),b=(t%4.3)/4.3;let v=1;
  if(hash(k*3.7)>0.955)v=0.3+hash(k)*0.4;
  if(b>0.86&&b<0.95&&hash(k*1.9+4)>0.35)v=0.15+hash(k*2.3)*0.5;
  ST.flk=clamp(v+Math.sin(t*50)*0.025,0,1);
  ST.flk2=0.9+Math.sin(t*9.3)*0.04+Math.sin(t*23.1)*0.04+(hash(Math.floor(t*14))-0.5)*0.12; /* candle/monitor shimmer */
}
let FLASH=0;

/* ---------- iso primitives built on the style's G ---------- */
function box(x0,y0,x1,y1,z0,z1,mt,ms){
  ms=ms||mt;
  P(x0,y0,z1);const ax=PX,ay=PY;P(x1,y0,z1);const bx=PX,by=PY;P(x1,y1,z1);const qx=PX,qy=PY;P(x0,y1,z1);const dx=PX,dy=PY;
  P(x0,y1,z0);const ex=PX,ey=PY;P(x1,y1,z0);const fx=PX,fy=PY;P(x1,y0,z0);const gx=PX,gy=PY;
  G.poly([dx,dy,qx,qy,fx,fy,ex,ey],ms,1);
  G.poly([bx,by,qx,qy,fx,fy,gx,gy],ms,2);
  G.poly([ax,ay,bx,by,qx,qy,dx,dy],mt,0);
}
function faceX(x,y0,y1,z0,z1,m,sh){P(x,y0,z1);const a=PX,b=PY;P(x,y1,z1);const c=PX,d=PY;P(x,y1,z0);const e=PX,f=PY;P(x,y0,z0);G.poly([a,b,c,d,e,f,PX,PY],m,sh||0);}
function faceY(y,x0,x1,z0,z1,m,sh){P(x0,y,z1);const a=PX,b=PY;P(x1,y,z1);const c=PX,d=PY;P(x1,y,z0);const e=PX,f=PY;P(x0,y,z0);G.poly([a,b,c,d,e,f,PX,PY],m,sh||0);}
function flat(pts,z,m,sh){const o=[];for(let i=0;i<pts.length;i+=2){P(pts[i],pts[i+1],z);o.push(PX,PY);}G.poly(o,m,sh||0);}
function cyl(x,y,z0,z1,r,mt,ms){
  ms=ms||mt;P(x,y,z0);const bx=PX,by=PY;P(x,y,z1);const tx=PX,ty=PY;
  const rx=r*45.25*Z,ry=r*22.6*Z;
  G.ell(bx,by,rx,ry,ms,1,0);
  G.poly([bx-rx,by,bx-rx,ty,bx+rx,ty,bx+rx,by],ms,1);
  G.ell(bx,by,rx,ry,ms,1,0);G.ell(tx,ty,rx,ry,mt,0,0);
}
function wline(pts,z,w,m,al){const o=[];for(let i=0;i<pts.length;i+=2){P(pts[i],pts[i+1],z);o.push(PX,PY);}G.line(o,w*Z,m,al);}

/* ---------- character transform helpers (local design px, y up is negative) ---------- */
let XO=0,YO=0,XS=1,XC=1,XN=0,XF=1,XR=0,LX=0,LY=0;
function setXf(ox,oy,s,rot,fl){XO=ox;YO=oy;XS=s;XC=Math.cos(rot);XN=Math.sin(rot);XF=fl;XR=rot;}
function tf(x,y){x*=XF;LX=XO+(x*XC-y*XN)*XS;LY=YO+(x*XN+y*XC)*XS;}
function cEll(x,y,rx,ry,m,sh,rot){tf(x,y);G.ell(LX,LY,rx*XS,ry*XS,m,sh||0,(rot||0)*XF+XR);}
function cPly(a,m,sh){const o=new Array(a.length);for(let i=0;i<a.length;i+=2){tf(a[i],a[i+1]);o[i]=LX;o[i+1]=LY;}G.poly(o,m,sh||0);}
function cLmb(x1,y1,x2,y2,w,m,sh){tf(x1,y1);const ax=LX,ay=LY;tf(x2,y2);G.limb(ax,ay,LX,LY,w*XS,m,sh||0);}
function cLine(a,w,m,al){const o=new Array(a.length);for(let i=0;i<a.length;i+=2){tf(a[i],a[i+1]);o[i]=LX;o[i+1]=LY;}G.line(o,w*XS,m,al);}
function cRect(x,y,w,h,m,sh){cPly([x,y,x+w,y,x+w,y+h,x,y+h],m,sh);}
function cDir(x,y,ang,d,w,tail){ /* rect-ish helper: point at distance d along ang, offset w perpendicular */
  const ca=Math.cos(ang),sa=Math.sin(ang);return[x+ca*d-sa*w,y+sa*d+ca*w];}

function wallPanel(i,j){
  if(j===0)faceY(0.22,i+0.06,i+0.94,5,35,'wallPanel',1);else faceX(0.22,j+0.06,j+0.94,5,35,'wallPanel',2);
  if(G.wallDeco)G.wallDeco(i,j);
}
/* ---------- static layer: floor, walls, furniture ---------- */
const SCR=[];/* monitor screen quads, filled by paintStatic */
function paintStatic(){
  SCR.length=0;
  /* slab edge so the level reads as a cut-away slice */
  box(0,0,N,N,-12,0,'slab','slab');
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){
    P(i,j,0);const ax=PX,ay=PY;P(i+1,j,0);const bx=PX,by=PY;P(i+1,j+1,0);const cx=PX,cy=PY;P(i,j+1,0);
    const pts=[ax,ay,bx,by,cx,cy,PX,PY];
    G.poly(pts,((i+j)&1)?'carpetA':'carpetB',0);
    if(G.tileDeco)G.tileDeco(i,j,pts);
  }
  /* decals on the floor */
  const st=[[3.2,3.1,34,17],[8.4,5.2,26,13],[6.3,8.2,40,19],[1.6,6.1,30,14],[9.7,3.7,24,11],[4.4,10.3,36,16],[2.6,9.1,22,10]];
  for(let i=0;i<st.length;i++){P(st[i][0],st[i][1],0);G.decal(PX,PY,st[i][2]*Z,st[i][3]*Z,i%3===1?'coffee':'stain',0.55);}
  P(10.2,2.4,0);G.decal(PX,PY,38*Z,18*Z,'puddle',0.8);
  const bd=[[7.0,7.4,30,13],[7.6,7.0,14,6],[3.4,7.2,26,11],[1.9,5.0,22,10],[8.9,2.2,18,8]];
  for(let i=0;i<bd.length;i++){P(bd[i][0],bd[i][1],0);G.decal(PX,PY,bd[i][2]*Z,bd[i][3]*Z,'blood',0.8);}
  for(let k=0;k<7;k++){P(3.6+k*0.28,6.9-k*0.2,0);G.decal(PX,PY,(7-k*0.6)*Z,(3.2-k*0.2)*Z,'blood',0.8);}
  /* cables */
  wline([1.3,2.3,2.0,3.0,2.8,3.3,3.6,3.2,4.3,4.1,5.0,4.9,5.6,5.5],0.3,3.2,'cable');
  wline([8.2,1.3,8.5,2.0,9.2,2.5,9.8,3.4,10.6,3.9,11.4,4.0],0.3,3.0,'cable');
  wline([0.9,3.0,0.7,4.2,1.4,5.0,1.2,6.0,0.6,6.8],0.3,2.6,'cable');
  wline([7.5,1.2,7.0,1.9,6.2,2.2,5.6,2.9],0.3,2.2,'cable');
  /* scattered paper */
  for(let i=0;i<22;i++){
    const r1=hash(i*5.1),r2=hash(i*9.7+2),rot=hash(i*3.3)*TAU;
    let x,y;
    if(i<8){x=2+r1*4.2;y=3.6+r2*3.4;}else{x=0.8+r1*10;y=0.8+r2*10;}
    const cr=Math.cos(rot),sr=Math.sin(rot),w=0.26+hash(i)*0.1,h=0.34+hash(i+9)*0.1;
    const q=[-w,-h,w,-h,w,h,-w,h],o=[];
    for(let k=0;k<8;k+=2)o.push(x+q[k]*cr-q[k+1]*sr,y+q[k]*sr+q[k+1]*cr);
    flat(o,0.2,'paper',i&1);
    if(i%3===0){const m=[-w*.6,-h*.3,w*.6,-h*.3],m2=[-w*.6,h*.1,w*.4,h*.1];
      wline([x+m[0]*cr-m[1]*sr,y+m[0]*sr+m[1]*cr,x+m[2]*cr-m[3]*sr,y+m[2]*sr+m[3]*cr],0.25,1.1,'ink',0.6);
      wline([x+m2[0]*cr-m2[1]*sr,y+m2[0]*sr+m2[1]*cr,x+m2[2]*cr-m2[3]*sr,y+m2[2]*sr+m2[3]*cr],0.25,1.1,'ink',0.6);}
  }
  /* depth-sorted objects */
  const L=[];
  const add=(d,f)=>L.push({d:d,f:f});
  /* back walls with a collapsed segment and a doorway */
  for(let i=0;i<N;i++){
    if(i===4){add(i+0.4,()=>{box(i,0,i+1,0.22,0,15,'wallFab');box(i+0.1,0,i+0.7,0.22,15,22,'wallFab');box(i+0.5,0.05,i+0.75,0.3,0,6,'trim');});continue;}
    add(i+0.4,()=>{box(i,0,i+1,0.22,0,40,'wallFab');box(i,0,i+1,0.24,40,44,'trim');wallPanel(i,0);});
  }
  for(let j=1;j<N;j++){
    if(j===7||j===8)continue;
    add(j+0.4,()=>{box(0,j,0.22,j+1,0,40,'wallFab');box(0,j,0.24,j+1,40,44,'trim');wallPanel(0,j);});
  }
  add(0.3,()=>{box(0,0,0.3,0.3,0,48,'post');});
  add(5.9,()=>{box(0,5.2,0.36,5.8,34,42,'lampR','lampR');});
  add(7.2,()=>{box(0,7,0.3,7.3,0,46,'post');});
  add(9.2,()=>{box(0,9,0.3,9.3,0,46,'post');});
  /* left cubicle: partition, desk, monitor, chair */
  for(let k=0;k<3;k++)add(2+k*1.0+1.9,()=>{const x0=0.22+k*1.0,x1=x0+(k===2?0.98:1);box(x0,3.85,x1,4.05,0,34,'wallFab');box(x0,3.84,x1,4.06,34,37,'trim');});
  add(2.4,()=>{
    box(0.25,0.9,1.4,3.0,19,23,'woodTop','wood');box(0.3,2.2,1.35,2.98,0,19,'wood');box(0.3,0.95,0.42,1.4,0,19,'wood');
    box(0.7,1.9,0.95,2.15,23,26,'plastic');
    box(0.55,1.45,0.67,2.35,26,47,'plastic');
    const zz=[29,44];faceX(0.67,1.52,2.28,zz[0],zz[1],'screen',0);
    SCR.push({x:0.67,y0:1.52,y1:2.28,z0:29,z1:44,ax:'x'});
    box(0.85,1.55,1.3,2.0,23,24,'plastic');
    cyl(1.1,2.7,23,29,0.1,'mug');
    box(0.5,1.15,0.9,1.45,23,27,'paperPile');
  });
  add(4.2,()=>{ /* chair */
    cyl(2.0,2.4,0,9,0.07,'metal');
    wline([2.0,2.4,1.6,2.1,2.0,2.4,2.4,2.1,2.0,2.4,2.0,2.8,2.0,2.4,1.7,2.8,2.0,2.4,2.35,2.75],0.5,2.2,'metal');
    box(1.65,2.05,2.3,2.75,10,15,'chair','chair');
    box(2.22,2.05,2.4,2.75,15,40,'chair','chair');
  });
  /* right cubicle */
  for(let k=0;k<3;k++)add(7.6+k,()=>{const y0=0.22+k*0.9;box(6.85,y0,7.05,y0+0.9,0,34,'wallFab');box(6.84,y0,7.06,y0+0.9,34,37,'trim');});
  add(9.3,()=>{
    box(7.2,0.25,10.0,1.25,19,23,'woodTop','wood');box(9.1,0.3,9.95,1.2,0,19,'wood');box(7.25,0.3,7.45,1.2,0,19,'wood');
    box(7.7,0.6,8.4,0.85,23,26,'plastic');
    box(8.0,0.45,8.8,0.57,26,47,'plastic');
    faceY(0.57,8.07,8.73,29,44,'screen',0);
    SCR.push({y:0.57,x0:8.07,x1:8.73,z0:29,z1:44,ax:'y'});
    box(8.2,0.8,8.9,1.1,23,24,'plastic');
    box(9.3,0.5,9.6,0.9,23,25,'paperPile');
  });
  /* water cooler */
  add(11.8,()=>{
    box(10.45,0.75,10.95,1.25,0,24,'coolerBody');
    box(10.6,1.0,10.8,1.26,10,14,'metal');
    cyl(10.7,1.0,24,50,0.2,'jug');
    G.jugWater(10.7,1.0);
  });
  /* filing cabinet, fallen panel, extra desk junk */
  add(13.2,()=>{box(10.5,1.9,11.3,2.6,0,46,'metal');box(10.52,1.95,11.28,2.0,30,31,'plastic');faceX(11.3,1.95,2.55,31,45,'wood',2);});
  add(7.2,()=>{box(2.0,5.0,4.2,5.25,0,3,'wallFab','trim');});
  /* hanging fluorescent fixture (ceiling) */
  add(8.4,()=>{
    wline([FIX.x-0.5,FIX.y,FIX.x-0.5,FIX.y],0,1,'metal',0);
    P(FIX.x-0.35,FIX.y,FIX.z+34);const a=PX,b=PY;P(FIX.x-0.35,FIX.y,FIX.z);G.line([a,b,PX,PY],1.4*Z,'metal');
    P(FIX.x+0.35,FIX.y,FIX.z+34);const c=PX,d=PY;P(FIX.x+0.35,FIX.y,FIX.z);G.line([c,d,PX,PY],1.4*Z,'metal');
    box(FIX.x-0.9,FIX.y-0.28,FIX.x+0.9,FIX.y+0.28,FIX.z,FIX.z+5,'plastic','metal');
  });
  L.sort((p,q)=>p.d-q.d);
  for(let i=0;i<L.length;i++)L[i].f();
}

/* ---------- dynamic entities ---------- */
function shadowAt(x,y,r){P(x,y,0);G.shadow(PX,PY,r*Z,r*0.46*Z,0.5);}
function drawScreens(t){
  const f=ST.flk2;
  for(let i=0;i<SCR.length;i++){
    const s=SCR[i];let q;
    if(s.ax==='x'){P(s.x,s.y0,s.z1);q=[PX,PY];P(s.x,s.y1,s.z1);q.push(PX,PY);P(s.x,s.y1,s.z0);q.push(PX,PY);P(s.x,s.y0,s.z0);q.push(PX,PY);}
    else{P(s.x0,s.y,s.z1);q=[PX,PY];P(s.x1,s.y,s.z1);q.push(PX,PY);P(s.x1,s.y,s.z0);q.push(PX,PY);P(s.x0,s.y,s.z0);q.push(PX,PY);}
    G.screen(q,f,i,t);
  }
}
function swingAngle(){const a=ST.a;return(a<0?-62+a*125:-62+a*87)*Math.PI/180;}
function drawHero(t){
  const H=STYLE.head,a=ST.a,cs=STYLE.cs*1.1;
  P(HERO.x,HERO.y,0);
  setXf(PX,PY,Z*cs,0,1);
  G.shadow(PX,PY,18*Z*cs,8*Z*cs,0.55);
  const br=Math.sin(t*TAU/2.4),bob=br*1.3,lun=a>0?a*6:a*3,tx=lun*0.6;
  cLmb(-5,-28,-9,-2,8,'pants',1);cEll(-10,-1,7,3.3,'shoe',1);
  cLmb(-7+tx,-56+bob,-13+tx*0.4,-40+bob,6,'shirt',1);cEll(-13+tx*0.4,-38+bob,3.3,3.3,'skin',1);
  cLmb(4,-28,8+a*3,-2,8,'pants',0);cEll(12+a*3,-1,7.5,3.4,'shoe',0);
  cPly([-9.5+tx,-60+bob,9.5+tx,-60+bob,8.5+tx*0.3,-27,-8.5+tx*0.3,-27],'shirt',0);
  cPly([-9.5+tx,-60+bob,-3.5+tx,-60+bob,-3.2+tx*0.3,-27,-8.5+tx*0.3,-27],'suit',1);
  cPly([3.5+tx,-60+bob,9.5+tx,-60+bob,8.5+tx*0.3,-27,3.2+tx*0.3,-27],'suit',2);
  cRect(-8.5+tx*0.3,-30,17,3,'pants',2);
  cPly([tx,-59+bob,3+tx,-56.5+bob,2.4+tx*0.7,-40,tx*0.6,-34,-2.4+tx*0.6,-40,-3+tx,-56.5+bob],'tie',0);
  cPly([-2.2+tx,-60.5+bob,2.2+tx,-60.5+bob,1.6+tx,-56.6+bob,-1.6+tx,-56.6+bob],'tie',2);
  cLine([-4+tx,-60+bob,-3+tx*0.8,-46+bob],1.1,'cord');cRect(-6+tx*0.8,-47+bob,5,6.5,'badge',0);

  const u=ST.hit;if(u<0||u>0.95)return;
  P(ZOM.x,ZOM.y,0);const ix=PX+2*Z,iy=PY-44*Z;
  if(u<0.18)G.part('flash',ix,iy,0,(30-u*100)*Z,1-u/0.18,null);
  for(let i=0;i<16;i++){
    const an=hash(i*3.1)*TAU,sp=40+hash(i*1.7+3)*95,g=170;
    const px=ix+Math.cos(an)*sp*u*Z*1.0,py=iy+(Math.sin(an)*sp*u*0.8-30*u+g*u*u*0.9)*Z;
    const al=clamp(1-u/(0.55+hash(i)*0.3),0,1);if(al<=0)continue;
    if(i<10)G.part('spark',px,py,Math.atan2(Math.sin(an)*sp*0.8-30+g*2*u,Math.cos(an)*sp),(2+hash(i+4)*2)*Z,al,STYLE.sparkMat);
    else G.part('bit',px,py,u*(6+i)+i,(3+hash(i)*2)*Z,al,null);
  }
  const rise=1-Math.pow(1-clamp(u/0.7,0,1),3),pop=1+0.9*Math.max(0,1-u/0.14);
  G.dmg('63',ix+(26+rise*14)*Z,iy-(14+rise*72)*Z,pop*Z,clamp(1-(u-0.55)/0.4,0,1));
}

/* ---------- main render ---------- */
const ENT=[];
const RING={hero:'#e6fbff',zom:'#a6e65a',dem:'#ff5a46',mgr:'#ffb040'};
function actor(f,ring,dim){return{d:0,f:f,ring:ring,dim:dim};}
function render(t){
  computeState(t);
  G.begin(t);
  G.blitStatic();
  dynLights();
  drawScreens(t);
  ENT.length=0;
  const A=[[HERO.x+HERO.y,actor(drawHero,RING.hero,0)],[ZOM.x+ZOM.y,actor(drawZombie,RING.zom,0)],[DEM.x+DEM.y,actor(drawDemon,RING.dem,1)],[MGR.x+MGR.y,actor(drawManager,RING.mgr,1)]];
  for(let i=0;i<A.length;i++){A[i][1].d=A[i][0];ENT.push(A[i][1]);}
  for(let i=0;i<3;i++){const L=LOOT[i];ENT.push({d:L.x+L.y,f:(tt)=>lootProp(L,tt),ring:null,dim:0});}
  ENT.sort((a,b)=>a.d-b.d);
  for(let i=0;i<ENT.length;i++){const e=ENT[i];
    if(e.ring){SIL=e.ring;e.f(t);SIL=null;}
    DIM=e.dim;e.f(t);DIM=0;}
  for(let i=0;i<3;i++)drawLootGroundFx(LOOT[i],t);
  G.postGlow(t);
  monsterPlates(t);
  drawHitFx(t);
  drawLootLabels(t);
  G.hud(t);
  G.end();
}
function boot(){
  G.init();
  render(getT());
  window.__ready=true;
  if(FRAME===null){const loop=()=>{render(getT());requestAnimationFrame(loop);};requestAnimationFrame(loop);}
  else addEventListener('resize',()=>render(getT()));
}
