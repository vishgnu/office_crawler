<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventory Panel Side Drawer</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{--ol:#0d0a1c;--panel:#241d4e;--panel2:#1e1845;--panel3:#17123a;--rim:#5d4fa8;--txt:#f3eefc;--mut:#b4abe0;--gold:#ffe27a;--wood:#b06f3c;--woodD:#8a5230;--paper:#ece4cf;--ink:#2a2547;--inkm:#5a4f82;--red:#8e1f2b;--ok:#4fd1a5;--bad:#ff8f80;--focus:#ffd43b;--cw:44px;
--c-normal:#e6e0ff;--c-magic:#7cc8f4;--c-rare:#f0e442;--c-unique:#ff9a5c}
html,body{margin:0;height:100%;background:#0b0a1a;color:var(--txt);font:15px/1.35 'Trebuchet MS','Segoe UI',system-ui,'Helvetica Neue','Liberation Sans',Arial,sans-serif;overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block}
#dim{position:fixed;inset:0;background:rgba(8,6,22,.62);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
body.anyopen #dim{opacity:1}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;box-shadow:0 0 0 5px var(--ol)}
.sheet :focus-visible{box-shadow:0 0 0 5px #fff}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
kbd{font:800 12px/1 inherit;background:var(--ol);color:#fff;border:1px solid #cfc2ff;border-radius:5px;padding:2px 5px;margin-left:4px}
.mk{display:inline-block;vertical-align:-2px;flex:none}

/* panels */
.panel{position:fixed;background:var(--panel);border:4px solid var(--ol);border-radius:16px;box-shadow:inset 0 0 0 2px var(--rim),0 12px 40px rgba(0,0,0,.5);z-index:20;display:flex;flex-direction:column;overflow:hidden;visibility:hidden;opacity:0;transition:opacity .15s,transform .15s,visibility 0s .15s}
.panel.open{visibility:visible;opacity:1;transition-delay:0s}
.ph{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 16px;border-bottom:3px solid var(--ol);background:var(--panel2);flex:none}
.ph h2{margin:0;font-size:19px;font-weight:800;letter-spacing:.02em}
.ph .sub{color:var(--mut);font-size:14px}
.xbtn{margin-left:auto;width:36px;height:36px;border-radius:8px;border:3px solid var(--ol);background:#3a2f78;font:900 18px/1 inherit;color:#fff;padding:0}
.xbtn:hover{background:#4a3b94}
.pb{overflow:auto;flex:1;min-height:0}

/* inventory */
.inv{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.dollrow{display:flex;gap:16px;align-items:flex-start}
.doll{display:grid;grid-template-columns:repeat(7,var(--cw));grid-template-rows:repeat(6,var(--cw));flex:none}
.slot{position:relative;margin:2px;background:var(--panel2);border:2px solid var(--ol);border-radius:8px;box-shadow:inset 0 0 0 1px var(--rim);padding:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--mut);text-align:center;line-height:1.1;touch-action:none}
.slot span.lb{pointer-events:none;padding:2px}
.slot.ok,.bslot.ok{outline:3px solid #fff;outline-offset:-1px}
.slot.bad,.bslot.bad{outline:3px dashed var(--bad);outline-offset:-1px;background:repeating-linear-gradient(45deg,rgba(255,143,128,.3) 0 6px,transparent 6px 12px),var(--panel2)}
.side{display:flex;flex-direction:column;gap:10px;min-width:0;flex:1}
.legend{list-style:none;margin:0;padding:8px 10px;background:var(--panel3);border:2px solid var(--ol);border-radius:8px;font-size:13px;display:grid;gap:5px}
.legend h4,.keys h4{margin:0 0 2px;font-size:13px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.legend li{display:flex;align-items:center;gap:8px}
.swatch{width:22px;height:16px;border-radius:4px;background:#322a6c;flex:none}
.swatch.r-normal{border:1px solid #8f88c0}.swatch.r-magic{border:2px solid #56b4e9}.swatch.r-rare{border:4px double #f0e442}.swatch.r-unique{border:2px dashed #e8590c}
.l-normal{color:var(--c-normal)}.l-magic{color:var(--c-magic)}.l-rare{color:var(--c-rare)}.l-unique{color:var(--c-unique)}
.keys{font-size:13px;color:var(--mut);padding:8px 10px;background:var(--panel3);border:2px solid var(--ol);border-radius:8px}
.keys p{margin:2px 0}
.gridwrap{border:3px solid var(--ol);border-radius:8px;background:var(--panel3);align-self:flex-start;padding:3px;box-shadow:inset 0 0 0 1px var(--rim)}
.gi{position:relative;width:calc(var(--cw)*10);height:calc(var(--cw)*4)}
.grid{display:grid;grid-template-columns:repeat(10,var(--cw));grid-template-rows:repeat(4,var(--cw))}
.cell{width:var(--cw);height:var(--cw);border:1px solid #3a3070;background:transparent;padding:0;border-radius:0;touch-action:none}
.cell:hover{background:rgba(255,255,255,.06)}
.items{position:absolute;inset:0;pointer-events:none}
.item{display:block;position:absolute;pointer-events:none;border-radius:6px;background:linear-gradient(160deg,#352d72,#241d4e);padding:3px;overflow:hidden;left:calc(var(--cw)*var(--x));top:calc(var(--cw)*var(--y));width:calc(var(--cw)*var(--w));height:calc(var(--cw)*var(--h))}
.item.fill{inset:2px;left:2px;top:2px;width:auto;height:auto}
.item .ic{width:100%;height:100%;display:block}
.r-normal.item{border:1px solid #8f88c0}
.r-magic.item{border:2px solid #56b4e9;box-shadow:inset 0 0 8px rgba(86,180,233,.4)}
.r-rare.item{border:4px double #f0e442;padding:1px;box-shadow:inset 0 0 8px rgba(240,228,66,.3)}
.r-unique.item{border:2px dashed #e8590c;background:linear-gradient(160deg,#6b2a12,#2a1630);box-shadow:inset 0 0 10px rgba(255,122,46,.55)}
.item .rm{position:absolute;left:2px;top:2px;background:var(--ol);border-radius:4px;padding:1px;display:flex;line-height:0}
.r-normal .rm{color:#c9c2ee}.r-magic .rm{color:#56b4e9}.r-rare .rm{color:#f0e442}.r-unique .rm{color:#ff8a4a}
.item .warn{position:absolute;right:2px;bottom:2px;width:16px;height:16px;border-radius:50%;background:var(--bad);color:var(--ol);font:900 12px/16px inherit;text-align:center}
.item.kf{outline:3px solid var(--focus);outline-offset:1px;z-index:2}
.pv{position:absolute;pointer-events:none;border:3px solid #fff;border-radius:6px;background:rgba(255,255,255,.2);z-index:3;left:calc(var(--cw)*var(--x));top:calc(var(--cw)*var(--y));width:calc(var(--cw)*var(--w));height:calc(var(--cw)*var(--h))}
.pv.bad{border-style:dashed;border-color:var(--bad);background:repeating-linear-gradient(45deg,rgba(255,143,128,.35) 0 6px,transparent 6px 12px)}
.footrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.gold{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800;color:var(--gold);background:var(--panel3);border:2px solid var(--ol);border-radius:8px;padding:4px 12px}
.notice{flex:1;min-width:140px;font-size:14px;color:var(--txt);min-height:20px}
.ghost{position:fixed;pointer-events:none;z-index:100;opacity:.92;filter:drop-shadow(0 6px 6px rgba(0,0,0,.6))}
.ghost .item{position:relative;left:0;top:0;width:100%;height:100%}

/* employee file (paper sheet) */
.sheet{background:var(--paper) repeating-linear-gradient(transparent 0 27px,rgba(90,79,130,.13) 27px 28px);color:var(--ink);margin:12px;border:3px solid var(--ol);border-radius:10px;padding:14px 16px;position:relative;box-shadow:inset 0 0 0 2px #cfc3a2}
.fh{display:flex;gap:14px;align-items:center}
.photo{width:62px;height:74px;border:3px solid var(--ol);background:#9ad1e0;border-radius:6px;flex:none;overflow:hidden}
.fh h2{margin:0;font-size:22px;color:var(--ink)}
.fh p{margin:0;color:var(--inkm);font-size:14px}
.stamp{margin-left:auto;transform:rotate(-8deg);border:3px solid var(--red);color:var(--red);font-weight:900;letter-spacing:.12em;padding:2px 8px;border-radius:4px;font-size:14px;flex:none}
.sheet h3{margin:10px 0 4px;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--red);border-bottom:2px solid var(--red);display:flex;justify-content:space-between;align-items:baseline}
.sheet h3 em{font-style:normal;letter-spacing:0;text-transform:none;color:var(--ink);font-size:14px}
.xpl{display:flex;justify-content:space-between;font-size:14px;margin-top:10px}
.xpb2{height:16px;border:3px solid var(--ol);border-radius:8px;background:#cfc3a2;overflow:hidden;margin-top:3px}
.xpb2 i{display:block;height:100%;background:repeating-linear-gradient(90deg,#d99a00 0 14px,#b57d00 14px 16px)}
.attr{display:grid;grid-template-columns:1fr auto 40px;align-items:center;gap:10px;padding:3px 0;border-bottom:1px dashed #b9ad8c}
.attr .an b{font-size:16px}.attr .an small{display:inline;margin-left:8px;color:var(--inkm);font-size:13px}
.attr .av{font-size:20px;font-weight:800;text-align:right}
.attr .av small{font-size:13px;color:var(--inkm);font-weight:600}
button.plus{width:36px;height:36px;border-radius:8px;border:3px solid var(--ol);background:#4a3b94;color:var(--gold);font:900 22px/1 inherit;padding:0}
button.plus:disabled{background:#cfc6a8;color:#5f5842;border-color:#7d755c;cursor:not-allowed}
.apv{font-size:14px;min-height:40px;margin:6px 0 0;padding:4px 8px;background:#e0d6b8;border-radius:6px;border:1px solid #b9ad8c}
.dstats{display:grid;grid-template-columns:1fr 1fr;gap:2px 22px}
.d{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dotted #b9ad8c;font-size:15px}
.d b{font-weight:800}
.blocked{margin:0;padding:0;list-style:none;font-size:14px}
.blocked li{display:flex;gap:6px;align-items:center;padding:2px 0}
.kit{margin:0;padding:0;list-style:none;font-size:14px}
.kit li{display:flex;gap:6px;align-items:center;padding:2px 0;border-bottom:1px dotted #b9ad8c}
.kit .sl{color:var(--inkm);min-width:66px}
.sheet .l-normal{color:#2a2547}.sheet .l-magic{color:#0a5c8f}.sheet .l-rare{color:#6b5d00}.sheet .l-unique{color:#a83a00}
.sheet .mk{color:inherit}

/* tooltip */
.tip{position:fixed;z-index:200;pointer-events:none;width:292px;background:var(--panel3);border:3px solid var(--ol);border-radius:10px;box-shadow:inset 0 0 0 2px var(--rim),0 10px 30px rgba(0,0,0,.6);padding:10px 12px;font-size:14px}
.tip.r-magic{box-shadow:inset 0 0 0 2px #56b4e9,0 10px 30px rgba(0,0,0,.6)}
.tip.r-rare{box-shadow:inset 0 0 0 2px #f0e442,0 10px 30px rgba(0,0,0,.6)}
.tip.r-unique{box-shadow:inset 0 0 0 2px #e8590c,0 10px 30px rgba(0,0,0,.6)}
.tip .tn{font-size:17px;font-weight:800;display:flex;gap:6px;align-items:center;line-height:1.2}
.tip .tk{color:var(--mut);font-size:13px;margin-bottom:6px}
.tip .tb{font-size:16px;font-weight:800;margin:2px 0}
.tip .ta{margin:1px 0}
.tip .tr{margin-top:6px;display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px}
.tip .tr .no{color:var(--bad);font-weight:800}.tip .tr .yes{color:var(--ok)}
.tip .tf{font-style:italic;color:var(--mut);margin-top:6px;font-family:Georgia,'Times New Roman',serif}
.tip .tv{color:var(--gold);margin-top:6px;font-size:13px}
.tip .cmp{margin-top:8px;padding-top:8px;border-top:2px dashed var(--rim)}
.tip .cmp h4{margin:0 0 3px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.tip .cn{display:flex;gap:6px;align-items:center;margin-bottom:3px;font-size:13px}
.tip .df{display:flex;gap:6px;align-items:center;margin:1px 0}
.tip .df.up{color:var(--ok)}.tip .df.dn{color:var(--bad)}
.tip .vd{margin-top:4px;font-weight:800}
.ar{width:12px;height:12px;flex:none;fill:currentColor}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:15}
#hud>*{pointer-events:auto}
.vess{position:absolute;bottom:10px;width:96px;height:112px}
.vess.mug{left:16px}.vess.jug{right:16px;width:92px;height:122px}
.vess svg{width:100%;height:100%;display:block}
.vess .vt{position:absolute;left:0;right:0;bottom:4px;text-align:center;font:800 15px/1 inherit;color:#fff;text-shadow:-1px -1px 0 var(--ol),1px -1px 0 var(--ol),-1px 1px 0 var(--ol),1px 1px 0 var(--ol),0 2px 0 var(--ol)}
.vess.mug .vt{right:24px}
.hbar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:10px;align-items:flex-end}
.hbox{background:#241d4e;border:3px solid var(--ol);border-radius:12px;box-shadow:inset 0 0 0 2px var(--rim);padding:6px 8px}
.hbox .lvl{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:var(--gold);gap:10px}
.hbox .lvl span{color:#d9d0ff}
.xpb{height:8px;border:2px solid var(--ol);background:#120e29;border-radius:5px;overflow:hidden;margin:3px 0 6px}
.xpb i{display:block;height:100%;background:#ffc83a;width:45%}
.hrow{display:flex;gap:6px}
.sk,.bslot{position:relative;width:46px;height:46px;border-radius:9px;background:#1e1845;border:3px solid var(--ol);box-shadow:inset 0 0 0 2px #7a6cd0;padding:0;display:flex;align-items:center;justify-content:center;color:#8a7fc4;font:800 22px/1 inherit;touch-action:none}
.sk.on{box-shadow:inset 0 0 0 2px var(--focus);background:#4a3b94;color:#fff}
.kb{position:absolute;left:-6px;top:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--ol);border:2px solid #cfc2ff;color:#fff;font:800 11px/14px inherit;text-align:center;padding:0 3px;z-index:3}
.hbtns{display:flex;flex-direction:column;gap:5px}
.hbtn{background:#3a2f78;border:3px solid var(--ol);box-shadow:inset 0 0 0 2px var(--rim);border-radius:10px;padding:5px 10px;font-weight:800;font-size:14px;text-align:left;white-space:nowrap;display:flex;align-items:center;gap:2px}
.hbtn .sh{display:none}
.hbtn:hover{background:#4a3b94}
.hbtn .bdg{margin-left:6px;background:var(--gold);color:var(--ol);border-radius:10px;padding:0 6px;font-size:12px}
.hbtn[aria-pressed=true]{background:#5d4fa8}

/* tooltip held / misc */
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body.noanim *{transition:none!important}
@media (max-width:640px){
 :root{--cw:calc((100vw - 38px)/10)}
 .vess{width:58px;height:70px;bottom:6px}.vess.mug{left:4px}.vess.jug{right:4px;width:56px;height:72px}
 .vess .vt{font-size:10px;bottom:2px;white-space:nowrap;right:0!important}
 .hbtn .lg{display:none}.hbtn .sh{display:inline}.keys,.kdesc{display:none}.legend{padding:6px 8px;grid-template-columns:1fr 1fr}.legend h4{grid-column:1/-1}.inv{padding:8px}.side{flex-direction:column}
 .hbar{gap:6px;bottom:6px}
 .hskills{display:none}
 .sk,.bslot{width:34px;height:34px}
 .kb{min-width:15px;height:15px;font-size:10px;line-height:11px;left:-5px;top:-5px}
 .hbtn{font-size:12px;padding:3px 6px}.hbtn kbd{display:none}
 .tip{left:8px!important;right:8px;top:auto!important;bottom:92px;width:auto;max-height:60vh;overflow:hidden}
 .dollrow{flex-direction:column;align-items:center}
 .side{width:100%}
 .sheet{margin:6px;padding:10px}
 .dstats{grid-template-columns:1fr}
 .stamp{display:none}
}

.cols{display:grid;grid-template-columns:1fr;grid-template-areas:"attr" "der" "blk" "kit";gap:0 26px}
.sc-attr{grid-area:attr}.sc-der{grid-area:der}.sc-blk{grid-area:blk}.sc-kit{grid-area:kit}
.kit{columns:2;column-gap:20px}.kit li{break-inside:avoid}
#stack{display:contents}
.drawer{top:12px;bottom:120px;opacity:1;transition:transform .24s ease,visibility 0s .24s}
.drawer.open{transition-delay:0s}
#pchar{left:0;width:350px;border-left:none;border-radius:0 16px 16px 0;transform:translateX(-104%)}
#pinv{right:0;width:440px;border-right:none;border-radius:16px 0 0 16px;transform:translateX(104%)}
.drawer.open,#pchar.open,#pinv.open{transform:none}
#pchar .ph{background:#5a6482}#pchar .ph .sub{color:#e8ecf8}
#pchar .ph::before{content:'';width:34px;height:14px;border:3px solid var(--ol);border-radius:3px;background:#ece4cf;flex:none}
#pinv .ph{background:var(--woodD)}#pinv .ph .sub{color:#fff2d8}
#pinv .ph::before{content:'';width:34px;height:14px;border:3px solid var(--ol);border-radius:4px;background:#ffd05c;flex:none}
.edge{position:fixed;top:42%;z-index:14;writing-mode:vertical-rl;padding:14px 7px;background:#3a2f78;border:3px solid var(--ol);box-shadow:inset 0 0 0 2px var(--rim);font-weight:800;font-size:14px;color:#fff;display:flex;align-items:center;gap:6px}
.edge.l{left:0;border-left:none;border-radius:0 10px 10px 0}.edge.r{right:0;border-right:none;border-radius:10px 0 0 10px}
.edge:hover{background:#4a3b94}.edge kbd{writing-mode:horizontal-tb;margin:0}
body.o-char .edge.l,body.o-inv .edge.r{display:none}
#dim{background:linear-gradient(90deg,rgba(8,6,22,.72) 0,rgba(8,6,22,.2) 34%,rgba(8,6,22,0) 50%,rgba(8,6,22,.2) 66%,rgba(8,6,22,.72) 100%)}
body.o-char:not(.o-inv) #dim{background:linear-gradient(90deg,rgba(8,6,22,.72),rgba(8,6,22,.1) 40%,transparent 60%)}
body.o-inv:not(.o-char) #dim{background:linear-gradient(270deg,rgba(8,6,22,.72),rgba(8,6,22,.1) 40%,transparent 60%)}
#pinv .inv{padding:10px 12px}
#pinv .dollrow{gap:12px}
#pinv .kdesc,#pinv .keys,#pinv .legend h4{display:none}
#pinv .legend{padding:6px 8px;font-size:13px;gap:8px}
.sheet{margin:8px;padding:10px 12px}
.sheet .fh h2{font-size:19px}.photo{width:50px;height:60px}.stamp{display:none}
.attr{padding:2px 0}
.d{font-size:14px;padding:2px 0}.dstats{gap:0 14px}
@media(min-width:641px){:root{--cw:38px}}
@media(max-width:640px){
 :root{--cw:calc((100vw - 56px)/10)}
 #stack{display:flex;flex-direction:column;position:fixed;inset:0 0 88px 0;overflow-y:auto;padding:6px;gap:6px;z-index:20;pointer-events:none}
 .drawer{position:relative;top:auto;bottom:auto;left:auto!important;right:auto!important;width:auto!important;border:4px solid var(--ol)!important;border-radius:14px!important;display:none;flex:none;transform:none!important}
 .drawer.open{display:flex;pointer-events:auto}#pinv{order:-1}
 .edge{display:none}
 #pinv .dollrow{flex-direction:column;align-items:center}
 #pinv .legend{display:none}
 #dim{background:rgba(8,6,22,.7)!important}
}
</style></head><body>
<canvas id="bg" role="img" aria-label="Dimmed game view behind the panels"></canvas><div id="dim"></div><div id="hud"></div>
<div id="stack">
<aside class="panel drawer" id="pchar" aria-label="Employee File, character sheet"><div class="ph"><h2>Employee File</h2><button class="xbtn" type="button" data-close="char" aria-label="Close Employee File (C)">×</button></div><div class="pb"><div id="sheet"></div></div></aside>
<aside class="panel drawer" id="pinv" aria-label="Desk Drawer, inventory and equipment"><div class="ph"><h2>Desk Drawer</h2><button class="xbtn" type="button" data-close="inv" aria-label="Close Desk Drawer (I)">×</button></div><div class="pb"><div id="inv"></div></div></aside>
</div>
<button class="edge l" type="button" data-act="char" aria-label="Open Employee File (C)">Employee File <kbd>C</kbd></button>
<button class="edge r" type="button" data-act="inv" aria-label="Open Desk Drawer (I)">Desk Drawer <kbd>I</kbd></button>
<div id="tip" class="tip" role="tooltip" hidden></div><div id="ghost" class="ghost" hidden aria-hidden="true"></div><div class="sr" id="live" role="status" aria-live="polite"></div>
<noscript>This mock-up needs JavaScript.</noscript>
<script>
'use strict';
/* ===== shared prototype core: data, rules, rendering. All data is synthetic. No backend. ===== */
const QS=new URLSearchParams(location.search);
const $=(s,r)=>(r||document).querySelector(s),$$=(s,r)=>[...(r||document).querySelectorAll(s)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const cap=s=>s[0].toUpperCase()+s.slice(1);
const OL='#0d0a1c';
const RAR={normal:{name:'Common',key:'square mark, thin border'},magic:{name:'Magic',key:'diamond mark, solid border'},rare:{name:'Rare',key:'star mark, double border'},unique:{name:'Unique',key:'crown mark, dashed border'}};

const ST={gold:1274,lv:7,xp:6420,xp0:5000,xp1:8150,attr:{grit:11,agility:9,stamina:10,focus:8},pts:5,skp:1,hp:0,mp:0,
 eq:{head:null,amulet:'lanyard',body:'blazer',weapon:'kbd',offhand:null,hands:null,feet:'loafers',belt:null,ring1:'signet',ring2:null},
 grid:[['opener',0,0],['chairleg',1,0],['vest',2,0],['headset',4,0],['clipboard',6,0],['keycard',8,0],['overtime',9,0],['coffee',8,1],['energy',9,1],['cinch',8,2],['gloves',4,2],['staples',6,2]].map(a=>({id:a[0],x:a[1],y:a[2]})),

function calc(att){att=att||ST.attr;const g={};for(const k in ST.eq)if(ST.eq[k]){const s=stat(ST.eq[k]);for(const q in s)g[q]=(g[q]||0)+s[q];}
 const A={};for(const k in att)A[k]=att[k]+(g[k]||0);const lv=ST.lv;
 return{A,g,hpMax:60+6*lv+4*A.stamina+(g.hp||0),mpMax:20+2*lv+3*A.focus+(g.mp||0),dmgMin:(g.dmgMin||1)+Math.floor(A.grit/3),dmgMax:(g.dmgMax||2)+Math.floor(A.grit/2),def:(g.def||0)+2*A.agility,aspd:g.aspd||0,block:g.block||0,goldf:g.goldf||0,rFire:g.rFire||0,rCold:g.rCold||0};}
{const c=calc();ST.hp=Math.round(c.hpMax*.66);ST.mp=Math.round(c.mpMax*.5);}
function reqs(it){const c=calc(),r=it.req||{},o=[];if(r.lvl)o.push({k:'Level',need:r.lvl,have:ST.lv,ok:ST.lv>=r.lvl});for(const k of['grit','agility','stamina','focus'])if(r[k])o.push({k:cap(k),need:r[k],have:c.A[k],ok:c.A[k]>=r[k]});return o;}
const unmet=it=>reqs(it).filter(r=>!r.ok);
function note(m,say){ST.notice=m;$$('.notice').forEach(n=>n.textContent=m);if(say!==false)$('#live').textContent=m;}

/* ---------- grid rules ---------- */
const gridAt=(x,y)=>ST.grid.find(g=>{const o=IT[g.id];return x>=g.x&&x<g.x+o.w&&y>=g.y&&y<g.y+o.h;});
const inB=(it,x,y)=>x>=0&&y>=0&&x+it.w<=10&&y+it.h<=4;
const overlaps=(id,x,y)=>{const it=IT[id];return ST.grid.filter(g=>{const o=IT[g.id];return g.x<x+it.w&&g.x+o.w>x&&g.y<y+it.h&&g.y+o.h>y;});};
function freeSpot(id){const it=IT[id];for(let y=0;y<4;y++)for(let x=0;x<10;x++)if(inB(it,x,y)&&!overlaps(id,x,y).length)return{x,y};return null;}
const slotOK=(it,k)=>it.slot===k||(it.slot==='ring'&&k.indexOf('ring')===0);

/* ---------- pick up / drop ---------- */
function targetAt(el){if(!el||!el.closest)return null;let n=el.closest('.cell');if(n)return{t:'grid',x:+n.dataset.x,y:+n.dataset.y,el:n};n=el.closest('.slot');if(n)return{t:'slot',k:n.dataset.slot,el:n};n=el.closest('.bslot');if(n)return{t:'belt',i:+n.dataset.belt,el:n};return null;}
function itemOf(t){if(t.t==='grid'){const g=gridAt(t.x,t.y);return g?{id:g.id,gx:t.x-g.x,gy:t.y-g.y,g}:null;}if(t.t==='slot')return ST.eq[t.k]?{id:ST.eq[t.k],gx:0,gy:0}:null;return ST.belt[t.i]?{id:ST.belt[t.i],gx:0,gy:0}:null;}
function pickup(t){const f=itemOf(t);if(!f)return false;
 if(t.t==='grid')ST.grid.splice(ST.grid.indexOf(f.g),1);else if(t.t==='slot')ST.eq[t.k]=null;else ST.belt[t.i]=null;
 ST.held={id:f.id,gx:f.gx,gy:f.gy,from:t.t==='grid'?{t:'grid',x:f.g.x,y:f.g.y}:t.t==='slot'?{t:'slot',k:t.k}:{t:'belt',i:t.i},mode:'click'};
 hideTip();note('Holding '+IT[f.id].n+'. Choose a cell or slot to place it, Escape to put it back.');return true;}
function dropCheck(t){const h=ST.held,it=IT[h.id];
 if(t.t==='grid'){const x=t.x-h.gx,y=t.y-h.gy;if(!inB(it,x,y))return{ok:0,msg:'It does not fit there.',x,y};const ov=overlaps(h.id,x,y);if(ov.length>1)return{ok:0,msg:'That would overlap two items.',x,y};return{ok:1,ov:ov[0]||null,x,y,msg:ov.length?'Swap with '+IT[ov[0].id].n+'.':'Place here.'};}
 if(t.t==='belt'){return it.slot==='potion'?{ok:1,msg:'Put on belt.'}:{ok:0,msg:'Only potions fit on the belt.'};}
 const k=t.k;if(!slotOK(it,k))return{ok:0,msg:it.n+' does not go in the '+SL[k].toLowerCase()+' slot.'};
 const u=unmet(it);if(u.length)return{ok:0,msg:'Requirement not met: '+u.map(r=>`${r.k} ${r.need} (you have ${r.have})`).join(', ')+'.'};
 if(k==='offhand'&&ST.eq.weapon&&IT[ST.eq.weapon].two)return{ok:0,msg:'A two-handed weapon blocks the off-hand slot.'};
 if(it.two&&ST.eq.offhand&&!freeSpot(ST.eq.offhand))return{ok:0,msg:'No room in the drawer for your off-hand item.'};
 return{ok:1,msg:'Equip.'};}
function doDrop(t){const h=ST.held;if(!h)return false;const c=dropCheck(t);if(!c.ok){note(c.msg);return false;}const it=IT[h.id];let sw=null;
 if(t.t==='grid'){if(c.ov){ST.grid.splice(ST.grid.indexOf(c.ov),1);sw={id:c.ov.id,from:{t:'grid',x:c.ov.x,y:c.ov.y}};}ST.grid.push({id:h.id,x:c.x,y:c.y});note('Placed '+it.n+'.');}
 else if(t.t==='belt'){const o=ST.belt[t.i];ST.belt[t.i]=h.id;if(o)sw={id:o,from:{t:'belt',i:t.i}};note(it.n+' is on belt slot '+(t.i+1)+' (key '+(t.i+1)+').');}
 else{if(it.two&&ST.eq.offhand){const p=freeSpot(ST.eq.offhand);ST.grid.push({id:ST.eq.offhand,x:p.x,y:p.y});ST.eq.offhand=null;}const o=ST.eq[t.k];ST.eq[t.k]=h.id;if(o)sw={id:o,from:{t:'slot',k:t.k}};note('Equipped '+it.n+'.');}
 ST.held=sw?{id:sw.id,gx:0,gy:0,from:sw.from,mode:'click'}:null;
 renderAll();return true;}
function cancelHold(quiet){const h=ST.held;if(!h)return;let f=h.from,it=IT[h.id],done=false;
 if(f.t==='grid'&&inB(it,f.x,f.y)&&!overlaps(h.id,f.x,f.y).length){ST.grid.push({id:h.id,x:f.x,y:f.y});done=true;}
 else if(f.t==='slot'&&!ST.eq[f.k]){ST.eq[f.k]=h.id;done=true;}
 else if(f.t==='belt'&&!ST.belt[f.i]){ST.belt[f.i]=h.id;done=true;}
 if(!done){const p=freeSpot(h.id);if(p){ST.grid.push({id:h.id,x:p.x,y:p.y});done=true;}}
 if(done){ST.held=null;if(!quiet)note(it.n+' put back.');}else note('No free space to put '+it.n+' back. Make room first.');
 renderAll();}
function usePotion(i){const id=ST.belt[i];if(!id)return;const p=IT[id],c=calc(),k=p.heal[0],mx=k==='hp'?c.hpMax:c.mpMax,before=ST[k];ST[k]=Math.min(mx,ST[k]+p.heal[1]);ST.belt[i]=null;note(`${p.n}: ${k==='hp'?'health':'mana'} +${ST[k]-before}.`);renderAll();}
function alloc(k){if(ST.pts<1){note('No attribute points left.');return;}ST.attr[k]++;ST.pts--;ST.apv='';note(`${cap(k)} is now ${ST.attr[k]}. ${ST.pts} point${ST.pts===1?'':'s'} left.`);renderAll();}

/* ---------- tooltip ---------- */
const eqFor=it=>{if(!it.slot||it.slot==='potion')return null;if(it.slot==='ring')return ST.eq.ring1||ST.eq.ring2;return ST.eq[it.slot];};
function diffs(a,b){const A=stat(a),B=b?stat(b):{},o=[],g=(s,k)=>s[k]||0;
 const dm=((g(A,'dmgMin')+g(A,'dmgMax'))-(g(B,'dmgMin')+g(B,'dmgMax')))/2;if(dm)o.push(['dmg',dm]);
 for(const k of['def','grit','agility','stamina','focus','hp','mp','aspd','block','goldf','rFire','rCold']){const d=g(A,k)-g(B,k);if(d)o.push([k,d]);}return o;}
function tipHTML(id,showCmp){const it=IT[id],s=stat(id);let h=`<div class="tn l-${it.r}">${mark(it.r,15)}<span>${it.n}</span></div><div class="tk">${RAR[it.r].name} · ${it.base} · ${it.w}×${it.h} cells</div>`;
 if(it.dmg)h+=`<div class="tb">Damage ${it.dmg[0]}–${it.dmg[1]}</div>`;
 if(it.def)h+=`<div class="tb">Defense ${it.def}</div>`;
 if(it.heal)h+=`<div class="tb">Restores ${it.heal[1]} ${it.heal[0]==='hp'?'health':'mana'}</div>`;
 for(const a of it.aff||[])h+=`<div class="ta l-${it.r}">${afx(a[0],a[1])}</div>`;
 const rq=reqs(it);if(rq.length)h+='<div class="tr">'+rq.map(r=>`<span class="${r.ok?'yes':'no'}">${r.ok?'✓':'✗'} ${r.k} ${r.need}${r.ok?'':' (you have '+r.have+', need '+(r.need-r.have)+' more)'}</span>`).join('')+'</div>';
 if(it.fl)h+=`<div class="tf">“${it.fl}”</div>`;
 h+=`<div class="tv">Sells for ${it.val} gold</div>`;
 if(showCmp){const eq=eqFor(it);if(eq){const d=diffs(id,eq),up=d.filter(x=>x[1]>0).length,dn=d.filter(x=>x[1]<0).length;
  h+=`<div class="cmp"><h4>Compared with equipped</h4><div class="cn l-${IT[eq].r}">${mark(IT[eq].r,13)}<span>${IT[eq].n}</span></div>`;
  h+=d.map(x=>{const v=x[1],f=Number.isInteger(v)?Math.abs(v):Math.abs(v).toFixed(1);return`<div class="df ${v>0?'up':'dn'}">${arrow(v>0)}<span>${v>0?'+':'−'}${f}${PCT[x[0]]?'%':''} ${STAT[x[0]]}</span></div>`;}).join('')||'<div>Same stats.</div>';
  h+=`<div class="vd ${dn&&!up?'dn':up&&!dn?'up':''}">${up&&!dn?'Upgrade: better in every changed stat.':dn&&!up?'Downgrade: worse in every changed stat.':d.length?'Mixed: better in some stats, worse in others.':''}</div></div>`;}
  else if(it.slot&&it.slot!=='potion')h+='<div class="cmp"><h4>Compared with equipped</h4><div>Nothing equipped in this slot.</div></div>';}
 return h;}
